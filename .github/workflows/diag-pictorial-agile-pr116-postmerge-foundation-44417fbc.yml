name: diag-pictorial-agile-pr116-postmerge-foundation-44417fbc

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - name: Locate exact PR116 post-merge Foundation push run
        shell: bash
        run: |
          set -euo pipefail
          target_head='44417fbcdee3a8e1d82e9e30974486cd4592a1f0'
          not_before='2026-08-22T19:39:59Z'
          api='https://api.github.com/repos/TheHalfMoon/wepld/actions/runs?event=push&per_page=100'
          data="$(curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --retry-all-errors "$api")"
          matches="$(printf '%s' "$data" | jq -c --arg head "$target_head" --arg not_before "$not_before" '[.workflow_runs[] | select(.head_sha == $head and .name == "foundation-integrity" and .created_at >= $not_before)]')"
          count="$(printf '%s' "$matches" | jq 'length')"
          echo "MATCH_COUNT=$count"
          printf '%s' "$matches" | jq -r '.[] | "RUN_ID=\(.id) RUN_NUMBER=\(.run_number) WORKFLOW=\(.name) EVENT=\(.event) STATUS=\(.status) CONCLUSION=\(.conclusion // "null") CREATED_AT=\(.created_at) IMMUTABLE_HEAD_SHA=\(.head_sha // "") HEAD_BRANCH=\(.head_branch // "")"'
          test "$count" -eq 1
          echo 'MERGE=NEVER'
