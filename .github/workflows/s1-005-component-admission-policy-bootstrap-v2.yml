name: S1-005 bootstrap component admission policy candidate v2

on:
  push:
    branches:
      - bootstrap/s1-005-component-admission-policy

permissions:
  contents: write

jobs:
  build-policy-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_BASE: f1919396eacb90d8d947b06f023ae9da233a4580
      EXPECTED_BASE_TREE: 902265157e9db7a0775d9794edd9db8d03724354
      EXPECTED_SCRIPT_BLOB: 213c7b35fd24409a97d3fe16f16e3cb763c78a85
      TARGET_BRANCH: ci/s1-005-component-admission-integrity
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact bootstrap head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify immutable bootstrap inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:.github/scripts/wepld_integrity.py)" = "$EXPECTED_SCRIPT_BLOB"
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          expected = os.environ["EXPECTED_BASE"]
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/git/ref/heads/main",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "wepld-s1-005-policy-bootstrap",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              obj = json.load(response)
          if obj.get("object", {}).get("sha") != expected:
              raise SystemExit("ABORT: canonical main moved before bootstrap validation")
          PY

      - name: Apply exact policy patch and spec
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/bootstrap/s1_005_component_policy_patch.py
          cp \
            .github/bootstrap/s1-005-component-admission-integrity.md.template \
            specs/001-desktop-rust-trusted-core-handshake/s1-005-component-admission-integrity.md

      - name: Validate candidate policy
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/wepld_integrity.py
          python3 .github/scripts/wepld_integrity.py selftest
          python3 .github/scripts/wepld_integrity.py verify-local \
            --root . \
            --remote-baseline \
            --pr-base-sha "$EXPECTED_BASE"

          git add -- \
            .github/scripts/wepld_integrity.py \
            specs/001-desktop-rust-trusted-core-handshake/s1-005-component-admission-integrity.md
          git diff --cached --check

          mapfile -t changed < <(git diff --cached --name-only)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/scripts/wepld_integrity.py"
          test "${changed[1]}" = "specs/001-desktop-rust-trusted-core-handshake/s1-005-component-admission-integrity.md"
          test "$(git diff --cached --name-only -- .github/workflows .github/bootstrap | wc -l)" -eq 0

      - name: Create isolated policy branch from canonical main
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          expected_base = os.environ["EXPECTED_BASE"]
          expected_base_tree = os.environ["EXPECTED_BASE_TREE"]
          target_branch = os.environ["TARGET_BRANCH"]
          api = f"https://api.github.com/repos/{repo}"

          def request(method, path, payload=None, allow_404=False):
              data = None if payload is None else json.dumps(payload, separators=(",", ":")).encode("utf-8")
              req = urllib.request.Request(
                  api + path,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "wepld-s1-005-policy-bootstrap",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return json.loads(resp.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  if allow_404 and exc.code == 404:
                      return None
                  body = exc.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"ABORT: GitHub API {method} {path} failed: {exc.code} {body}")

          main_ref = request("GET", "/git/ref/heads/main")
          if main_ref.get("object", {}).get("sha") != expected_base:
              raise SystemExit("ABORT: canonical main moved during policy bootstrap")

          target_path = "/git/ref/heads/" + urllib.parse.quote(target_branch, safe="/")
          if request("GET", target_path, allow_404=True) is not None:
              raise SystemExit("ABORT: target policy branch already exists")

          base_commit = request("GET", f"/git/commits/{expected_base}")
          if base_commit.get("tree", {}).get("sha") != expected_base_tree:
              raise SystemExit("ABORT: canonical base tree identity mismatch")

          entries = []
          for rel in [
              ".github/scripts/wepld_integrity.py",
              "specs/001-desktop-rust-trusted-core-handshake/s1-005-component-admission-integrity.md",
          ]:
              raw = pathlib.Path(rel).read_bytes()
              blob = request("POST", "/git/blobs", {
                  "content": base64.b64encode(raw).decode("ascii"),
                  "encoding": "base64",
              })
              sha = blob.get("sha")
              if not isinstance(sha, str) or len(sha) != 40:
                  raise SystemExit(f"ABORT: malformed blob response for {rel}")
              entries.append({"path": rel, "mode": "100644", "type": "blob", "sha": sha})

          tree = request("POST", "/git/trees", {
              "base_tree": expected_base_tree,
              "tree": entries,
          })
          tree_sha = tree.get("sha")
          if not isinstance(tree_sha, str) or len(tree_sha) != 40:
              raise SystemExit("ABORT: malformed candidate tree response")

          commit = request("POST", "/git/commits", {
              "message": "ci(s1): admit exact frozen glib component candidate",
              "tree": tree_sha,
              "parents": [expected_base],
          })
          new_head = commit.get("sha")
          if not isinstance(new_head, str) or len(new_head) != 40:
              raise SystemExit("ABORT: malformed policy commit response")

          main_ref_2 = request("GET", "/git/ref/heads/main")
          if main_ref_2.get("object", {}).get("sha") != expected_base:
              raise SystemExit("ABORT: canonical main raced before target ref creation")

          created = request("POST", "/git/refs", {
              "ref": "refs/heads/" + target_branch,
              "sha": new_head,
          })
          if created.get("object", {}).get("sha") != new_head:
              raise SystemExit("ABORT: target ref identity mismatch")

          print("WEPLD_S1_005_POLICY_CANDIDATE")
          print(f"BASE={expected_base}")
          print(f"NEW_HEAD={new_head}")
          print(f"NEW_TREE={tree_sha}")
          print(f"BRANCH={target_branch}")
          print("CHANGED_PATHS=2")
          print("SOURCE_ACQUISITION_CHECK=OPEN")
          print("RUNTIME_DEPENDENCY_ADMISSION=NONE")
          print("PRODUCT_IMPLEMENTATION=BLOCKED")
          PY
