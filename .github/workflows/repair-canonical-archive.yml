name: repair-canonical-archive

on:
  push:
    branches:
      - docs/fresh-reconstitution-v1

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: docs/fresh-reconstitution-v1

      - name: Repair only from fully recoverable verified members
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import gzip
          import hashlib
          import io
          import json
          import pathlib
          import re
          import tarfile
          import zlib

          archive_path = pathlib.Path(
              "docs/canonical/artifacts/WEPLD_CANONICAL_ARTIFACTS_2026-08-14.tar.gz"
          )
          integrity_path = pathlib.Path(".github/workflows/foundation-integrity.yml")
          readme_path = pathlib.Path("docs/canonical/artifacts/README.md")

          expected_plan_sha256 = (
              "e269b10ef711731c4ad3af7b1135546f92d82a78975cabc9ff52c2dea4b5bf44"
          )
          expected_members = {
              "WEPLD_MASTER_ARCHITECTURE_EXECUTION_PLAN_2026-08-12_V2_2.md",
              "WEPLD_MASTER_SOURCE_REGISTRY_2026-08-14_V1.json",
              "WEPLD_MASTER_SOURCE_REGISTRY_2026-08-14_V1.csv",
              "WEPLD_SOURCE_ARTIFACT_PIN_LEDGER_2026-08-14_V1.md",
              "WEPLD_SOURCE_CAPABILITY_MINING_PRIORITY_MATRIX_2026-08-14_V1.md",
          }

          original = archive_path.read_bytes()
          try:
              gzip.decompress(original)
              raise SystemExit("archive is already valid; refusing unnecessary repair")
          except (EOFError, gzip.BadGzipFile, zlib.error):
              pass

          d = zlib.decompressobj(16 + zlib.MAX_WBITS)
          recovered_tar = d.decompress(original) + d.flush()
          if not recovered_tar:
              raise SystemExit("corrupt archive yielded no recoverable tar payload")

          payloads = {}
          try:
              with tarfile.open(fileobj=io.BytesIO(recovered_tar), mode="r|") as tf:
                  for member in tf:
                      if not member.isfile():
                          raise SystemExit(f"non-regular recovered member: {member.name}")
                      extracted = tf.extractfile(member)
                      if extracted is None:
                          raise SystemExit(f"unable to read recovered member: {member.name}")
                      data = extracted.read()
                      if len(data) != member.size:
                          raise SystemExit(
                              f"truncated recovered member {member.name}: {len(data)} != {member.size}"
                          )
                      payloads[member.name] = data
          except tarfile.ReadError as exc:
              if set(payloads) != expected_members:
                  raise SystemExit(
                      f"tar ended before all required members were recovered: {sorted(payloads)}"
                  ) from exc

          if set(payloads) != expected_members:
              raise SystemExit(
                  f"recovered member mismatch: expected={sorted(expected_members)} actual={sorted(payloads)}"
              )

          plan_name = "WEPLD_MASTER_ARCHITECTURE_EXECUTION_PLAN_2026-08-12_V2_2.md"
          actual_plan_sha256 = hashlib.sha256(payloads[plan_name]).hexdigest()
          if actual_plan_sha256 != expected_plan_sha256:
              raise SystemExit(f"master-plan SHA mismatch: {actual_plan_sha256}")

          registry_name = "WEPLD_MASTER_SOURCE_REGISTRY_2026-08-14_V1.json"
          registry = json.loads(payloads[registry_name].decode("utf-8"))
          rows = registry.get("registry")
          if not isinstance(rows, list) or len(rows) != 402:
              raise SystemExit("JSON registry does not contain exactly 402 rows")
          names = [row.get("name") for row in rows]
          normalized = [name.casefold() for name in names if isinstance(name, str)]
          if len(normalized) != 402 or len(set(normalized)) != 402:
              raise SystemExit("JSON registry names are malformed or non-unique")
          if any(row.get("admission_status") != "NOT_ADMITTED" for row in rows):
              raise SystemExit("JSON registry unexpectedly contains an admitted source")
          counts = registry.get("counts", {})
          if (
              counts.get("frozen_v1_5_named_entries") != 397
              or counts.get("post_v1_5_new_top_level_named_entries") != 5
              or counts.get("current_accounted_named_entries") != 402
          ):
              raise SystemExit(f"registry count anchors mismatch: {counts}")

          csv_name = "WEPLD_MASTER_SOURCE_REGISTRY_2026-08-14_V1.csv"
          csv_rows = list(csv.DictReader(io.StringIO(payloads[csv_name].decode("utf-8"))))
          if len(csv_rows) != 402:
              raise SystemExit("CSV registry does not contain exactly 402 rows")
          csv_names = [row.get("name", "").casefold() for row in csv_rows]
          if len(set(csv_names)) != 402:
              raise SystemExit("CSV registry names are non-unique")

          for name in expected_members - {plan_name, registry_name, csv_name}:
              if not payloads[name].strip():
                  raise SystemExit(f"canonical artifact is empty: {name}")

          rebuilt_tar = io.BytesIO()
          with tarfile.open(fileobj=rebuilt_tar, mode="w", format=tarfile.USTAR_FORMAT) as tf:
              for name in sorted(expected_members):
                  data = payloads[name]
                  info = tarfile.TarInfo(name)
                  info.size = len(data)
                  info.mtime = 0
                  info.mode = 0o644
                  info.uid = 0
                  info.gid = 0
                  info.uname = ""
                  info.gname = ""
                  tf.addfile(info, io.BytesIO(data))

          repaired = gzip.compress(rebuilt_tar.getvalue(), compresslevel=9, mtime=0)
          with tarfile.open(fileobj=io.BytesIO(repaired), mode="r:gz") as tf:
              if {member.name for member in tf.getmembers()} != expected_members:
                  raise SystemExit("rebuilt archive failed final member verification")

          new_sha256 = hashlib.sha256(repaired).hexdigest()
          archive_path.write_bytes(repaired)

          integrity = integrity_path.read_text(encoding="utf-8")
          integrity, count = re.subn(
              r'(?<=expected_archive_sha256 = \(\n              ")[0-9a-f]{64}',
              new_sha256,
              integrity,
              count=1,
          )
          if count != 1:
              raise SystemExit("could not update integrity workflow archive hash")
          integrity_path.write_text(integrity, encoding="utf-8")

          readme = readme_path.read_text(encoding="utf-8")
          readme, count = re.subn(r'(?<=SHA256 = )[0-9a-f]{64}', new_sha256, readme, count=1)
          if count != 1:
              raise SystemExit("could not update artifact README hash")
          readme_path.write_text(readme, encoding="utf-8")

          print("canonical archive recovery verified: PASS")
          print(f"repaired_archive_sha256={new_sha256}")
          PY

          git rm -f -- \
            .github/workflows/repair-canonical-archive.yml \
            .github/repair-payload/chunk01.b64

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/repair-payload/chunk01.b64 \
            .github/workflows/foundation-integrity.yml \
            .github/workflows/repair-canonical-archive.yml \
            docs/canonical/artifacts/README.md \
            docs/canonical/artifacts/WEPLD_CANONICAL_ARTIFACTS_2026-08-14.tar.gz | sort)"

          if [ "$changed" != "$expected" ]; then
            echo "Unexpected repair scope:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/foundation-integrity.yml \
            docs/canonical/artifacts/README.md \
            docs/canonical/artifacts/WEPLD_CANONICAL_ARTIFACTS_2026-08-14.tar.gz
          git commit -m "fix: repair canonical artifact archive"
          git push origin HEAD:docs/fresh-reconstitution-v1
