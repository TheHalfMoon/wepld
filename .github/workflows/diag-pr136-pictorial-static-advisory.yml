name: diag-pr136-pictorial-static-advisory

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact admitted PR136 Pictorial lock as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 28f0023b8ffb90c585213762dae5f4c1d57322ef
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
          sparse-checkout: vendor/pictorial/bun.lock
          sparse-checkout-cone-mode: false

      - name: Query OSV for exact locked npm identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import urllib.request
          from pathlib import Path

          SOURCE_HEAD = "28f0023b8ffb90c585213762dae5f4c1d57322ef"
          LOCK_BLOB = "f7114d1b93f26eb9d7796fc15ae3d639d2209c9d"
          QUERY_URL = "https://api.osv.dev/v1/querybatch"

          lock_bytes = Path("vendor/pictorial/bun.lock").read_bytes()

          def git_blob_sha1(data: bytes) -> str:
              return hashlib.sha1(f"blob {len(data)}\0".encode("ascii") + data).hexdigest()

          assert git_blob_sha1(lock_bytes) == LOCK_BLOB

          def strip_trailing_commas(text: str) -> str:
              out: list[str] = []
              in_string = False
              escaped = False
              i = 0
              while i < len(text):
                  ch = text[i]
                  if in_string:
                      out.append(ch)
                      if escaped:
                          escaped = False
                      elif ch == "\\":
                          escaped = True
                      elif ch == '"':
                          in_string = False
                      i += 1
                      continue
                  if ch == '"':
                      in_string = True
                      out.append(ch)
                      i += 1
                      continue
                  if ch == ',':
                      j = i + 1
                      while j < len(text) and text[j].isspace():
                          j += 1
                      if j < len(text) and text[j] in '}]':
                          i += 1
                          continue
                  out.append(ch)
                  i += 1
              return ''.join(out)

          packages = json.loads(strip_trailing_commas(lock_bytes.decode("utf-8")))["packages"]
          assert len(packages) == 233

          def split_identity(identity: str) -> tuple[str, str]:
              if identity.startswith("@"):
                  pos = identity.rfind("@")
                  return identity[:pos], identity[pos + 1:]
              return tuple(identity.rsplit("@", 1))  # type: ignore[return-value]

          lock_identity: dict[str, tuple[str, str]] = {
              key: split_identity(row[0]) for key, row in packages.items()
          }
          identities = sorted(set(lock_identity.values()))
          queries = [
              {"package": {"ecosystem": "npm", "name": name}, "version": version}
              for name, version in identities
          ]
          request_obj = {"queries": queries}
          request_bytes = json.dumps(request_obj, sort_keys=True, separators=(",", ":")).encode("utf-8")
          req = urllib.request.Request(
              QUERY_URL,
              data=request_bytes,
              headers={"Content-Type": "application/json", "User-Agent": "wepld-static-sbom-qualification/1"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=60) as response:
              response_bytes = response.read()
          response_obj = json.loads(response_bytes)
          results = response_obj.get("results")
          if not isinstance(results, list) or len(results) != len(identities):
              raise AssertionError("OSV querybatch result cardinality mismatch")

          affected: list[dict] = []
          vuln_ids: set[str] = set()
          for identity, result in zip(identities, results, strict=True):
              vulns = result.get("vulns", []) if isinstance(result, dict) else []
              if vulns:
                  ids = sorted({str(v["id"]) for v in vulns if isinstance(v, dict) and "id" in v})
                  affected.append({"name": identity[0], "version": identity[1], "vulnerability_ids": ids})
                  vuln_ids.update(ids)

          details: dict[str, dict] = {}
          for vuln_id in sorted(vuln_ids):
              url = f"https://api.osv.dev/v1/vulns/{urllib.parse.quote(vuln_id, safe='')}"
              detail_req = urllib.request.Request(url, headers={"User-Agent": "wepld-static-sbom-qualification/1"})
              with urllib.request.urlopen(detail_req, timeout=60) as response:
                  details[vuln_id] = json.loads(response.read())

          out = Path("diag-advisory-output")
          out.mkdir()
          canonical_response = (json.dumps(response_obj, sort_keys=True, separators=(",", ":")) + "\n").encode("utf-8")
          (out / "pictorial-osv-query-request.json").write_bytes(request_bytes + b"\n")
          (out / "pictorial-osv-query-response.json").write_bytes(canonical_response)
          (out / "pictorial-osv-vulnerability-details.json").write_text(
              json.dumps(details, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          summary = {
              "subject_pr": 136,
              "subject_head": SOURCE_HEAD,
              "bun_lock_git_blob": LOCK_BLOB,
              "lock_entries": len(packages),
              "unique_npm_identities_queried": len(identities),
              "affected_unique_identities": len(affected),
              "affected": affected,
              "unique_vulnerability_ids": sorted(vuln_ids),
              "osv_endpoint": QUERY_URL,
              "osv_response_sha256": hashlib.sha256(canonical_response).hexdigest(),
              "dependency_admission": "NONE",
              "package_execution": "NONE",
              "donor_code_execution": "NONE",
          }
          (out / "pictorial-osv-summary.json").write_text(
              json.dumps(summary, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Upload static advisory evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr136-pictorial-static-advisory
          path: diag-advisory-output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
