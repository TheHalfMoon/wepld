name: s2-v30-policy-content-binding-repair-builder

on:
  push:
    branches:
      - diag/s2-v30-policy-qualification-2026-08-29

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      V30_HEAD: 9d5a9315b13bf554fb7ed12acd26aa508d91e3e8
    steps:
      - name: Checkout diagnostic branch with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          lfs: false
          submodules: false

      - name: Build and locally validate exact v30 policy-content binding repair blobs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import tempfile
          import urllib.request

          head = os.environ["V30_HEAD"]
          policy_path = ".github/scripts/wepld_s2_identity_store_governance_v30_integrity.py"
          test_path = ".github/scripts/wepld_s2_identity_store_governance_v30_selftest.py"

          def show(path: str) -> bytes:
              return subprocess.check_output(["git", "show", f"{head}:{path}"])

          policy = show(policy_path)
          test = show(test_path)

          files_old = b'''    for path in sorted(POLICY_FILES):\n        if p.s.r.q.p.mode(view, path) != "100644":\n            base.fail(f"v30 policy file mode invalid: {path}")\n'''
          files_new = b'''    approved = {\n        P: root.read_bytes(P, base.MAX_POLICY_FILE_BYTES),\n        T: root.read_bytes(T, base.MAX_POLICY_FILE_BYTES),\n    }\n    for path in sorted(POLICY_FILES):\n        if p.s.r.q.p.mode(view, path) != "100644":\n            base.fail(f"v30 policy file mode invalid: {path}")\n        if view.read_bytes(path, base.MAX_POLICY_FILE_BYTES) != approved[path]:\n            base.fail(f"v30 policy file content drifted: {path}")\n'''
          if policy.count(files_old) != 1:
              raise SystemExit(f"v30 files() content-binding target drifted: count={policy.count(files_old)}")
          policy = policy.replace(files_old, files_new, 1)

          test_marker = b'''    p.install()\n    p.files(view)\n    paths = base.validate_entries(view.entries())\n'''
          test_replacement = b'''    p.install()\n    p.files(view)\n\n    wrong_policy_file = OverlayView(\n        view,\n        {\n            p.P: view.read_bytes(p.P, base.MAX_POLICY_FILE_BYTES) + b"\\n",\n        },\n    )\n    base.expect_failure_matching(\n        "v30 rejects substituted policy bytes",\n        "v30 policy file content drifted",\n        p.files,\n        wrong_policy_file,\n    )\n\n    wrong_selftest_file = OverlayView(\n        view,\n        {\n            p.T: view.read_bytes(p.T, base.MAX_POLICY_FILE_BYTES) + b"\\n",\n        },\n    )\n    base.expect_failure_matching(\n        "v30 rejects substituted self-test bytes",\n        "v30 policy file content drifted",\n        p.files,\n        wrong_selftest_file,\n    )\n\n    paths = base.validate_entries(view.entries())\n'''
          if test.count(test_marker) != 1:
              raise SystemExit(f"v30 self-test policy-binding insertion target drifted: count={test.count(test_marker)}")
          repaired_test = test.replace(test_marker, test_replacement, 1)

          def git_blob(data: bytes) -> str:
              return hashlib.sha1(
                  f"blob {len(data)}\0".encode("ascii") + data,
                  usedforsecurity=False,
              ).hexdigest()

          repaired_test_blob = git_blob(repaired_test)
          old_pin = b'T_BLOB = "d1d20af2ddf0fccf0bb13c3673ee695b6a049f22"'
          new_pin = f'T_BLOB = "{repaired_test_blob}"'.encode("ascii")
          if policy.count(old_pin) != 1:
              raise SystemExit("v30 policy current self-test pin drifted")
          repaired_policy = policy.replace(old_pin, new_pin, 1)

          if repaired_policy.count(b"v30 policy file content drifted") != 1:
              raise SystemExit("v30 policy content-binding assertion drifted")
          if repaired_test.count(b"v30 rejects substituted policy bytes") != 1:
              raise SystemExit("v30 policy substitution regression missing")
          if repaired_test.count(b"v30 rejects substituted self-test bytes") != 1:
              raise SystemExit("v30 self-test substitution regression missing")

          with tempfile.TemporaryDirectory(prefix="wepld-v30-bind-") as td:
              work = pathlib.Path(td) / "repo"
              subprocess.check_call(["git", "worktree", "add", "--detach", str(work), head], stdout=subprocess.DEVNULL)
              try:
                  (work / policy_path).write_bytes(repaired_policy)
                  (work / test_path).write_bytes(repaired_test)
                  env = dict(os.environ)
                  env["PYTHONDONTWRITEBYTECODE"] = "1"
                  subprocess.check_call(
                      ["python", str(work / policy_path), "selftest"],
                      cwd=work,
                      env=env,
                  )
              finally:
                  subprocess.call(["git", "worktree", "remove", "--force", str(work)], stdout=subprocess.DEVNULL)

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]

          def create_blob(label: str, data: bytes) -> str:
              payload = json.dumps({"content": base64.b64encode(data).decode("ascii"), "encoding": "base64"}).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/git/blobs",
                  data=payload,
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                      "User-Agent": "wepld-s2-v30-policy-content-binding-repair-builder",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              remote = result["sha"]
              local = git_blob(data)
              if remote != local:
                  raise SystemExit(f"GitHub/local blob mismatch for {label}: {remote} != {local}")
              print(f"{label}_BLOB_SHA={remote}")
              print(f"{label}_SHA256={hashlib.sha256(data).hexdigest()}")
              print(f"{label}_BYTES={len(data)}")
              return remote

          create_blob("V30_SELFTEST_POLICY_BINDING_REPAIRED", repaired_test)
          create_blob("V30_POLICY_CONTENT_BINDING_REPAIRED", repaired_policy)
          print("REF_MUTATION=NONE_BY_BUILDER")
          print("REAL_CANDIDATE_DELTA_PROJECTION=NONE")
          print("POLICY_CONTENT_BINDING=P_AND_T_TO_EXECUTING_APPROVED_SOURCE_BYTES")
          PY
