name: diag-pr136-pictorial-lock-repair-resolver

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exact admitted PR136 source without credentials
        shell: bash
        env:
          SOURCE_HEAD: 28f0023b8ffb90c585213762dae5f4c1d57322ef
        run: |
          set -euo pipefail
          mkdir subject
          cd subject
          git init -q
          git remote add origin https://github.com/TheHalfMoon/wepld.git
          git -c credential.helper= fetch --depth=1 --no-tags origin "$SOURCE_HEAD"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git hash-object vendor/pictorial/package.json)" = "ba646522c498af6e9bfa02fd1dba2f098d9f6d42"
          test "$(git hash-object vendor/pictorial/bun.lock)" = "f7114d1b93f26eb9d7796fc15ae3d639d2209c9d"

      - name: Setup pinned Bun resolver
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true
          token: ''

      - name: Resolve only the two direct parent surfaces into lock metadata
        shell: bash
        env:
          HOME: ${{ runner.temp }}/wepld-empty-home
          NPM_CONFIG_USERCONFIG: /dev/null
          NPM_TOKEN: ''
          NODE_AUTH_TOKEN: ''
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          cd subject/vendor/pictorial

          for f in .npmrc bunfig.toml ../../.npmrc ../../bunfig.toml ../../../.npmrc ../../../bunfig.toml; do
            if [ -e "$f" ]; then
              echo "unexpected package-manager config in resolution ancestry: $f" >&2
              exit 1
            fi
          done

          cp package.json /tmp/package.before.json
          cp bun.lock /tmp/bun.before.lock
          package_before="$(sha256sum package.json | awk '{print $1}')"
          lock_before="$(sha256sum bun.lock | awk '{print $1}')"

          bun update archiver @anthropic-ai/claude-agent-sdk \
            --lockfile-only \
            --ignore-scripts \
            --no-cache \
            --registry https://registry.npmjs.org

          test ! -e node_modules
          cmp -s /tmp/package.before.json package.json
          package_after="$(sha256sum package.json | awk '{print $1}')"
          lock_after="$(sha256sum bun.lock | awk '{print $1}')"
          test "$package_before" = "$package_after"
          test "$lock_before" != "$lock_after"

          mkdir -p "$GITHUB_WORKSPACE/resolution-output"
          cp bun.lock "$GITHUB_WORKSPACE/resolution-output/proposed-bun.lock"
          git diff --no-index -- /tmp/bun.before.lock bun.lock > "$GITHUB_WORKSPACE/resolution-output/bun-lock.diff" || test "$?" -eq 1
          printf '%s\n' "$package_before" > "$GITHUB_WORKSPACE/resolution-output/package-json-sha256.txt"
          printf '%s\n' "$lock_before" > "$GITHUB_WORKSPACE/resolution-output/bun-lock-before-sha256.txt"
          printf '%s\n' "$lock_after" > "$GITHUB_WORKSPACE/resolution-output/bun-lock-after-sha256.txt"
          bun --version > "$GITHUB_WORKSPACE/resolution-output/bun-version.txt"

      - name: Fail-closed static SBOM and OSV qualification of proposed lock
        shell: bash
        env:
          SOURCE_HEAD: 28f0023b8ffb90c585213762dae5f4c1d57322ef
          PACKAGE_BLOB: ba646522c498af6e9bfa02fd1dba2f098d9f6d42
          ORIGINAL_LOCK_BLOB: f7114d1b93f26eb9d7796fc15ae3d639d2209c9d
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import os
          import urllib.parse
          import urllib.request
          import uuid
          from pathlib import Path

          source_head = os.environ["SOURCE_HEAD"]
          package_blob = os.environ["PACKAGE_BLOB"]
          original_lock_blob = os.environ["ORIGINAL_LOCK_BLOB"]
          package_path = Path("subject/vendor/pictorial/package.json")
          lock_path = Path("resolution-output/proposed-bun.lock")
          package_bytes = package_path.read_bytes()
          lock_bytes = lock_path.read_bytes()
          package = json.loads(package_bytes)

          def strip_trailing_commas(text: str) -> str:
              out: list[str] = []
              in_string = False
              escaped = False
              i = 0
              while i < len(text):
                  ch = text[i]
                  if in_string:
                      out.append(ch)
                      if escaped:
                          escaped = False
                      elif ch == "\\":
                          escaped = True
                      elif ch == '"':
                          in_string = False
                      i += 1
                      continue
                  if ch == '"':
                      in_string = True
                      out.append(ch)
                      i += 1
                      continue
                  if ch == ',':
                      j = i + 1
                      while j < len(text) and text[j].isspace():
                          j += 1
                      if j < len(text) and text[j] in '}]':
                          i += 1
                          continue
                  out.append(ch)
                  i += 1
              return ''.join(out)

          lock = json.loads(strip_trailing_commas(lock_bytes.decode("utf-8")))
          if lock.get("lockfileVersion") != 1 or lock.get("configVersion") != 1:
              raise AssertionError("unexpected Bun lockfile/config version")
          workspace = lock["workspaces"][""]
          packages = lock["packages"]
          if not isinstance(packages, dict) or not packages:
              raise AssertionError("empty or malformed package graph")

          scopes = {
              "runtime": dict(package.get("dependencies", {})),
              "dev": dict(package.get("devDependencies", {})),
              "optional": dict(package.get("optionalDependencies", {})),
          }
          for source_key, workspace_key in (
              ("runtime", "dependencies"),
              ("dev", "devDependencies"),
              ("optional", "optionalDependencies"),
          ):
              if scopes[source_key] != dict(workspace.get(workspace_key, {})):
                  raise AssertionError(f"root declaration drift in {source_key}")

          direct_scope: dict[str, str] = {}
          for scope, deps in scopes.items():
              for name in deps:
                  if name in direct_scope:
                      raise AssertionError(f"duplicate direct dependency across scopes: {name}")
                  direct_scope[name] = scope
                  if name not in packages:
                      raise AssertionError(f"root lock entry missing for {name}")

          def split_identity(identity: str) -> tuple[str, str]:
              if identity.startswith("@"):
                  pos = identity.rfind("@")
                  if pos <= 0:
                      raise ValueError(identity)
                  return identity[:pos], identity[pos + 1:]
              return tuple(identity.rsplit("@", 1))  # type: ignore[return-value]

          parsed: dict[str, dict] = {}
          missing_sri: list[str] = []
          for lock_key, row in packages.items():
              if not isinstance(row, list) or len(row) < 2 or not isinstance(row[0], str):
                  raise AssertionError(f"malformed lock row: {lock_key}")
              name, version = split_identity(row[0])
              metadata = next((item for item in row[2:] if isinstance(item, dict)), {})
              sri = next((item for item in reversed(row[2:]) if isinstance(item, str) and item.startswith("sha512-")), None)
              if sri is None:
                  missing_sri.append(lock_key)
              parsed[lock_key] = {"name": name, "version": version, "metadata": metadata, "sri": sri}
          if missing_sri:
              raise AssertionError(f"lock entries missing SHA-512 SRI: {missing_sri}")

          forbidden = {
              ("@hono/node-server", "1.19.14"),
              ("body-parser", "2.2.2"),
              ("brace-expansion", "5.0.6"),
              ("fast-uri", "3.1.0"),
              ("hono", "4.12.14"),
              ("ip-address", "10.1.0"),
              ("qs", "6.15.1"),
          }
          remaining = sorted({(v["name"], v["version"]) for v in parsed.values()} & forbidden)
          if remaining:
              raise AssertionError(f"known vulnerable exact identities remain: {remaining}")

          def resolve_dep(parent_key: str, dep_name: str) -> str | None:
              parent_name = parsed[parent_key]["name"]
              for candidate in (f"{parent_key}/{dep_name}", f"{parent_name}/{dep_name}", dep_name):
                  if candidate in packages:
                      return candidate
              return None

          edges: dict[str, list[str]] = {}
          unresolved_required: list[dict[str, str]] = []
          unresolved_optional_peer: list[dict[str, str]] = []
          for lock_key, info in parsed.items():
              metadata = info["metadata"]
              optional_peers = set(metadata.get("optionalPeers", [])) if isinstance(metadata.get("optionalPeers", []), list) else set()
              targets: list[str] = []
              for field in ("dependencies", "optionalDependencies", "peerDependencies"):
                  deps = metadata.get(field, {})
                  if not isinstance(deps, dict):
                      continue
                  for dep_name in sorted(deps):
                      target = resolve_dep(lock_key, dep_name)
                      if target is not None:
                          targets.append(target)
                      elif field == "peerDependencies" and dep_name in optional_peers:
                          unresolved_optional_peer.append({"parent": lock_key, "dependency": dep_name})
                      else:
                          unresolved_required.append({"parent": lock_key, "dependency": dep_name, "field": field})
              edges[lock_key] = sorted(set(targets))
          if unresolved_required:
              raise AssertionError(f"unresolved required lock edges: {unresolved_required}")

          components: list[dict] = []
          inventory_rows: list[dict] = []
          for lock_key in sorted(parsed):
              info = parsed[lock_key]
              digest = base64.b64decode(info["sri"][len("sha512-"):], validate=True).hex()
              component = {
                  "type": "library",
                  "bom-ref": f"bun-lock:{lock_key}",
                  "name": info["name"],
                  "version": info["version"],
                  "purl": f"pkg:npm/{urllib.parse.quote(info['name'], safe='/')}@{urllib.parse.quote(info['version'], safe='.-_+')}",
                  "hashes": [{"alg": "SHA-512", "content": digest}],
                  "properties": [
                      {"name": "wepld:bun_lock_key", "value": lock_key},
                      {"name": "wepld:bound_source_head", "value": source_head},
                      {"name": "wepld:original_lock_blob", "value": original_lock_blob},
                  ],
              }
              if lock_key in direct_scope:
                  component["properties"].append({"name": "wepld:root_scope", "value": direct_scope[lock_key]})
              components.append(component)
              inventory_rows.append({
                  "lock_key": lock_key,
                  "name": info["name"],
                  "version": info["version"],
                  "sri": info["sri"],
                  "root_scope": direct_scope.get(lock_key),
                  "dependencies": edges[lock_key],
              })

          identities = sorted({(v["name"], v["version"]) for v in parsed.values()})
          request_obj = {"queries": [
              {"package": {"ecosystem": "npm", "name": name}, "version": version}
              for name, version in identities
          ]}
          request_bytes = json.dumps(request_obj, sort_keys=True, separators=(",", ":")).encode("utf-8")
          req = urllib.request.Request(
              "https://api.osv.dev/v1/querybatch",
              data=request_bytes,
              headers={"Content-Type": "application/json", "User-Agent": "wepld-static-lock-repair/1"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=60) as response:
              response_obj = json.loads(response.read())
          results = response_obj.get("results")
          if not isinstance(results, list) or len(results) != len(identities):
              raise AssertionError("OSV result cardinality mismatch")
          affected = []
          for identity, result in zip(identities, results, strict=True):
              vulns = result.get("vulns", []) if isinstance(result, dict) else []
              if vulns:
                  affected.append({
                      "name": identity[0],
                      "version": identity[1],
                      "vulnerability_ids": sorted({str(v["id"]) for v in vulns if isinstance(v, dict) and "id" in v}),
                  })

          out = Path("resolution-output")
          root_ref = "wepld-pictorial@3.6.0"
          dependencies = [{"ref": root_ref, "dependsOn": [f"bun-lock:{k}" for k in sorted(direct_scope)]}]
          dependencies.extend({
              "ref": f"bun-lock:{k}",
              "dependsOn": [f"bun-lock:{d}" for d in edges[k]],
          } for k in sorted(edges))
          serial = str(uuid.uuid5(uuid.NAMESPACE_URL, f"wepld:pictorial-lock-repair:{source_head}:{hashlib.sha256(lock_bytes).hexdigest()}"))
          bom = {
              "bomFormat": "CycloneDX",
              "specVersion": "1.5",
              "serialNumber": f"urn:uuid:{serial}",
              "version": 1,
              "metadata": {
                  "component": {
                      "type": "application",
                      "bom-ref": root_ref,
                      "name": "@wepld/pictorial",
                      "version": str(package["version"]),
                      "properties": [
                          {"name": "wepld:bound_source_head", "value": source_head},
                          {"name": "wepld:package_json_git_blob", "value": package_blob},
                          {"name": "wepld:original_bun_lock_git_blob", "value": original_lock_blob},
                          {"name": "wepld:dependency_admission", "value": "NONE"},
                          {"name": "wepld:package_execution", "value": "NONE"},
                      ],
                  },
              },
              "components": components,
              "dependencies": dependencies,
          }
          bom_bytes = (json.dumps(bom, sort_keys=True, separators=(",", ":")) + "\n").encode("utf-8")
          (out / "proposed-pictorial-sbom.cdx.json").write_bytes(bom_bytes)
          with (out / "proposed-pictorial-inventory.jsonl").open("w", encoding="utf-8", newline="\n") as fh:
              for row in inventory_rows:
                  fh.write(json.dumps(row, sort_keys=True, separators=(",", ":")) + "\n")
          (out / "proposed-pictorial-osv-request.json").write_bytes(request_bytes + b"\n")
          canonical_osv = (json.dumps(response_obj, sort_keys=True, separators=(",", ":")) + "\n").encode("utf-8")
          (out / "proposed-pictorial-osv-response.json").write_bytes(canonical_osv)
          summary = {
              "subject_pr": 136,
              "bound_source_head": source_head,
              "package_json_git_blob": package_blob,
              "original_bun_lock_git_blob": original_lock_blob,
              "proposed_bun_lock_sha256": hashlib.sha256(lock_bytes).hexdigest(),
              "lock_entries": len(packages),
              "unique_npm_identities": len(identities),
              "components": len(components),
              "resolved_edges_including_peers": sum(len(v) for v in edges.values()),
              "unresolved_required_edges": len(unresolved_required),
              "unresolved_optional_peers": unresolved_optional_peer,
              "known_vulnerable_exact_identities_remaining": remaining,
              "osv_affected_identities": affected,
              "osv_affected_identity_count": len(affected),
              "osv_response_sha256": hashlib.sha256(canonical_osv).hexdigest(),
              "cyclonedx_sha256": hashlib.sha256(bom_bytes).hexdigest(),
              "dependency_admission": "NONE",
              "package_execution": "NONE",
              "donor_code_execution": "NONE",
          }
          (out / "qualification-summary.json").write_text(json.dumps(summary, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(summary, sort_keys=True))
          if affected:
              raise SystemExit("proposed lock still contains OSV-affected exact identities")
          PY

      - name: Upload proposed repair evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr136-pictorial-lock-repair-proposal
          path: resolution-output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
