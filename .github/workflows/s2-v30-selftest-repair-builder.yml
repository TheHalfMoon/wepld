name: s2-v30-read-text-projection-repair-builder

on:
  push:
    branches:
      - diag/s2-v30-policy-qualification-2026-08-29

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      V30_HEAD: 9a343016df41b2cdfdd423b60ef5725c7f9594a0
    steps:
      - name: Checkout diagnostic branch with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          lfs: false
          submodules: false

      - name: Build exact v30 read-text projection repair blobs without mutating refs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import os
          import subprocess
          import urllib.request

          head = os.environ["V30_HEAD"]
          policy_path = ".github/scripts/wepld_s2_identity_store_governance_v30_integrity.py"
          test_path = ".github/scripts/wepld_s2_identity_store_governance_v30_selftest.py"

          def show(path: str) -> bytes:
              return subprocess.check_output(["git", "show", f"{head}:{path}"])

          policy = show(policy_path)
          test = show(test_path)

          old_projection = b'''    def read_bytes(self, path: str, max_bytes: int) -> bytes:\n        if path in self._replacements:\n            data = self._replacements[path]\n            if len(data) > max_bytes:\n                base.fail(f"v30 projected dependency file exceeds read bound: {path}")\n            return data\n        return self._view.read_bytes(path, max_bytes)\n\n    def __getattr__(self, name: str) -> Any:\n        return getattr(self._view, name)\n'''
          new_projection = b'''    def read_bytes(self, path: str, max_bytes: int) -> bytes:\n        if path in self._replacements:\n            data = self._replacements[path]\n            if len(data) > max_bytes:\n                base.fail(f"v30 projected dependency file exceeds read bound: {path}")\n            return data\n        return self._view.read_bytes(path, max_bytes)\n\n    def read_text(\n        self, path: str, limit: int = base.MAX_POLICY_FILE_BYTES\n    ) -> str:\n        data = self.read_bytes(path, limit)\n        try:\n            return data.decode("utf-8", errors="strict")\n        except UnicodeError as exc:\n            base.fail(f"tracked file is not UTF-8: {path}: {exc}")\n\n    def __getattr__(self, name: str) -> Any:\n        return getattr(self._view, name)\n'''
          if policy.count(old_projection) != 1:
              raise SystemExit(
                  f"v30 projection read-text insertion target drifted: count={policy.count(old_projection)}"
              )
          policy = policy.replace(old_projection, new_projection, 1)

          marker = b'''    ):\n        base.fail("v30 projected Core manifest baseline identity drifted")\n    if (\n        p.p.s.r.q.p.blob(\n            projected.read_bytes(\n                p.p.s.r.q.p.ROOT_CARGO_LOCK, p.p.s.r.q.p.MAX_LOCK_BYTES\n            )\n        )\n'''
          replacement = b'''    ):\n        base.fail("v30 projected Core manifest baseline identity drifted")\n    expected_manifest_text = p.p.s.r.q.p.BASE_CORE_MANIFEST.decode(\n        "utf-8", errors="strict"\n    )\n    if (\n        projected.read_text(\n            p.p.s.r.q.p.CORE_MANIFEST, base.MAX_POLICY_FILE_BYTES\n        )\n        != expected_manifest_text\n    ):\n        base.fail("v30 projected Core manifest text read bypassed baseline projection")\n    if (\n        p.p.s.r.q.p.blob(\n            projected.read_bytes(\n                p.p.s.r.q.p.ROOT_CARGO_LOCK, p.p.s.r.q.p.MAX_LOCK_BYTES\n            )\n        )\n'''
          if test.count(marker) != 1:
              raise SystemExit(
                  f"v30 self-test read-text regression insertion target drifted: count={test.count(marker)}"
              )
          repaired_test = test.replace(marker, replacement, 1)

          def git_blob(data: bytes) -> str:
              return hashlib.sha1(
                  f"blob {len(data)}\0".encode("ascii") + data,
                  usedforsecurity=False,
              ).hexdigest()

          repaired_test_blob = git_blob(repaired_test)
          old_pin = b'T_BLOB = "8f3d423957b4af3a3b5970c51f24ec35cbbab037"'
          new_pin = f'T_BLOB = "{repaired_test_blob}"'.encode("ascii")
          if policy.count(old_pin) != 1:
              raise SystemExit("v30 policy current self-test pin drifted")
          repaired_policy = policy.replace(old_pin, new_pin, 1)

          assertions = (
              (
                  repaired_policy.count(b"def read_text(\n        self, path: str, limit: int = base.MAX_POLICY_FILE_BYTES") == 1,
                  "projection read_text implementation",
              ),
              (
                  repaired_test.count(b"v30 projected Core manifest text read bypassed baseline projection") == 1,
                  "projection read_text regression",
              ),
              (
                  repaired_policy.count(b"def shell_component_base(view: Any, paths: Any) -> None:") == 1,
                  "existing shell component seam preserved",
              ),
          )
          for ok, label in assertions:
              if not ok:
                  raise SystemExit(f"v30 repaired {label} assertion failed")

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]

          def create_blob(label: str, data: bytes) -> str:
              payload = json.dumps(
                  {
                      "content": base64.b64encode(data).decode("ascii"),
                      "encoding": "base64",
                  }
              ).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/git/blobs",
                  data=payload,
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                      "User-Agent": "wepld-s2-v30-read-text-repair-builder",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              remote = result["sha"]
              local = git_blob(data)
              if remote != local:
                  raise SystemExit(
                      f"GitHub/local blob mismatch for {label}: {remote} != {local}"
                  )
              print(f"{label}_BLOB_SHA={remote}")
              print(f"{label}_SHA256={hashlib.sha256(data).hexdigest()}")
              print(f"{label}_BYTES={len(data)}")
              return remote

          create_blob("V30_SELFTEST_READ_TEXT_REPAIRED", repaired_test)
          create_blob("V30_POLICY_READ_TEXT_REPAIRED", repaired_policy)
          print("REF_MUTATION=NONE_BY_BUILDER")
          print("REAL_CANDIDATE_DELTA_PROJECTION=NONE")
          print("READ_TEXT_PROJECTION=EXACT_THREE_DEPENDENCY_FILES_ONLY")
          PY
