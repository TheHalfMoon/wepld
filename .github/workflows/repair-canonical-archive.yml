name: repair-canonical-archive

on:
  push:
    branches:
      - docs/fresh-reconstitution-v1
    paths:
      - .github/repair-payload/READY

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: docs/fresh-reconstitution-v1

      - name: Rebuild canonical archive from fully staged payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import csv
          import hashlib
          import io
          import json
          import pathlib
          import re
          import tarfile

          payload_dir = pathlib.Path('.github/repair-payload')
          archive_path = pathlib.Path(
              'docs/canonical/artifacts/WEPLD_CANONICAL_ARTIFACTS_2026-08-14.tar.gz'
          )
          integrity_path = pathlib.Path('.github/workflows/foundation-integrity.yml')
          readme_path = pathlib.Path('docs/canonical/artifacts/README.md')

          expected_archive_sha256 = (
              '35dee10e7526d1958c5b3b88a1a9b569b0d1a464f5eec4e20e16c19c99f1c6b0'
          )
          expected_plan_sha256 = (
              'e269b10ef711731c4ad3af7b1135546f92d82a78975cabc9ff52c2dea4b5bf44'
          )
          expected_chunk_names = [f'chunk{i:02d}.b64' for i in range(1, 10)]
          expected_members = {
              'WEPLD_MASTER_ARCHITECTURE_EXECUTION_PLAN_2026-08-12_V2_2.md',
              'WEPLD_MASTER_SOURCE_REGISTRY_2026-08-14_V1.json',
              'WEPLD_MASTER_SOURCE_REGISTRY_2026-08-14_V1.csv',
              'WEPLD_SOURCE_ARTIFACT_PIN_LEDGER_2026-08-14_V1.md',
              'WEPLD_SOURCE_CAPABILITY_MINING_PRIORITY_MATRIX_2026-08-14_V1.md',
          }

          actual_chunk_names = sorted(p.name for p in payload_dir.glob('chunk*.b64'))
          if actual_chunk_names != expected_chunk_names:
              raise SystemExit(
                  f'incomplete staged payload: expected={expected_chunk_names} actual={actual_chunk_names}'
              )

          encoded = ''.join(
              (payload_dir / name).read_text(encoding='ascii')
              for name in expected_chunk_names
          )
          try:
              archive = base64.b64decode(encoded, validate=True)
          except Exception as exc:
              raise SystemExit(f'invalid staged base64 payload: {exc}') from exc

          actual_archive_sha256 = hashlib.sha256(archive).hexdigest()
          if actual_archive_sha256 != expected_archive_sha256:
              raise SystemExit(
                  f'staged archive SHA mismatch: {actual_archive_sha256}'
              )

          payloads = {}
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as tf:
              members = tf.getmembers()
              names = {member.name for member in members}
              if names != expected_members:
                  raise SystemExit(
                      f'archive member mismatch: expected={sorted(expected_members)} actual={sorted(names)}'
                  )
              if any(not member.isfile() for member in members):
                  raise SystemExit('archive contains a non-regular member')
              for member in members:
                  extracted = tf.extractfile(member)
                  if extracted is None:
                      raise SystemExit(f'unable to read archive member: {member.name}')
                  data = extracted.read()
                  if len(data) != member.size:
                      raise SystemExit(f'truncated archive member: {member.name}')
                  payloads[member.name] = data

          plan_name = 'WEPLD_MASTER_ARCHITECTURE_EXECUTION_PLAN_2026-08-12_V2_2.md'
          plan_sha256 = hashlib.sha256(payloads[plan_name]).hexdigest()
          if plan_sha256 != expected_plan_sha256:
              raise SystemExit(f'master-plan SHA mismatch: {plan_sha256}')

          registry_name = 'WEPLD_MASTER_SOURCE_REGISTRY_2026-08-14_V1.json'
          registry = json.loads(payloads[registry_name].decode('utf-8'))
          rows = registry.get('registry')
          if not isinstance(rows, list) or len(rows) != 402:
              raise SystemExit('JSON registry does not contain exactly 402 rows')
          names = [row.get('name') for row in rows]
          normalized = [name.casefold() for name in names if isinstance(name, str)]
          if len(normalized) != 402 or len(set(normalized)) != 402:
              raise SystemExit('JSON registry names are malformed or non-unique')
          if any(row.get('admission_status') != 'NOT_ADMITTED' for row in rows):
              raise SystemExit('JSON registry unexpectedly contains an admitted source')
          counts = registry.get('counts', {})
          if (
              counts.get('frozen_v1_5_named_entries') != 397
              or counts.get('post_v1_5_new_top_level_named_entries') != 5
              or counts.get('current_accounted_named_entries') != 402
          ):
              raise SystemExit(f'registry count anchors mismatch: {counts}')

          csv_name = 'WEPLD_MASTER_SOURCE_REGISTRY_2026-08-14_V1.csv'
          csv_rows = list(csv.DictReader(io.StringIO(payloads[csv_name].decode('utf-8'))))
          if len(csv_rows) != 402:
              raise SystemExit('CSV registry does not contain exactly 402 rows')
          csv_names = [row.get('name', '').casefold() for row in csv_rows]
          if len(set(csv_names)) != 402:
              raise SystemExit('CSV registry names are non-unique')

          archive_path.write_bytes(archive)

          integrity = integrity_path.read_text(encoding='utf-8')
          integrity, count = re.subn(
              r'(?<=expected_archive_sha256 = \(\n              ")[0-9a-f]{64}',
              expected_archive_sha256,
              integrity,
              count=1,
          )
          if count != 1:
              raise SystemExit('could not update integrity workflow archive hash')
          integrity_path.write_text(integrity, encoding='utf-8')

          readme = readme_path.read_text(encoding='utf-8')
          readme, count = re.subn(
              r'(?<=SHA256 = )[0-9a-f]{64}',
              expected_archive_sha256,
              readme,
              count=1,
          )
          if count != 1:
              raise SystemExit('could not update artifact README hash')
          readme_path.write_text(readme, encoding='utf-8')

          print('staged canonical archive verification: PASS')
          print(f'archive_sha256={expected_archive_sha256}')
          print(f'master_plan_sha256={plan_sha256}')
          print('source_registry_entries=402')
          PY

          git rm -f -- \
            .github/workflows/repair-canonical-archive.yml \
            .github/repair-payload/READY \
            .github/repair-payload/chunk01.b64 \
            .github/repair-payload/chunk02.b64 \
            .github/repair-payload/chunk03.b64 \
            .github/repair-payload/chunk04.b64 \
            .github/repair-payload/chunk05.b64 \
            .github/repair-payload/chunk06.b64 \
            .github/repair-payload/chunk07.b64 \
            .github/repair-payload/chunk08.b64 \
            .github/repair-payload/chunk09.b64

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/workflows/foundation-integrity.yml \
            docs/canonical/artifacts/README.md \
            docs/canonical/artifacts/WEPLD_CANONICAL_ARTIFACTS_2026-08-14.tar.gz
          git commit -m 'fix: replace canonical artifact archive'
          git push origin HEAD:docs/fresh-reconstitution-v1
