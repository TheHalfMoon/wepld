name: foundation-integrity

on:
  pull_request:

permissions:
  contents: read

jobs:
  github-object-access-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare old and new diagnostic object accessibility
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          urls = {
              'old_convergence': 'https://api.github.com/repos/TheHalfMoon/wepld/git/commits/c46c152ac9d97e7e178edf90c5be7b1cc592d168',
              'new_convergence': 'https://api.github.com/repos/TheHalfMoon/wepld/git/commits/e8a70633fc7f60b1e8dd3e607e334e11d878bb0c',
              'old_compare': 'https://api.github.com/repos/TheHalfMoon/wepld/compare/7d24c3047191822d687b5fb3cd52e228a6353651...14cd0fa2999e7831d02488bc8c926057b8f3fcb6',
              'new_compare': 'https://api.github.com/repos/TheHalfMoon/wepld/compare/f91d765d21f497502e21414f49d42869218066b5...c67eb570e9601f1dd21e1edd03a21926d29dc870',
          }
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'wepld-v9-diagnostic',
          }
          for label, url in urls.items():
              req = urllib.request.Request(url, headers=headers)
              try:
                  response = urllib.request.urlopen(req, timeout=20)
                  body = response.read()
              except urllib.error.HTTPError as exc:
                  response = exc
                  body = exc.read()
              message = ''
              try:
                  payload = json.loads(body.decode('utf-8'))
                  if isinstance(payload, dict):
                      message = str(payload.get('message', ''))
              except Exception:
                  message = '<non-json>'
              print(f'{label}_status={response.status}')
              print(f'{label}_message={message}')
              print(f'{label}_remaining={response.headers.get("X-RateLimit-Remaining")}')
          PY
