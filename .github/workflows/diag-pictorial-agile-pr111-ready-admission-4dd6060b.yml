name: diag-pictorial-agile-pr111-ready-admission-4dd6060b

on:
  pull_request:

permissions: {}

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Locate exact PR111 ready_for_review pull_request_target run
        shell: bash
        run: |
          set -euo pipefail
          target_pr=111
          target_head='4dd6060b7186ee94928c96521fb8ac4a27a634d8'
          target_after='2026-08-22T18:19:43Z'
          api='https://api.github.com/repos/TheHalfMoon/wepld/actions/runs?event=pull_request_target&per_page=100'
          data="$(curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --retry-all-errors "$api")"
          matches="$(printf '%s' "$data" | jq -c --argjson pr "$target_pr" --arg head "$target_head" --arg after "$target_after" '[.workflow_runs[] | select(.head_sha == $head and .name == "s1-admission-integrity" and .created_at >= $after and any(.pull_requests[]?; .number == $pr))]')"
          count="$(printf '%s' "$matches" | jq 'length')"
          echo "MATCH_COUNT=$count"
          printf '%s' "$matches" | jq -r '.[] | "RUN_ID=\(.id) RUN_NUMBER=\(.run_number) WORKFLOW=\(.name) EVENT=\(.event) STATUS=\(.status) CONCLUSION=\(.conclusion // "null") CREATED_AT=\(.created_at) IMMUTABLE_HEAD_SHA=\(.head_sha // "") PR_NUMBER=\(.pull_requests[0].number // 0) BASE_SHA=\(.pull_requests[0].base.sha // "")"'
          test "$count" -eq 1
          echo 'MERGE=NEVER'
