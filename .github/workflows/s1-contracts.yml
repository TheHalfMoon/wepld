name: s1-contracts

on:
  pull_request:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/desktop/src-tauri/build.rs"
      - "apps/desktop/src-tauri/tauri.conf.json"
      - "apps/desktop/src-tauri/src/**"
      - "apps/desktop/ui/**"
      - "crates/contracts/**"
      - "crates/core/**"
      - ".github/scripts/wepld_s1_execution_integrity.py"
      - ".github/scripts/wepld_s1_desktop_integrity.py"
      - ".github/scripts/wepld_s1_shell_integrity.py"
      - ".github/workflows/s1-contracts.yml"

permissions: {}

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Verify pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          expected="$(python - <<'PY'
          import tomllib
          with open("rust-toolchain.toml", "rb") as fh:
              print(tomllib.load(fh)["toolchain"]["channel"])
          PY
          )"
          rustc --version --verbose
          cargo --version --verbose
          actual_rustc="$(rustc --version | awk '{print $2}')"
          actual_cargo="$(cargo --version | awk '{print $2}')"
          test "$actual_rustc" = "$expected"
          test "$actual_cargo" = "$expected"

      - name: Format contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --package wepld-contracts -- --check

      - name: Clippy contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --package wepld-contracts --all-targets -- -D warnings -F unsafe-code

      - name: Test contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --package wepld-contracts --all-targets

      - name: Format Core
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --package wepld-core -- --check

      - name: Clippy Core
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --package wepld-core --all-targets -- -D warnings -F unsafe-code

      - name: Test Core
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --package wepld-core --all-targets

  desktop-host:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Verify pinned Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expected = python -c "import tomllib; print(tomllib.load(open('rust-toolchain.toml','rb'))['toolchain']['channel'])"
          rustc --version --verbose
          cargo --version --verbose
          $actualRustc = (rustc --version).Split()[1]
          $actualCargo = (cargo --version).Split()[1]
          if ($actualRustc -ne $expected) { throw "rustc version mismatch: expected=$expected actual=$actualRustc" }
          if ($actualCargo -ne $expected) { throw "cargo version mismatch: expected=$expected actual=$actualCargo" }

      - name: Stage owned Core for Desktop tests and Tauri externalBin
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --locked --package wepld-core
          $deps = Join-Path $PWD "target\debug\deps"
          New-Item -ItemType Directory -Force -Path $deps | Out-Null
          Copy-Item -Force "target\debug\wepld-core.exe" (Join-Path $deps "wepld-core.exe")
          $sidecars = Join-Path $PWD "apps\desktop\src-tauri\binaries"
          New-Item -ItemType Directory -Force -Path $sidecars | Out-Null
          Copy-Item -Force "target\debug\wepld-core.exe" (Join-Path $sidecars "wepld-core-x86_64-pc-windows-msvc.exe")

      - name: Format Desktop host
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo fmt --package wepld-desktop -- --check

      - name: Clippy Desktop host
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo clippy --locked --package wepld-desktop --all-targets -- -D warnings -F unsafe-code

      - name: Test Desktop host
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo test --locked --package wepld-desktop --all-targets
