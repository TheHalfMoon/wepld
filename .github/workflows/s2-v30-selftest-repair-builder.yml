name: s2-v30-shell-component-repair-builder

on:
  push:
    branches:
      - diag/s2-v30-policy-qualification-2026-08-29

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      V30_HEAD: e83d5021f7593d02d23e46a3eccb9f0b6bb21be2
    steps:
      - name: Checkout diagnostic branch with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          lfs: false
          submodules: false

      - name: Build exact v30 shell-component repair blobs without mutating refs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import os
          import subprocess
          import urllib.request

          head = os.environ["V30_HEAD"]
          policy_path = ".github/scripts/wepld_s2_identity_store_governance_v30_integrity.py"
          test_path = ".github/scripts/wepld_s2_identity_store_governance_v30_selftest.py"

          def show(path: str) -> bytes:
              return subprocess.check_output(["git", "show", f"{head}:{path}"])

          policy = show(policy_path)
          test = show(test_path)

          replacements = [
              (
                  b"_BASE_STAGE_B_TEMPLATES = base.verify_stage_b_templates\n",
                  b"_SHELL_COMPONENT_BASE: Any = None\n",
                  "capture",
              ),
              (
                  b'''def verify_stage_b_templates(view: Any, stage: str) -> None:\n    if p.s.r.q.deps_ready(view):\n        _BASE_STAGE_B_TEMPLATES(project_admitted_dependency_state(view), stage)\n        return\n    _BASE_STAGE_B_TEMPLATES(view, stage)\n\n\n''',
                  b'''def shell_component_base(view: Any, paths: Any) -> None:\n    if _SHELL_COMPONENT_BASE is None:\n        base.fail("v30 predecessor shell component-base verifier is not installed")\n    target = view\n    if p.s.r.q.deps_ready(view):\n        target = project_admitted_dependency_state(view)\n    _call("v29 shell component-base verifier", _SHELL_COMPONENT_BASE, target, paths)\n\n\n''',
                  "component wrapper",
              ),
              (
                  b'''        (base.compare_base_controlled, basectrl),\n        (base.verify_stage_b_templates, verify_stage_b_templates),\n        (_attr(desktop, "verify_extension_controlled_paths", "desktop hook"), dext),\n''',
                  b'''        (base.compare_base_controlled, basectrl),\n        (_attr(shell, "_verify_shell_component_base", "shell component-base hook"), shell_component_base),\n        (_attr(desktop, "verify_extension_controlled_paths", "desktop hook"), dext),\n''',
                  "overlay",
              ),
              (
                  b"def install() -> None:\n    global _INST, _PRINT\n",
                  b"def install() -> None:\n    global _INST, _PRINT, _SHELL_COMPONENT_BASE\n",
                  "install global",
              ),
              (
                  b'''        (_attr(routing, "IMPL_REQUIRE_EXACT_DELTA", "v29 routing hook"), P_DELTA),\n        (base.compare_base_controlled, P_BASE),\n        (base.verify_stage_b_templates, _BASE_STAGE_B_TEMPLATES),\n        (_attr(desktop, "verify_extension_controlled_paths", "v29 desktop hook"), P_DEXT),\n''',
                  b'''        (_attr(routing, "IMPL_REQUIRE_EXACT_DELTA", "v29 routing hook"), P_DELTA),\n        (base.compare_base_controlled, P_BASE),\n        (_attr(desktop, "verify_extension_controlled_paths", "v29 desktop hook"), P_DEXT),\n''',
                  "predecessor stage removal",
              ),
              (
                  b'''    if any(actual is not expected for actual, expected in pairs):\n        base.fail("v30 predecessor hook drifted")\n\n    _PRINT = P_PRINTER\n''',
                  b'''    if any(actual is not expected for actual, expected in pairs):\n        base.fail("v30 predecessor hook drifted")\n\n    _SHELL_COMPONENT_BASE = _attr(\n        shell, "_verify_shell_component_base", "v29 shell component-base verifier"\n    )\n    _PRINT = P_PRINTER\n''',
                  "component capture",
              ),
              (
                  b'''    _bind(routing, "IMPL_REQUIRE_EXACT_DELTA", delta, "v30 routing hook")\n    base.compare_base_controlled = basectrl\n    base.verify_stage_b_templates = verify_stage_b_templates\n    _bind(desktop, "verify_extension_controlled_paths", dext, "v30 desktop hook")\n''',
                  b'''    _bind(routing, "IMPL_REQUIRE_EXACT_DELTA", delta, "v30 routing hook")\n    base.compare_base_controlled = basectrl\n    _bind(\n        shell,\n        "_verify_shell_component_base",\n        shell_component_base,\n        "v30 shell component-base hook",\n    )\n    _bind(desktop, "verify_extension_controlled_paths", dext, "v30 desktop hook")\n''',
                  "component bind",
              ),
          ]

          for old, new, label in replacements:
              if policy.count(old) != 1:
                  raise SystemExit(f"v30 policy {label} target drifted: count={policy.count(old)}")
              policy = policy.replace(old, new, 1)

          old_test = b'''    p.install()\n    p.files(view)\n    stage = base.verify_view(view)\n    if stage != "S1_DEPENDENCY_RESOLUTION_LOCKED":\n        base.fail(f"v30 admitted full-view stage drifted: {stage}")\n\n    projected = p.project_admitted_dependency_state(view)\n'''
          new_test = b'''    p.install()\n    p.files(view)\n    paths = base.validate_entries(view.entries())\n    p.shell_component_base(view, paths)\n\n    projected = p.project_admitted_dependency_state(view)\n'''
          if test.count(old_test) != 1:
              raise SystemExit(f"v30 self-test regression target drifted: count={test.count(old_test)}")
          repaired_test = test.replace(old_test, new_test, 1)

          def git_blob(data: bytes) -> str:
              return hashlib.sha1(
                  f"blob {len(data)}\0".encode("ascii") + data,
                  usedforsecurity=False,
              ).hexdigest()

          repaired_test_blob = git_blob(repaired_test)
          old_pin = b'T_BLOB = "284714143444c6c6d8919132afb71c80c77a28e0"'
          new_pin = f'T_BLOB = "{repaired_test_blob}"'.encode("ascii")
          if policy.count(old_pin) != 1:
              raise SystemExit("v30 policy current self-test pin drifted")
          repaired_policy = policy.replace(old_pin, new_pin, 1)

          assertions = (
              (repaired_policy.count(b"def shell_component_base(view: Any, paths: Any) -> None:") == 1, "component wrapper"),
              (repaired_policy.count(b'"_verify_shell_component_base",\n        shell_component_base,') == 1, "component binding"),
              (b"base.verify_stage_b_templates = verify_stage_b_templates" not in repaired_policy, "obsolete Stage-B binding removed"),
              (repaired_test.count(b"p.shell_component_base(view, paths)") == 1, "component regression"),
              (b"stage = base.verify_view(view)" not in repaired_test, "invalid direct base.verify_view regression removed"),
          )
          for ok, label in assertions:
              if not ok:
                  raise SystemExit(f"v30 repaired {label} assertion failed")

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]

          def create_blob(label: str, data: bytes) -> str:
              payload = json.dumps(
                  {
                      "content": base64.b64encode(data).decode("ascii"),
                      "encoding": "base64",
                  }
              ).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/git/blobs",
                  data=payload,
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                      "User-Agent": "wepld-s2-v30-shell-component-repair-builder",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              remote = result["sha"]
              local = git_blob(data)
              if remote != local:
                  raise SystemExit(
                      f"GitHub/local blob mismatch for {label}: {remote} != {local}"
                  )
              print(f"{label}_BLOB_SHA={remote}")
              print(f"{label}_SHA256={hashlib.sha256(data).hexdigest()}")
              print(f"{label}_BYTES={len(data)}")
              return remote

          create_blob("V30_SELFTEST_SHELL_COMPONENT_REPAIRED", repaired_test)
          create_blob("V30_POLICY_SHELL_COMPONENT_REPAIRED", repaired_policy)
          print("REF_MUTATION=NONE_BY_BUILDER")
          print("REAL_CANDIDATE_DELTA_PROJECTION=NONE")
          print("SHELL_COMPONENT_READ_PROJECTION=EXACT_THREE_DEPENDENCY_FILES_ONLY")
          PY
