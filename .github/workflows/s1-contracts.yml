      - "apps/desktop/ui/**"
      - "crates/contracts/**"
      - "crates/core/**"
      - "third_party/glib-0.18.5-wepld1/**"
      - ".github/scripts/wepld_s1_execution_integrity.py"
      - ".github/scripts/wepld_s1_desktop_integrity.py"
      - ".github/scripts/wepld_s1_desktop_integrity_impl.py"
