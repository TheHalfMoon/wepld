[project]
name = "wepld-agile"
version = "1.0.2.dev0"
description = "Agile CLI, part of GitHub Agile. A tool to bootstrap your projects for Spec-Driven Development (SDD)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.24.0",
    "click>=8.2.1",
    "rich",
    "platformdirs",
    "readchar",
    "pyyaml>=6.0",
    "packaging>=23.0",
    "pathspec>=0.12.0",
    "json5>=0.13.0",
]

[project.scripts]
agile = "agile_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agile_cli"]

[tool.hatch.build.targets.wheel.force-include]
# Bundle core assets so `agile init` works without network access (air-gapped / enterprise)
# Page templates (exclude commands/ — bundled separately below to avoid duplication)
"templates/checklist-template.md" = "agile_cli/core_pack/templates/checklist-template.md"
"templates/constitution-template.md" = "agile_cli/core_pack/templates/constitution-template.md"
"templates/plan-template.md" = "agile_cli/core_pack/templates/plan-template.md"
"templates/spec-template.md" = "agile_cli/core_pack/templates/spec-template.md"
"templates/tasks-template.md" = "agile_cli/core_pack/templates/tasks-template.md"
"templates/vscode-settings.json" = "agile_cli/core_pack/templates/vscode-settings.json"
# Command templates
"templates/commands" = "agile_cli/core_pack/commands"
"scripts/bash" = "agile_cli/core_pack/scripts/bash"
"scripts/powershell" = "agile_cli/core_pack/scripts/powershell"
"scripts/python" = "agile_cli/core_pack/scripts/python"
# Bundled extensions (installable via `agile extension add <name>`)
"extensions/git" = "agile_cli/core_pack/extensions/git"
"extensions/agent-context" = "agile_cli/core_pack/extensions/agent-context"
"extensions/assess" = "agile_cli/core_pack/extensions/assess"
"extensions/bug" = "agile_cli/core_pack/extensions/bug"
# Bundled workflows (auto-installed during `agile init`)
"workflows/agile" = "agile_cli/core_pack/workflows/agile"
# Bundled presets (installable via `specify preset add <name>` or `agile init --preset <name>`)
"presets/lean" = "agile_cli/core_pack/presets/lean"
"presets/constitution-sync" = "agile_cli/core_pack/presets/constitution-sync"
# Community bundle catalog snapshot (used for offline discovery)
"bundles/catalog.community.json" = "agile_cli/core_pack/bundles/catalog.community.json"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.ruff.lint]
# Lock in subprocess security posture: any reintroduction of shell=True
# (or os.system / popen2) must be acknowledged with an explicit `# noqa`
# pointing at the rule, making the deviation visible in review.
extend-select = [
    "S602",  # subprocess-popen-with-shell-equals-true
    "S604",  # call-with-shell-equals-true
    "S605",  # start-process-with-a-shell
]
