name: s2-v30-cand-trace

on:
  push:
    branches:
      - diag/s2-v30-policy-qualification-2026-08-29

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      V30_HEAD: e83d5021f7593d02d23e46a3eccb9f0b6bb21be2
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout diagnostic branch with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          lfs: false
          submodules: false

      - name: Trace effective shell verify-view identity
        shell: bash
        run: |
          set -euo pipefail
          wt="${RUNNER_TEMP}/wepld-v30-trace"
          git worktree add --detach "$wt" "$V30_HEAD"
          trap 'git worktree remove --force "$wt" >/dev/null 2>&1 || true' EXIT
          cd "$wt"
          python - <<'PY'
          import inspect
          import sys
          from pathlib import Path

          scripts = Path('.github/scripts').resolve()
          sys.path.insert(0, str(scripts))
          import wepld_s2_identity_store_governance_v30_integrity as v30

          v25 = v30.p.s.r.q.p
          cand = v25.CAND
          cand_module = sys.modules[cand.__module__]
          v3 = cand_module.v3
          shell = v3._topology()[0]
          verifier = shell.verify_view

          print(f'CAND_MODULE={cand.__module__}')
          print(f'V3_MODULE={v3.__name__}')
          print(f'SHELL_MODULE={shell.__name__}')
          print(f'SHELL_FILE={getattr(shell, "__file__", None)}')
          print(f'VERIFY_VIEW_MODULE={getattr(verifier, "__module__", None)}')
          print(f'VERIFY_VIEW_NAME={getattr(verifier, "__name__", None)}')
          print(f'VERIFY_VIEW_FILE={inspect.getsourcefile(verifier)}')
          print('VERIFY_VIEW_SOURCE_BEGIN')
          print(inspect.getsource(verifier))
          print('VERIFY_VIEW_SOURCE_END')

          print(f'BASE_MODULE_ID={id(v30.base)}')
          print(f'SHELL_BASE_ID={id(getattr(shell, "base", None))}')
          print(f'BASE_STAGE_FN_BEFORE={v30.base.verify_stage_b_templates.__module__}.{v30.base.verify_stage_b_templates.__name__}')
          if 'verify_stage_b_templates' in verifier.__globals__:
              fn = verifier.__globals__['verify_stage_b_templates']
              print(f'VERIFY_VIEW_STAGE_GLOBAL={fn.__module__}.{fn.__name__}')
              print(f'VERIFY_VIEW_STAGE_GLOBAL_ID={id(fn)}')
          else:
              print('VERIFY_VIEW_STAGE_GLOBAL=ABSENT')

          v30.install()
          verifier_after = shell.verify_view
          print(f'VERIFY_VIEW_ID_STABLE={verifier_after is verifier}')
          print(f'BASE_STAGE_AFTER={v30.base.verify_stage_b_templates.__module__}.{v30.base.verify_stage_b_templates.__name__}')
          if 'verify_stage_b_templates' in verifier_after.__globals__:
              fn = verifier_after.__globals__['verify_stage_b_templates']
              print(f'VERIFY_VIEW_STAGE_GLOBAL_AFTER={fn.__module__}.{fn.__name__}')
              print(f'VERIFY_VIEW_STAGE_GLOBAL_AFTER_IS_V30={fn is v30.verify_stage_b_templates}')
          print('DIAGNOSTIC_AUTHORITY=NONE')
          PY
