name: s2-v30-cand-trace

on:
  push:
    branches:
      - diag/s2-v30-policy-qualification-2026-08-29

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      V30_HEAD: e83d5021f7593d02d23e46a3eccb9f0b6bb21be2
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout diagnostic branch with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          lfs: false
          submodules: false

      - name: Trace captured predecessor verifier chain
        shell: bash
        run: |
          set -euo pipefail
          wt="${RUNNER_TEMP}/wepld-v30-trace"
          git worktree add --detach "$wt" "$V30_HEAD"
          trap 'git worktree remove --force "$wt" >/dev/null 2>&1 || true' EXIT
          cd "$wt"
          python - <<'PY'
          import inspect
          import sys
          from pathlib import Path

          scripts = Path('.github/scripts').resolve()
          sys.path.insert(0, str(scripts))
          import wepld_s2_identity_store_governance_v30_integrity as v30

          v30.install()
          v25 = v30.p.s.r.q.p
          cand_module = sys.modules[v25.CAND.__module__]
          v3 = cand_module.v3
          shell = v3._topology()[0]
          current = shell.verify_view
          seen = set()

          for depth in range(30):
              if not callable(current) or id(current) in seen:
                  print(f'TRACE_STOP_DEPTH={depth}')
                  break
              seen.add(id(current))
              module = sys.modules.get(getattr(current, '__module__', ''))
              print(f'DEPTH={depth}')
              print(f'FN={getattr(current, "__module__", None)}.{getattr(current, "__name__", None)}')
              print(f'FILE={inspect.getsourcefile(current)}')
              source = inspect.getsource(current)
              print('SOURCE_BEGIN')
              print(source)
              print('SOURCE_END')

              next_fn = None
              if module is not None:
                  for key in ('_PRIOR_VERIFY_VIEW', 'PRIOR_VERIFY_VIEW', 'v19', 'v18', 'v17', 'v16', 'v15', 'v14', 'v13', 'v12', 'v11', 'v10', 'v9', 'v8', 'v7', 'v6', 'v5', 'v4', 'v3', 'v2', 'prior'):
                      obj = getattr(module, key, None)
                      if callable(obj) and key in ('_PRIOR_VERIFY_VIEW', 'PRIOR_VERIFY_VIEW'):
                          next_fn = obj
                          print(f'NEXT_VIA={key}')
                          break
                      if obj is not None and hasattr(obj, 'verify_view') and callable(obj.verify_view):
                          if f'{key}.verify_view' in source or f'{key}.verify_view' in source.replace(' ', ''):
                              next_fn = obj.verify_view
                              print(f'NEXT_VIA={key}.verify_view')
                              break
                  if next_fn is None and getattr(current, '__module__', '') == 'wepld_s1_shell_integrity_v20':
                      obj = getattr(module, 'v19', None)
                      if obj is not None:
                          next_fn = obj.verify_view
                          print('NEXT_VIA=v19.verify_view')
                  if next_fn is None and getattr(current, '__module__', '') == 'wepld_s1_shell_integrity_v19':
                      next_fn = getattr(module, '_PRIOR_VERIFY_VIEW', None)
                      print('NEXT_VIA=_PRIOR_VERIFY_VIEW')
              if next_fn is None:
                  print(f'NO_NEXT_AT_DEPTH={depth}')
                  if module is not None:
                      for key, obj in sorted(module.__dict__.items()):
                          if 'verify' in key.lower() and callable(obj):
                              print(f'AVAILABLE_VERIFY={key}:{getattr(obj, "__module__", None)}.{getattr(obj, "__name__", None)}')
                  break
              current = next_fn

          print('DIAGNOSTIC_AUTHORITY=NONE')
          PY
