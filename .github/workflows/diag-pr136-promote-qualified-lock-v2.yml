name: diag-pr136-promote-qualified-lock-v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout authorized successor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: repair/pr136-pictorial-lockfile-metadata-2026-08-24
          persist-credentials: true
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Apply exact previously-qualified metadata rows
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "28f0023b8ffb90c585213762dae5f4c1d57322ef"
          test "$(git hash-object vendor/pictorial/package.json)" = "ba646522c498af6e9bfa02fd1dba2f098d9f6d42"
          test "$(git hash-object vendor/pictorial/bun.lock)" = "f7114d1b93f26eb9d7796fc15ae3d639d2209c9d"
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re

          replacements = {
            '@hono/node-server': '    "@hono/node-server": ["@hono/node-server@1.19.15", "", { "peerDependencies": { "hono": "^4" } }, "sha512-Za2ai6TLdKjUvnur+eenO6nuYYipVAEhyCAdaV8IRvmU9kK8crOZUSYvIXn72E4f8fJqyAbpcJuTsYYmZp9Deg=="],',
            'body-parser': '    "body-parser": ["body-parser@2.3.0", "", { "dependencies": { "bytes": "^3.1.2", "content-type": "^2.0.0", "debug": "^4.4.3", "http-errors": "^2.0.1", "iconv-lite": "^0.7.2", "on-finished": "^2.4.1", "qs": "^6.15.2", "raw-body": "^3.0.2", "type-is": "^2.1.0" } }, "sha512-2cGmJupaNgg+QUwVLAucDuWuoMZ6EX9iHDRswZ5lsNYEmwPaRknMPCLZz07yTzVq/83p4o/wzbDZbBrTvGGTIw=="],',
            'brace-expansion': '    "brace-expansion": ["brace-expansion@5.0.9", "", { "dependencies": { "balanced-match": "^4.0.2" } }, "sha512-ScQ4IuvIEF1TMlP7Zt+vjJ//9zlPb2SDcxWxM3bk8s6t6GGdJ7KO1dCcTidOPJKePW30LE/2cT7wCyPho9/Wxg=="],',
            'express-rate-limit': '    "express-rate-limit": ["express-rate-limit@8.5.1", "", { "dependencies": { "ip-address": "^10.2.0" }, "peerDependencies": { "express": ">= 4.11" } }, "sha512-5O6KYmyJEpuPJV5hNTXKbAHWRqrzyu+OI3vUnSd2kXFubIVpG7ezpgxQy76Zo5GQZtrQBg86hF+CM/NX+cioiQ=="],',
            'fast-uri': '    "fast-uri": ["fast-uri@3.1.5", "", {  }, "sha512-gHwA1O9LDIcKunMKhObS/HimwtehO1nPUECKAu5TpKgaO19fcWEl4bliWe1jWxVFvIXztJjjQ4L8XQ1EU9f7Jw=="],',
            'hono': '    "hono": ["hono@4.12.34", "", {  }, "sha512-GqXJqY/xJkJmuloTrnV1ZEXG3fqte+VjkUqoRNZXcrUidiUOP4fMSIHHY4tsqZBK++kVyWmt/AAfSUuy57/eSA=="],',
            'ip-address': '    "ip-address": ["ip-address@10.3.1", "", {  }, "sha512-1e9d3kb97NHJTIJDZW9rKqW2h6+dFa50Dy0fpPSMQp2ADje5gvKsXmdiK6dwY5t76TaTt5+P5N1Y/LoToIxP6g=="],',
            'qs': '    "qs": ["qs@6.15.2", "", { "dependencies": { "side-channel": "^1.1.0" } }, "sha512-Rzq0KEyX/w/tEybncDgdkZrJgVUsUMk3xjh3t5bv3S1HTAtg+uOYt72+ZfwiQwKdysThkTBdL/rTi6HDmX9Ddw=="],',
            'type-is': '    "type-is": ["type-is@2.1.0", "", { "dependencies": { "content-type": "^2.0.0", "media-typer": "^1.1.0", "mime-types": "^3.0.0" } }, "sha512-faYHw0anBbc/kWF3zFTEnxSFOAGUX9GFbOBthvDdLsIlEoWOFOtS0zgCiQYwIskL9iGXZL3kAXD8OoZ4GmMATA=="],',
          }
          nested = [
            '    "body-parser/content-type": ["content-type@2.0.0", "", {  }, "sha512-j/O/d7GcZCyNl7/hwZAb606rzqkyvaDctLmckbxLzHvFBzTJHuGEdodATcP3yIRoDrLHkIATJuvzbFlp/ki2cQ=="],',
            '    "type-is/content-type": ["content-type@2.0.0", "", {  }, "sha512-j/O/d7GcZCyNl7/hwZAb606rzqkyvaDctLmckbxLzHvFBzTJHuGEdodATcP3yIRoDrLHkIATJuvzbFlp/ki2cQ=="],',
          ]
          p=Path('vendor/pictorial/bun.lock'); lines=p.read_text().splitlines(); idx={}
          for i,l in enumerate(lines):
            m=re.match(r'^    ("(?:[^"\\]|\\.)+"): \[',l)
            if m: idx[json.loads(m.group(1))]=i
          for key,line in replacements.items():
            assert key in idx
            lines[idx[key]]=line
          anchor=idx['@modelcontextprotocol/sdk/eventsource-parser']
          lines[anchor:anchor]=nested+['']
          out=('\n'.join(lines)+'\n').encode()
          assert hashlib.sha256(out).hexdigest()=='92d73b6b1c491fd9c800c0243d6652b4287a4edd625d34ea5fd3af99021d3733'
          assert hashlib.sha1(f'blob {len(out)}\0'.encode()+out).hexdigest()=='0045fb246c6ffac5375f7272f4f88b3dd7ef53d6'
          p.write_bytes(out)
          PY
          test "$(git hash-object vendor/pictorial/bun.lock)" = "0045fb246c6ffac5375f7272f4f88b3dd7ef53d6"
          test "$(git status --short)" = " M vendor/pictorial/bun.lock"

      - name: Recheck full exact graph against OSV
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path
          def strip(t):
            out=[]; ins=False; esc=False; i=0
            while i<len(t):
              c=t[i]
              if ins:
                out.append(c)
                if esc: esc=False
                elif c=='\\': esc=True
                elif c=='"': ins=False
                i+=1; continue
              if c=='"': ins=True; out.append(c); i+=1; continue
              if c==',':
                j=i+1
                while j<len(t) and t[j].isspace(): j+=1
                if j<len(t) and t[j] in '}]': i+=1; continue
              out.append(c); i+=1
            return ''.join(out)
          def sid(s):
            if s.startswith('@'):
              p=s.rfind('@'); return s[:p],s[p+1:]
            return tuple(s.rsplit('@',1))
          obj=json.loads(strip(Path('vendor/pictorial/bun.lock').read_text()))
          assert len(obj['packages'])==235
          ids=sorted({sid(r[0]) for r in obj['packages'].values()})
          q={'queries':[{'package':{'ecosystem':'npm','name':n},'version':v} for n,v in ids]}
          req=urllib.request.Request('https://api.osv.dev/v1/querybatch',data=json.dumps(q,sort_keys=True,separators=(',',':')).encode(),headers={'Content-Type':'application/json','User-Agent':'wepld-metadata-only-repair/2'},method='POST')
          with urllib.request.urlopen(req,timeout=60) as r: res=json.loads(r.read())
          affected=[]
          for ident,x in zip(ids,res['results'],strict=True):
            vulns=x.get('vulns',[]) if isinstance(x,dict) else []
            if vulns: affected.append((ident,[v['id'] for v in vulns]))
          assert not affected, affected
          print(f'qualified_unique_npm_identities={len(ids)}')
          print('osv_affected_exact_identities=0')
          PY

      - name: Commit and fast-forward authorized successor only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- vendor/pictorial/bun.lock
          test "$(git diff --cached --name-only)" = "vendor/pictorial/bun.lock"
          git commit -m "fix(vendor): repair Pictorial lock metadata advisories"
          git push origin HEAD:refs/heads/repair/pr136-pictorial-lockfile-metadata-2026-08-24
