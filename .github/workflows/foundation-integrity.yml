name: foundation-integrity

on:
  pull_request:
  push:
    branches:
      - main
      - docs/fresh-reconstitution-v1
      - feat/s1-desktop-rust-core-handshake

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify canonical artifact archive against immutable baseline
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import csv
          import hashlib
          import io
          import json
          import os
          import pathlib
          import tarfile
          import urllib.error
          import urllib.request

          archive_path = pathlib.Path(
              "docs/canonical/artifacts/WEPLD_CANONICAL_ARTIFACTS_2026-08-14.tar.gz"
          )
          baseline_commit_sha = "421c769b47fd8ad4f5bcba67ff8b00ba0adfc6c3"
          baseline_path = ".wepld/foundation-integrity-baseline-v1.json"
          baseline_url = (
              "https://api.github.com/repos/TheHalfMoon/wepld/contents/"
              f"{baseline_path}?ref={baseline_commit_sha}"
          )

          class RejectRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise urllib.error.HTTPError(
                      req.full_url,
                      code,
                      f"redirect refused while fetching immutable baseline: {newurl}",
                      headers,
                      fp,
                  )

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          opener = urllib.request.build_opener(RejectRedirects())

          def fetch_json_exact(url):
              request = urllib.request.Request(url, headers=headers)
              with opener.open(request, timeout=30) as response:
                  if response.geturl() != url:
                      raise SystemExit(f"request target changed unexpectedly: {url}")
                  return json.load(response)

          baseline_response = fetch_json_exact(baseline_url)
          baseline = json.loads(
              base64.b64decode(baseline_response["content"]).decode("utf-8")
          )

          expected_baseline = {
              "schema": "wepld.foundation-integrity-baseline.v1",
              "baseline_class": "BOOTSTRAP_INTEGRITY_EVIDENCE_NOT_ACCEPTANCE",
              "repository_id": 1334408699,
              "repository": "TheHalfMoon/wepld",
              "source_registry_entries": 402,
              "source_admission": 0,
          }
          for key, expected in expected_baseline.items():
              if baseline.get(key) != expected:
                  raise SystemExit(f"foundation baseline mismatch for {key}")

          if os.environ.get("EVENT_NAME") == "pull_request":
              pr_base = os.environ.get("PR_BASE_SHA", "")
              baseline_base = baseline.get("base_main_sha", "")
              if not pr_base or not baseline_base:
                  raise SystemExit("pull-request base or immutable baseline base SHA is missing")
              if pr_base != baseline_base:
                  compare_url = (
                      "https://api.github.com/repos/TheHalfMoon/wepld/compare/"
                      f"{baseline_base}...{pr_base}"
                  )
                  comparison = fetch_json_exact(compare_url)
                  if comparison.get("status") not in {"ahead", "identical"}:
                      raise SystemExit(
                          "pull-request base is not the immutable baseline base or its descendant"
                      )

          expected_archive_sha256 = baseline["canonical_artifact_archive_sha256"]
          expected_plan_sha256 = baseline["master_plan_v2_2_sha256"]
          expected_members = {
              "WEPLD_MASTER_ARCHITECTURE_EXECUTION_PLAN_2026-08-12_V2_2.md",
              "WEPLD_MASTER_SOURCE_REGISTRY_2026-08-14_V1.json",
              "WEPLD_MASTER_SOURCE_REGISTRY_2026-08-14_V1.csv",
              "WEPLD_SOURCE_ARTIFACT_PIN_LEDGER_2026-08-14_V1.md",
              "WEPLD_SOURCE_CAPABILITY_MINING_PRIORITY_MATRIX_2026-08-14_V1.md",
          }

          archive_bytes = archive_path.read_bytes()
          if len(archive_bytes) > 1_000_000:
              raise SystemExit("archive exceeds bounded compressed size")
          actual_archive_sha256 = hashlib.sha256(archive_bytes).hexdigest()
          if actual_archive_sha256 != expected_archive_sha256:
              raise SystemExit(
                  f"archive SHA-256 mismatch: {actual_archive_sha256}"
              )

          with tarfile.open(fileobj=io.BytesIO(archive_bytes), mode="r:gz") as tf:
              members = tf.getmembers()
              names = [member.name for member in members]
              if len(names) != len(expected_members) or set(names) != expected_members:
                  raise SystemExit("archive member mismatch or duplicate member")
              if any(not member.isfile() for member in members):
                  raise SystemExit("archive contains a non-regular member")
              if any(member.size > 1_000_000 for member in members):
                  raise SystemExit("archive member exceeds bounded size")
              if sum(member.size for member in members) > 2_000_000:
                  raise SystemExit("archive exceeds bounded total uncompressed size")

              payloads = {}
              for member in members:
                  extracted = tf.extractfile(member)
                  if extracted is None:
                      raise SystemExit(f"unable to read archive member: {member.name}")
                  payload = extracted.read()
                  if len(payload) != member.size:
                      raise SystemExit(f"truncated archive member: {member.name}")
                  payloads[member.name] = payload

          plan_name = "WEPLD_MASTER_ARCHITECTURE_EXECUTION_PLAN_2026-08-12_V2_2.md"
          plan_sha256 = hashlib.sha256(payloads[plan_name]).hexdigest()
          if plan_sha256 != expected_plan_sha256:
              raise SystemExit(f"master plan SHA-256 mismatch: {plan_sha256}")

          registry_name = "WEPLD_MASTER_SOURCE_REGISTRY_2026-08-14_V1.json"
          registry = json.loads(payloads[registry_name].decode("utf-8"))
          rows = registry.get("registry")
          if not isinstance(rows, list) or len(rows) != 402:
              raise SystemExit("source registry row count mismatch")
          names = [row.get("name") for row in rows]
          normalized = [name.casefold() for name in names if isinstance(name, str)]
          if len(normalized) != 402 or len(set(normalized)) != 402:
              raise SystemExit("registry names are missing, malformed, or non-unique")
          if any(row.get("admission_status") != "NOT_ADMITTED" for row in rows):
              raise SystemExit("registry unexpectedly contains an admitted source")

          counts = registry.get("counts", {})
          if counts.get("frozen_v1_5_named_entries") != 397:
              raise SystemExit("frozen V1.5 source count mismatch")
          if counts.get("post_v1_5_new_top_level_named_entries") != 5:
              raise SystemExit("post-V1.5 source count mismatch")
          if counts.get("current_accounted_named_entries") != 402:
              raise SystemExit("current source count mismatch")

          csv_rows = list(csv.DictReader(io.StringIO(
              payloads["WEPLD_MASTER_SOURCE_REGISTRY_2026-08-14_V1.csv"].decode("utf-8")
          )))
          if len(csv_rows) != 402:
              raise SystemExit("CSV source registry row count mismatch")
          csv_names = [row.get("name", "").casefold() for row in csv_rows]
          if len(set(csv_names)) != 402:
              raise SystemExit("CSV registry names are non-unique")

          for name in expected_members - {
              plan_name,
              registry_name,
              "WEPLD_MASTER_SOURCE_REGISTRY_2026-08-14_V1.csv",
          }:
              if not payloads[name].strip():
                  raise SystemExit(f"canonical artifact is empty: {name}")

          print("foundation canonical artifact verification: PASS")
          print(f"baseline_commit_sha={baseline_commit_sha}")
          print(f"baseline_blob_sha={baseline_response['sha']}")
          print(f"archive_sha256={actual_archive_sha256}")
          print(f"master_plan_sha256={plan_sha256}")
          print("source_registry_entries=402")
          print("source_admission=0")
          PY

      - name: Verify documentation-only foundation boundaries
        shell: bash
        run: |
          set -euo pipefail

          required=(
            AGENTS.md
            cubic.yaml
            docs/canonical/CURRENT_STATE.md
            docs/canonical/ARCHITECTURE_INVARIANTS.md
            docs/canonical/MASTER_PLAN_INDEX.md
            docs/canonical/FOUNDER_RATIFICATION.md
            docs/canonical/BUILD_METHOD.md
            docs/canonical/SECURITY_REVIEW_POLICY.md
            docs/canonical/EXTERNAL_REVIEW_EGRESS_POLICY.md
            docs/canonical/artifacts/README.md
            docs/governance/DEPENDENCY_REGISTER.md
            docs/governance/REPOSITORY_AUTHORITY_EVIDENCE_2026-08-14.md
            docs/governance/REPOSITORY_IP_STATE.md
            docs/governance/FOUNDATION_INTEGRITY_BASELINE.md
            specs/000-wepld-fresh-reconstitution/spec.md
            specs/000-wepld-fresh-reconstitution/plan.md
            specs/000-wepld-fresh-reconstitution/tasks.md
            specs/000-wepld-fresh-reconstitution/acceptance.md
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "missing required foundation path: $path" >&2; exit 1; }
          done

          test -d src || { echo 'src must be a real directory' >&2; exit 1; }
          test ! -L src || { echo 'src must not be a symbolic link' >&2; exit 1; }
          test -f src/.gitkeep || { echo 'src/.gitkeep missing' >&2; exit 1; }
          test ! -s src/.gitkeep || { echo 'src/.gitkeep must be empty' >&2; exit 1; }

          unexpected_src="$(find src -type f ! -name '.gitkeep' -print)"
          if [ -n "$unexpected_src" ]; then
            echo "unexpected implementation source in documentation-only phase:" >&2
            printf '%s\n' "$unexpected_src" >&2
            exit 1
          fi

          unexpected_symlinks="$(find . -path './.git' -prune -o -type l -print)"
          if [ -n "$unexpected_symlinks" ]; then
            echo "symbolic links are not permitted in documentation-only phase:" >&2
            printf '%s\n' "$unexpected_symlinks" >&2
            exit 1
          fi

          gitlinks="$(git ls-files -s | awk '$1 == "160000"')"
          if [ -n "$gitlinks" ]; then
            echo "git submodule/gitlink entries are not permitted:" >&2
            printf '%s\n' "$gitlinks" >&2
            exit 1
          fi

          unexpected_tracked="$(git ls-files | awk '
            function allowed(path) {
              if (path == ".coderabbit.yaml") return 1
              if (path == "cubic.yaml") return 1
              if (path == ".github/workflows/foundation-integrity.yml") return 1
              if (path == "AGENTS.md" || path == "README.md") return 1
              if (path == "src/.gitkeep") return 1
              if (path == "docs/canonical/artifacts/WEPLD_CANONICAL_ARTIFACTS_2026-08-14.tar.gz") return 1
              if (path ~ /^docs\/.*\.md$/) return 1
              if (path ~ /^specs\/.*\.md$/) return 1
              return 0
            }
            !allowed($0) { print $0 }
          ')"
          if [ -n "$unexpected_tracked" ]; then
            echo "tracked path outside documentation-only allowlist:" >&2
            printf '%s\n' "$unexpected_tracked" >&2
            exit 1
          fi

          unexpected_impl="$(find . -path './.git' -prune -o -type f \( \
            -name '*.rs' -o -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' \
            -o -name '*.py' -o -name '*.go' -o -name '*.java' -o -name '*.kt' -o -name '*.kts' \
            -o -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \
            -o -name '*.cs' -o -name '*.fs' -o -name '*.fsx' -o -name '*.vb' -o -name '*.scala' \
            -o -name '*.swift' -o -name '*.rb' -o -name '*.php' -o -name '*.lua' -o -name '*.dart' \
            -o -name '*.zig' -o -name '*.ex' -o -name '*.exs' -o -name '*.sh' -o -name '*.ps1' \
          \) -print)"
          if [ -n "$unexpected_impl" ]; then
            echo "unexpected implementation-language file in documentation-only phase:" >&2
            printf '%s\n' "$unexpected_impl" >&2
            exit 1
          fi

          dependency_manifests="$(find . -path './.git' -prune -o -type f \( \
            -name 'Cargo.toml' -o -name 'Cargo.lock' \
            -o -name 'package.json' -o -name 'package-lock.json' -o -name 'pnpm-lock.yaml' -o -name 'yarn.lock' \
            -o -name 'pyproject.toml' -o -name 'requirements.txt' -o -name 'Pipfile' -o -name 'Pipfile.lock' \
            -o -name 'poetry.lock' -o -name 'uv.lock' -o -name 'setup.py' -o -name 'setup.cfg' \
            -o -name 'go.mod' -o -name 'go.sum' -o -name 'Gemfile' -o -name 'Gemfile.lock' \
            -o -name 'composer.json' -o -name 'composer.lock' -o -name '*.csproj' -o -name '*.fsproj' \
          \) -print)"
          if [ -n "$dependency_manifests" ]; then
            echo "unexpected dependency manifest in documentation-only phase:" >&2
            printf '%s\n' "$dependency_manifests" >&2
            exit 1
          fi

          test ! -d .github/repair-payload || { echo 'repair payload leaked into active tree' >&2; exit 1; }
          test ! -e docs/canonical/CODEX_SECURITY_REVIEW_POLICY.md || { echo 'duplicate Codex Security canonical policy detected' >&2; exit 1; }

          repair_workflows="$(find .github/workflows -maxdepth 1 -type f \( -name 'repair-canonical-archive*.yml' -o -name 'finalize-canonical-archive*.yml' \) -print)"
          if [ -n "$repair_workflows" ]; then
            echo "temporary repair workflow leaked into active tree:" >&2
            printf '%s\n' "$repair_workflows" >&2
            exit 1
          fi

          grep -Fx 'FRESH_IMPLEMENTATION_DEPENDENCIES = 0' docs/governance/DEPENDENCY_REGISTER.md >/dev/null
          echo 'documentation-only foundation boundaries: PASS'

      - name: Verify hosted reviewers remain manual-only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          expected_coderabbit = """# External hosted review is manual-only until WePLD has a machine-enforced
          # pre-egress classification/screening/approval gate. Manual CodeRabbit review
          # commands remain available after the canonical egress preflight is recorded.
          reviews:
            auto_review:
              enabled: false
              auto_incremental_review: false
          """

          expected_cubic = """# yaml-language-server: $schema=https://cubic.dev/schema/cubic-repository-config.schema.json

          version: 1

          # WePLD requires a recorded exact-scope pre-egress gate before any hosted review.
          # Keep Cubic connected if desired, but do not let repository events transmit
          # repository content automatically.
          reviews:
            enabled: false
            incremental_commits: false
            check_drafts: false
            resolve_threads_when_addressed: false
            auto_approve_behavior: disabled
            auto_approve: disabled
            custom_rules: []

          pr_descriptions:
            generate: false

          issues:
            fix_with_cubic_buttons: false
            pr_comment_fixes: false
            fix_commits_to_pr: false
          """

          actual_coderabbit = Path('.coderabbit.yaml').read_text(encoding='utf-8')
          actual_cubic = Path('cubic.yaml').read_text(encoding='utf-8')
          if actual_coderabbit != expected_coderabbit:
              raise SystemExit('CodeRabbit manual-only configuration drifted')
          if actual_cubic != expected_cubic:
              raise SystemExit('Cubic manual-only configuration drifted')

          print('hosted reviewer manual-only configuration: PASS')
          PY
