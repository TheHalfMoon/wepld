name: foundation-integrity

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision with canonical history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
          lfs: false
          submodules: false

      - name: Diagnostic locate canonical package-refreeze push run
        shell: bash
        env:
          TARGET_SHA: a85bc7eadad33ec26e998c5af58dbee2a92b54c0
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          target = os.environ["TARGET_SHA"]
          url = (
              "https://api.github.com/repos/TheHalfMoon/wepld/actions/workflows/"
              "foundation-integrity.yml/runs?event=push&branch=main&per_page=100"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "wepld-read-only-package-refreeze-diagnostic",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.load(response)

          matches = [
              run for run in payload.get("workflow_runs", [])
              if run.get("event") == "push"
              and run.get("head_branch") == "main"
              and run.get("head_sha") == target
          ]
          print(f"TARGET_SHA={target}")
          print(f"MATCH_COUNT={len(matches)}")
          if not matches:
              raise SystemExit("TARGET_PACKAGE_REFREEZE_PUSH_RUN_NOT_FOUND")
          for run in matches:
              print(f"RUN_ID={run.get('id')}")
              print(f"RUN_NUMBER={run.get('run_number')}")
              print(f"EVENT={run.get('event')}")
              print(f"HEAD_BRANCH={run.get('head_branch')}")
              print(f"HEAD_SHA={run.get('head_sha')}")
              print(f"STATUS={run.get('status')}")
              print(f"CONCLUSION={run.get('conclusion')}")
              print(f"CREATED_AT={run.get('created_at')}")
              print(f"JOBS_URL={run.get('jobs_url')}")
          PY

      - name: Run integrity policy self-tests
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/wepld_harness_h0_spec_two_finding_repair_integrity.py selftest

      - name: Verify exact checked-out tree against the immutable baseline
        shell: bash
        env:
          WEPLD_COMPARISON_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${WEPLD_COMPARISON_SHA:-}" ]; then
            echo 'immutable baseline comparison SHA could not be established' >&2
            exit 1
          fi
          python .github/scripts/wepld_harness_h0_spec_two_finding_repair_integrity.py verify-local \
            --root . \
            --remote-baseline \
            --pr-base-sha "$WEPLD_COMPARISON_SHA"
