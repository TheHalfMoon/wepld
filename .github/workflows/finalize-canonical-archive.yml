name: finalize-canonical-archive

on:
  push:
    branches: [docs/fresh-reconstitution-v1]
    paths: [.github/repair-payload/FINALIZE]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: docs/fresh-reconstitution-v1
          fetch-depth: 1

      - name: Verify and publish exact canonical archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, csv, hashlib, io, json, pathlib, re, tarfile

          root = pathlib.Path('.')
          staged = root / '.github/repair-payload'
          archive_path = root / 'docs/canonical/artifacts/WEPLD_CANONICAL_ARTIFACTS_2026-08-14.tar.gz'
          readme_path = root / 'docs/canonical/artifacts/README.md'

          expected_archive = '35dee10e7526d1958c5b3b88a1a9b569b0d1a464f5eec4e20e16c19c99f1c6b0'
          expected_plan = 'e269b10ef711731c4ad3af7b1135546f92d82a78975cabc9ff52c2dea4b5bf44'
          expected_members = {
              'WEPLD_MASTER_ARCHITECTURE_EXECUTION_PLAN_2026-08-12_V2_2.md',
              'WEPLD_MASTER_SOURCE_REGISTRY_2026-08-14_V1.json',
              'WEPLD_MASTER_SOURCE_REGISTRY_2026-08-14_V1.csv',
              'WEPLD_SOURCE_ARTIFACT_PIN_LEDGER_2026-08-14_V1.md',
              'WEPLD_SOURCE_CAPABILITY_MINING_PRIORITY_MATRIX_2026-08-14_V1.md',
          }

          def read(name):
              return (staged / name).read_text(encoding='ascii').strip()

          prefix = ''.join(read(name) for name in [
              'chunk01.b64','chunk02.b64','chunk03.b64','chunk04.b64','chunk05.b64'
          ])
          middle = ''.join(read(name) for name in [
              'chunk06a01.b64','chunk06a02.b64','chunk06a03.b64','chunk06a04.b64'
          ])[:7500]
          suffix = ''.join(read(name) for name in [
              'chunk06b.b64','chunk07a.b64','chunk07b.b64','chunk08.b64','chunk09.b64'
          ])
          selected = base64.b64decode(prefix + middle + suffix, validate=True)

          actual_archive = hashlib.sha256(selected).hexdigest()
          if actual_archive != expected_archive:
              raise SystemExit(f'exact archive SHA mismatch: {actual_archive}')

          payloads = {}
          with tarfile.open(fileobj=io.BytesIO(selected), mode='r:gz') as tf:
              members = tf.getmembers()
              names = {m.name for m in members}
              if names != expected_members or any(not m.isfile() for m in members):
                  raise SystemExit(f'archive member contract mismatch: {sorted(names)}')
              for member in members:
                  extracted = tf.extractfile(member)
                  if extracted is None:
                      raise SystemExit(f'unreadable member: {member.name}')
                  data = extracted.read()
                  if len(data) != member.size:
                      raise SystemExit(f'truncated member: {member.name}')
                  payloads[member.name] = data

          plan_name = 'WEPLD_MASTER_ARCHITECTURE_EXECUTION_PLAN_2026-08-12_V2_2.md'
          if hashlib.sha256(payloads[plan_name]).hexdigest() != expected_plan:
              raise SystemExit('master-plan SHA mismatch')

          registry = json.loads(payloads['WEPLD_MASTER_SOURCE_REGISTRY_2026-08-14_V1.json'].decode('utf-8'))
          rows = registry.get('registry')
          names = [row.get('name','').casefold() for row in rows] if isinstance(rows, list) else []
          if len(rows or []) != 402 or len(set(names)) != 402:
              raise SystemExit('JSON registry count/uniqueness mismatch')
          if any(row.get('admission_status') != 'NOT_ADMITTED' for row in rows):
              raise SystemExit('unexpected admitted source')
          counts = registry.get('counts', {})
          if (
              counts.get('frozen_v1_5_named_entries'),
              counts.get('post_v1_5_new_top_level_named_entries'),
              counts.get('current_accounted_named_entries'),
          ) != (397, 5, 402):
              raise SystemExit('registry count anchors mismatch')

          csv_rows = list(csv.DictReader(io.StringIO(
              payloads['WEPLD_MASTER_SOURCE_REGISTRY_2026-08-14_V1.csv'].decode('utf-8')
          )))
          if len(csv_rows) != 402 or len({row.get('name','').casefold() for row in csv_rows}) != 402:
              raise SystemExit('CSV registry count/uniqueness mismatch')

          archive_path.write_bytes(selected)
          readme = readme_path.read_text(encoding='utf-8')
          readme, replacements = re.subn(
              r'(?<=SHA256 = )[0-9a-f]{64}', expected_archive, readme, count=1
          )
          if replacements != 1:
              raise SystemExit('could not update canonical artifact README hash')
          readme_path.write_text(readme, encoding='utf-8')
          print(f'canonical archive verified: {actual_archive}')
          print(f'master plan verified: {expected_plan}')
          print('registry verified: 402 unique / zero admitted')
          PY

          git rm -rf -- .github/repair-payload

          unexpected="$(git diff --name-only | grep -Ev '^(.github/repair-payload/|docs/canonical/artifacts/README\.md$|docs/canonical/artifacts/WEPLD_CANONICAL_ARTIFACTS_2026-08-14\.tar\.gz$)' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected finalizer scope:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: publish verified canonical artifact archive'
          git push origin HEAD:docs/fresh-reconstitution-v1
