name: foundation-integrity

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Run integrity policy self-tests
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/wepld_integrity.py selftest

      - name: Verify exact checked-out tree
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/wepld_integrity.py verify-local --root .
