          matches="$(printf '%s' "$data" | jq -c --argjson pr "$target_pr" --arg head "$target_head" --arg not_before "$not_before" '[.workflow_runs[] | select(.head_sha == $head and .name == "s1-admission-integrity" and .created_at >= $not_before and any(.pull_requests[]?; .number == $pr))]')"
          count="$(printf '%s' "$matches" | jq 'length')"
          echo "MATCH_COUNT=$count"
          printf '%s' "$matches" | jq -r '.[] | "RUN_ID=\(.id) RUN_NUMBER=\(.run_number) WORKFLOW=\(.name) EVENT=\(.event) STATUS=\(.status) CONCLUSION=\(.conclusion // "null") CREATED_AT=\(.created_at) IMMUTABLE_HEAD_SHA=\(.head_sha // "") PR_NUMBER=\(.pull_requests[0].number // 0) BASE_SHA=\(.pull_requests[0].base.sha // "")"'
