name: foundation-integrity

on:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-v9-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact simulated post-merge Git object set
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: c67eb570e9601f1dd21e1edd03a21926d29dc870
          path: postmerge
          persist-credentials: false
          fetch-depth: 0
          lfs: false
          submodules: false

      - name: Checkout diagnostic harness only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: diag
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Run exact production F1 and F2 entrypoints against Git-backed API payloads
        shell: bash
        run: |
          set -euo pipefail
          python diag/.github/scripts/diag_pr164_v9_git_backed_api_e2e.py --root postmerge
