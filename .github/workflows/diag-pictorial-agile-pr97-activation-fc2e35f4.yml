name: diag-pictorial-agile-pr97-activation-fc2e35f4

on:
  pull_request:

permissions: {}

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Locate exact post-merge foundation push run via public API
        shell: bash
        run: |
          set -euo pipefail
          target_head='fc2e35f4c646853460dd8858e19e7ca09f06bd4a'
          api='https://api.github.com/repos/TheHalfMoon/wepld/actions/runs?event=push&per_page=100'
          data="$(curl --fail --silent --show-error --location "$api")"
          matches="$(printf '%s' "$data" | jq -c --arg head "$target_head" '[.workflow_runs[] | select(.name == "foundation-integrity" and .head_sha == $head and .event == "push")]')"
          count="$(printf '%s' "$matches" | jq 'length')"
          echo "MATCH_COUNT=$count"
          printf '%s' "$matches" | jq -r '.[] | "RUN_ID=\(.id) RUN_NUMBER=\(.run_number) WORKFLOW=\(.name) EVENT=\(.event) STATUS=\(.status) CONCLUSION=\(.conclusion // "null") IMMUTABLE_HEAD_SHA=\(.head_sha // "") HEAD_BRANCH=\(.head_branch // "")"'
          test "$count" -eq 1
          echo 'MERGE=NEVER'
