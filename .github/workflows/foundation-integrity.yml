name: foundation-integrity

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision with canonical history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
          lfs: false
          submodules: false

      - name: Diagnostic locate Ready trusted admission run
        shell: bash
        env:
          TARGET_SHA: 68f9cce7ea0385992a3564fc189f41f42ff9b56a
          TARGET_BRANCH: docs/harness-h0-screening-spec-kit-two-finding-repair
          TARGET_PR: "59"
          READY_AT: "2026-08-20T19:10:48Z"
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          target_sha = os.environ["TARGET_SHA"]
          target_branch = os.environ["TARGET_BRANCH"]
          target_pr = int(os.environ["TARGET_PR"])
          ready_at = os.environ["READY_AT"]
          url = (
              "https://api.github.com/repos/TheHalfMoon/wepld/actions/workflows/"
              "s1-admission-integrity.yml/runs?event=pull_request_target&per_page=100"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "wepld-read-only-ready-admission-diagnostic",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.load(response)

          matches = []
          for run in payload.get("workflow_runs", []):
              prs = run.get("pull_requests") or []
              pr_numbers = {item.get("number") for item in prs if isinstance(item, dict)}
              created_at = run.get("created_at") or ""
              if (
                  run.get("event") == "pull_request_target"
                  and run.get("head_branch") == target_branch
                  and run.get("head_sha") == target_sha
                  and created_at >= ready_at
                  and (not pr_numbers or target_pr in pr_numbers)
              ):
                  matches.append(run)

          matches.sort(key=lambda run: (run.get("created_at") or "", run.get("id") or 0))
          print(f"TARGET_PR={target_pr}")
          print(f"TARGET_BRANCH={target_branch}")
          print(f"TARGET_SHA={target_sha}")
          print(f"READY_AT={ready_at}")
          print(f"MATCH_COUNT={len(matches)}")
          if not matches:
              raise SystemExit("READY_TRUSTED_ADMISSION_RUN_NOT_FOUND")
          for run in matches:
              print(f"RUN_ID={run.get('id')}")
              print(f"RUN_NUMBER={run.get('run_number')}")
              print(f"EVENT={run.get('event')}")
              print(f"HEAD_BRANCH={run.get('head_branch')}")
              print(f"HEAD_SHA={run.get('head_sha')}")
              print(f"STATUS={run.get('status')}")
              print(f"CONCLUSION={run.get('conclusion')}")
              print(f"CREATED_AT={run.get('created_at')}")
              print(f"JOBS_URL={run.get('jobs_url')}")
          PY

      - name: Run integrity policy self-tests
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/wepld_harness_h0_spec_two_finding_repair_integrity.py selftest

      - name: Verify exact checked-out tree against the immutable baseline
        shell: bash
        env:
          WEPLD_COMPARISON_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${WEPLD_COMPARISON_SHA:-}" ]; then
            echo 'immutable baseline comparison SHA could not be established' >&2
            exit 1
          fi
          python .github/scripts/wepld_harness_h0_spec_two_finding_repair_integrity.py verify-local \
            --root . \
            --remote-baseline \
            --pr-base-sha "$WEPLD_COMPARISON_SHA"
