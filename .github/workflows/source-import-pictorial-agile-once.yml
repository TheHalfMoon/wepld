name: one-shot Pictorial Agile source import

on:
  push:
    branches:
      - import/pictorial-agile-full-source-snapshot-2026-08-23
    paths:
      - .github/workflows/source-import-pictorial-agile-once.yml

permissions:
  contents: write

concurrency:
  group: pictorial-agile-source-import-2026-08-23
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_MAIN: 2ab2fae14bc3b3b1f1e9bc2059972456955aeff7
      BRANCH_NAME: import/pictorial-agile-full-source-snapshot-2026-08-23
      BOOTSTRAP_WORKFLOW: .github/workflows/source-import-pictorial-agile-once.yml
    steps:
      - name: Clone candidate and prove exact base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --no-tags --single-branch --branch "${BRANCH_NAME}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          test "$(git merge-base "${EXPECTED_MAIN}" HEAD)" = "${EXPECTED_MAIN}"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "${EXPECTED_MAIN}"

      - name: Import pinned source snapshots without donor execution
        run: |
          set -euo pipefail
          cd repo
          python3 docs/acquisition/tools/import_pictorial_agile_source_snapshot.py

      - name: Commit source-only candidate and remove one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd repo
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "${EXPECTED_MAIN}"
          rm "${BOOTSTRAP_WORKFLOW}"

          git add -A
          test -n "$(git diff --cached --name-only)"

          while IFS= read -r path; do
            case "$path" in
              vendor/pictorial/*|vendor/agile/*|legal/third-party/PICTORIAL_*|legal/third-party/AGILE_*|docs/acquisition/source-maps/*|docs/acquisition/WEPLD_PICTORIAL_AGILE_SOURCE_IMPORT_REPORT_2026-08-23.md|docs/acquisition/WEPLD_PICTORIAL_AGILE_SOURCE_IMPORT_SURFACE_INVENTORY_2026-08-23.json|.github/workflows/source-import-pictorial-agile-once.yml)
                ;;
              *)
                echo "FAIL_CLOSED_UNEXPECTED_CHANGED_PATH=${path}"
                exit 1
                ;;
            esac
          done < <(git diff --cached --name-only)

          test ! -e "${BOOTSTRAP_WORKFLOW}"
          test -d vendor/pictorial
          test -d vendor/agile
          test -f legal/third-party/PICTORIAL_LICENSE.txt
          test -f legal/third-party/PICTORIAL_NOTICE.md
          test -f legal/third-party/AGILE_LICENSE.txt
          test -f docs/acquisition/source-maps/pictorial-source-map-2026-08-23.jsonl
          test -f docs/acquisition/source-maps/agile-source-map-2026-08-23.jsonl

          git config user.name "wepld-source-import"
          git config user.email "wepld-source-import@users.noreply.github.com"
          git commit -m "feat(vendor): import pinned Pictorial and Agile source snapshots"
          git push origin HEAD:"${BRANCH_NAME}"

          echo "SOURCE_IMPORT_HEAD=$(git rev-parse HEAD)"
          echo "SOURCE_IMPORT_TREE=$(git rev-parse HEAD^{tree})"
