name: diag-pictorial-agile-pr121-admission-349c9d6f

on:
  pull_request:

permissions: {}

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Locate exact PR121 trusted admission run by immutable head_sha
        shell: bash
        run: |
          set -euo pipefail
          target_pr=121
          target_head='aa7ac1239cbed55c255549876e4534265d63949b'
          api='https://api.github.com/repos/TheHalfMoon/wepld/actions/runs?event=pull_request_target&per_page=100'
          data="$(curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --retry-all-errors "$api")"
          matches="$(printf '%s' "$data" | jq -c --argjson pr "$target_pr" --arg head "$target_head" '[.workflow_runs[] | select(.head_sha == $head and .name == "s1-admission-integrity" and any(.pull_requests[]?; .number == $pr))]')"
          count="$(printf '%s' "$matches" | jq 'length')"
          echo "MATCH_COUNT=$count"
          printf '%s' "$matches" | jq -r '.[] | "RUN_ID=\(.id) RUN_NUMBER=\(.run_number) WORKFLOW=\(.name) EVENT=\(.event) STATUS=\(.status) CONCLUSION=\(.conclusion // "null") IMMUTABLE_HEAD_SHA=\(.head_sha // "") PR_NUMBER=\(.pull_requests[0].number // 0) BASE_SHA=\(.pull_requests[0].base.sha // "")"'
          test "$count" -eq 1
          echo 'MERGE=NEVER'
          echo 'MUTATION_AUTHORITY=NONE'
          echo 'LOCATOR_ONLY=YES'
