name: foundation-integrity

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision with canonical history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
          lfs: false
          submodules: false

      - name: Run integrity policy self-tests
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/wepld_harness_h0_spec_four_finding_repair_integrity.py selftest

      - name: Verify exact checked-out tree against the immutable baseline
        shell: bash
        env:
          WEPLD_COMPARISON_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${WEPLD_COMPARISON_SHA:-}" ]; then
            echo 'immutable baseline comparison SHA could not be established' >&2
            exit 1
          fi
          python .github/scripts/wepld_harness_h0_spec_four_finding_repair_integrity.py verify-local \
            --root . \
            --remote-baseline \
            --pr-base-sha "$WEPLD_COMPARISON_SHA"
