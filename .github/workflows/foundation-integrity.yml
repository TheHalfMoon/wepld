name: foundation-integrity

on:
  pull_request:

permissions:
  contents: write

jobs:
  f2-repair-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR164 target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/pictorial-agile-source-admission-v9-lock-overlay-2026-08-24
          path: target
          persist-credentials: true
          fetch-depth: 0
          lfs: false
          submodules: false

      - name: Checkout diagnostic generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: diag
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Revalidate immutable bindings
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = '7d24c3047191822d687b5fb3cd52e228a6353651'
          test "$(git -C target ls-remote origin refs/heads/ci/pictorial-agile-source-admission-v9-lock-overlay-2026-08-24 | cut -f1)" = '7d24c3047191822d687b5fb3cd52e228a6353651'
          test "$(git -C target ls-remote origin refs/heads/main | cut -f1)" = '08a06e9f2664735eb55db5b2f49f95d3d3f91c3f'

      - name: Generate and qualify exact F2 repair
        shell: bash
        run: |
          set -euo pipefail
          cd target
          python ../diag/.github/scripts/diag_pr164_v9_f2_local_client_bridge_repair.py
          python -m py_compile .github/scripts/wepld_pictorial_agile_source_admission_v9_integrity.py
          python .github/scripts/wepld_pictorial_agile_source_admission_v9_integrity.py selftest
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | sort > /tmp/actual-paths
          printf '%s\n' \
            '.github/scripts/wepld_pictorial_agile_source_admission_v9_integrity.py' \
            'docs/acquisition/WEPLD_PICTORIAL_LOCK_METADATA_OVERLAY_V9_EVIDENCE_2026-08-24.md' \
            | sort > /tmp/expected-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
          cat /tmp/pr164-v9-f2-repair.manifest

      - name: Commit and fast-forward PR164 branch
        shell: bash
        run: |
          set -euo pipefail
          cd target
          test "$(git ls-remote origin refs/heads/ci/pictorial-agile-source-admission-v9-lock-overlay-2026-08-24 | cut -f1)" = '7d24c3047191822d687b5fb3cd52e228a6353651'
          git config user.name 'wepld-policy-repair'
          git config user.email 'wepld-policy-repair@users.noreply.github.com'
          git add .github/scripts/wepld_pictorial_agile_source_admission_v9_integrity.py \
            docs/acquisition/WEPLD_PICTORIAL_LOCK_METADATA_OVERLAY_V9_EVIDENCE_2026-08-24.md
          git diff --cached --quiet && { echo 'repair produced no staged delta' >&2; exit 1; }
          git commit -m 'fix(ci): bridge v9 F2 local remote-baseline client'
          git push origin HEAD:refs/heads/ci/pictorial-agile-source-admission-v9-lock-overlay-2026-08-24
