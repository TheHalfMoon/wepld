name: foundation-integrity

on:
  pull_request:
  push:
    branches:
      - docs/fresh-reconstitution-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify canonical artifact archive against immutable baseline
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import csv
          import hashlib
          import io
          import json
          import os
          import pathlib
          import tarfile
          import urllib.request

          archive_path = pathlib.Path(
              "docs/canonical/artifacts/WEPLD_CANONICAL_ARTIFACTS_2026-08-14.tar.gz"
          )

          baseline_commit_sha = "421c769b47fd8ad4f5bcba67ff8b00ba0adfc6c3"
          baseline_path = ".wepld/foundation-integrity-baseline-v1.json"
          baseline_url = (
              "https://api.github.com/repos/TheHalfMoon/wepld/contents/"
              f"{baseline_path}?ref={baseline_commit_sha}"
          )
          request = urllib.request.Request(
              baseline_url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              baseline_response = json.load(response)
          baseline = json.loads(
              base64.b64decode(baseline_response["content"]).decode("utf-8")
          )

          if baseline.get("schema") != "wepld.foundation-integrity-baseline.v1":
              raise SystemExit("unexpected foundation baseline schema")
          if baseline.get("baseline_class") != "BOOTSTRAP_INTEGRITY_EVIDENCE_NOT_ACCEPTANCE":
              raise SystemExit("unexpected foundation baseline class")
          if baseline.get("repository_id") != 1334408699:
              raise SystemExit("foundation baseline repository ID mismatch")
          if baseline.get("repository") != "TheHalfMoon/wepld":
              raise SystemExit("foundation baseline repository mismatch")
          if baseline.get("source_registry_entries") != 402:
              raise SystemExit("foundation baseline source count mismatch")
          if baseline.get("source_admission") != 0:
              raise SystemExit("foundation baseline unexpectedly admits sources")

          if os.environ.get("EVENT_NAME") == "pull_request":
              pr_base = os.environ.get("PR_BASE_SHA", "")
              if not pr_base or pr_base != baseline.get("base_main_sha"):
                  raise SystemExit(
                      f"pull-request base SHA does not match immutable baseline: {pr_base}"
                  )

          expected_archive_sha256 = baseline["canonical_artifact_archive_sha256"]
          expected_plan_sha256 = baseline["master_plan_v2_2_sha256"]
          expected_members = {
              "WEPLD_MASTER_ARCHITECTURE_EXECUTION_PLAN_2026-08-12_V2_2.md",
              "WEPLD_MASTER_SOURCE_REGISTRY_2026-08-14_V1.json",
              "WEPLD_MASTER_SOURCE_REGISTRY_2026-08-14_V1.csv",
              "WEPLD_SOURCE_ARTIFACT_PIN_LEDGER_2026-08-14_V1.md",
              "WEPLD_SOURCE_CAPABILITY_MINING_PRIORITY_MATRIX_2026-08-14_V1.md",
          }
          max_archive_bytes = 1_000_000
          max_member_bytes = 1_000_000
          max_total_uncompressed_bytes = 2_000_000

          archive_bytes = archive_path.read_bytes()
          if len(archive_bytes) > max_archive_bytes:
              raise SystemExit(
                  f"archive exceeds bounded compressed size: {len(archive_bytes)}"
              )

          actual_archive_sha256 = hashlib.sha256(archive_bytes).hexdigest()
          if actual_archive_sha256 != expected_archive_sha256:
              raise SystemExit(
                  f"archive SHA-256 mismatch: {actual_archive_sha256}"
              )

          with tarfile.open(fileobj=io.BytesIO(archive_bytes), mode="r:gz") as tf:
              members = tf.getmembers()
              names = [member.name for member in members]
              unique_names = set(names)

              if len(members) != len(expected_members) or len(unique_names) != len(members):
                  raise SystemExit("archive contains duplicate or unexpected member count")
              if unique_names != expected_members:
                  raise SystemExit(
                      f"archive member mismatch: expected={sorted(expected_members)} actual={sorted(unique_names)}"
                  )
              if any(not member.isfile() for member in members):
                  raise SystemExit("archive contains a non-regular member")
              if any(member.size > max_member_bytes for member in members):
                  raise SystemExit("archive member exceeds bounded uncompressed size")
              total_uncompressed = sum(member.size for member in members)
              if total_uncompressed > max_total_uncompressed_bytes:
                  raise SystemExit(
                      f"archive exceeds bounded total uncompressed size: {total_uncompressed}"
                  )

              members_by_name = {member.name: member for member in members}
              payloads = {}
              for name in expected_members:
                  extracted = tf.extractfile(members_by_name[name])
                  if extracted is None:
                      raise SystemExit(f"unable to read archive member: {name}")
                  payload = extracted.read()
                  if len(payload) != members_by_name[name].size:
                      raise SystemExit(f"truncated archive member: {name}")
                  payloads[name] = payload

          plan_name = "WEPLD_MASTER_ARCHITECTURE_EXECUTION_PLAN_2026-08-12_V2_2.md"
          plan_sha256 = hashlib.sha256(payloads[plan_name]).hexdigest()
          if plan_sha256 != expected_plan_sha256:
              raise SystemExit(f"master plan SHA-256 mismatch: {plan_sha256}")

          registry_name = "WEPLD_MASTER_SOURCE_REGISTRY_2026-08-14_V1.json"
          registry = json.loads(payloads[registry_name].decode("utf-8"))
          rows = registry.get("registry")
          if not isinstance(rows, list):
              raise SystemExit("registry payload is not a list")
          if len(rows) != baseline["source_registry_entries"]:
              raise SystemExit(f"expected 402 registry rows, got {len(rows)}")

          names = [row.get("name") for row in rows]
          normalized_names = [name.casefold() for name in names if isinstance(name, str)]
          if len(normalized_names) != 402 or len(set(normalized_names)) != 402:
              raise SystemExit("registry names are missing, malformed, or non-unique")

          if any(row.get("admission_status") != "NOT_ADMITTED" for row in rows):
              raise SystemExit("registry unexpectedly contains an admitted source")

          counts = registry.get("counts", {})
          if counts.get("frozen_v1_5_named_entries") != 397:
              raise SystemExit("frozen V1.5 source count mismatch")
          if counts.get("post_v1_5_new_top_level_named_entries") != 5:
              raise SystemExit("post-V1.5 source count mismatch")
          if counts.get("current_accounted_named_entries") != 402:
              raise SystemExit("current source count mismatch")

          csv_name = "WEPLD_MASTER_SOURCE_REGISTRY_2026-08-14_V1.csv"
          csv_rows = list(
              csv.DictReader(io.StringIO(payloads[csv_name].decode("utf-8")))
          )
          if len(csv_rows) != 402:
              raise SystemExit(f"expected 402 CSV rows, got {len(csv_rows)}")
          csv_names = [row.get("name", "").casefold() for row in csv_rows]
          if len(set(csv_names)) != 402:
              raise SystemExit("CSV registry names are non-unique")

          for name in expected_members - {plan_name, registry_name, csv_name}:
              if not payloads[name].strip():
                  raise SystemExit(f"canonical artifact is empty: {name}")

          print("foundation canonical artifact verification: PASS")
          print(f"baseline_commit_sha={baseline_commit_sha}")
          print(f"baseline_blob_sha={baseline_response['sha']}")
          print(f"archive_sha256={actual_archive_sha256}")
          print(f"master_plan_sha256={plan_sha256}")
          print("source_registry_entries=402")
          print("source_admission=0")
          print(f"archive_uncompressed_bytes={total_uncompressed}")
          PY

      - name: Verify fresh-foundation boundaries
        shell: bash
        run: |
          set -euo pipefail

          required=(
            AGENTS.md
            docs/canonical/CURRENT_STATE.md
            docs/canonical/ARCHITECTURE_INVARIANTS.md
            docs/canonical/BUILD_METHOD.md
            docs/canonical/SECURITY_REVIEW_POLICY.md
            docs/canonical/EXTERNAL_REVIEW_EGRESS_POLICY.md
            docs/governance/DEPENDENCY_REGISTER.md
            docs/governance/REPOSITORY_AUTHORITY_EVIDENCE_2026-08-14.md
            docs/governance/FOUNDATION_INTEGRITY_BASELINE.md
            specs/000-wepld-fresh-reconstitution/spec.md
            specs/000-wepld-fresh-reconstitution/plan.md
            specs/000-wepld-fresh-reconstitution/tasks.md
            specs/000-wepld-fresh-reconstitution/acceptance.md
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "missing required foundation path: $path" >&2; exit 1; }
          done

          test -d src || { echo 'src must be a real directory' >&2; exit 1; }
          test ! -L src || { echo 'src must not be a symbolic link' >&2; exit 1; }
          test -f src/.gitkeep || { echo 'src/.gitkeep missing' >&2; exit 1; }

          unexpected_src="$(find src -type f ! -name '.gitkeep' -print)"
          if [ -n "$unexpected_src" ]; then
            echo "unexpected implementation source in fresh foundation:" >&2
            printf '%s\n' "$unexpected_src" >&2
            exit 1
          fi

          unexpected_symlinks="$(find . -path './.git' -prune -o -type l -print)"
          if [ -n "$unexpected_symlinks" ]; then
            echo "symbolic links are not permitted in the fresh foundation:" >&2
            printf '%s\n' "$unexpected_symlinks" >&2
            exit 1
          fi

          unexpected_impl="$(find . -path './.git' -prune -o -type f \( \
            -name '*.rs' -o -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' \
            -o -name '*.py' -o -name '*.go' -o -name '*.java' -o -name '*.kt' \
            -o -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \
            -o -name '*.swift' \
          \) -print)"
          if [ -n "$unexpected_impl" ]; then
            echo "unexpected implementation-language file in fresh foundation:" >&2
            printf '%s\n' "$unexpected_impl" >&2
            exit 1
          fi

          dependency_manifests=(
            Cargo.toml Cargo.lock
            package.json package-lock.json pnpm-lock.yaml yarn.lock
            pyproject.toml requirements.txt Pipfile poetry.lock uv.lock
            go.mod go.sum
          )
          for manifest in "${dependency_manifests[@]}"; do
            if [ -e "$manifest" ]; then
              echo "unexpected implementation dependency manifest: $manifest" >&2
              exit 1
            fi
          done

          test ! -d .github/repair-payload || { echo 'repair payload leaked into active tree' >&2; exit 1; }
          test ! -e docs/canonical/CODEX_SECURITY_REVIEW_POLICY.md || { echo 'duplicate Codex Security canonical policy detected' >&2; exit 1; }

          repair_workflows="$(find .github/workflows -maxdepth 1 -type f \( -name 'repair-canonical-archive*.yml' -o -name 'finalize-canonical-archive*.yml' \) -print)"
          if [ -n "$repair_workflows" ]; then
            echo "temporary repair workflow leaked into active tree:" >&2
            printf '%s\n' "$repair_workflows" >&2
            exit 1
          fi

          grep -Fx 'FRESH_IMPLEMENTATION_DEPENDENCIES = 0' docs/governance/DEPENDENCY_REGISTER.md >/dev/null
          echo 'fresh foundation boundaries: PASS'
