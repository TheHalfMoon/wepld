name: S1-005 freeze verified glib candidate to prep

on:
  push:
    branches:
      - acq/s1-005-glib-0.18.5-official-bytes

permissions:
  contents: write

jobs:
  freeze:
    name: Reverify official bytes and atomically freeze prep candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_PARENT: f1919396eacb90d8d947b06f023ae9da233a4580
      EXPECTED_BASE_TREE: 902265157e9db7a0775d9794edd9db8d03724354
      EXPECTED_CRATE_SHA256: 233daaf6e83ae6a12a52055f568f9d7cf4671dabb78ff9560ab6da230ce00ee5
      EXPECTED_VENDOR_TREE: c064fcd71830730d12645b54228326cefefd6188
      EXPECTED_VARIANT_BLOB: e0997f651b103f7b198e528ee41137ad374e19b8
      CRATE_URL: https://static.crates.io/crates/glib/glib-0.18.5.crate
      TARGET_BRANCH: prep/s1-005-glib-0.18.5-backport
      VENDOR_PREFIX: third_party/glib-0.18.5-wepld1
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Reverify source and candidate tree
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          umask 077

          root="$RUNNER_TEMP/wepld-s1-005-glib-freeze"
          crate="$root/glib-0.18.5.crate"
          extract="$root/extract"
          pristine="$extract/glib-0.18.5"
          vendor="$root/glib-0.18.5-wepld1"

          rm -rf "$root"
          mkdir -p "$extract"

          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            "$CRATE_URL" \
            --output "$crate"

          actual_sha256="$(sha256sum "$crate" | awk '{print $1}')"
          test "$actual_sha256" = "$EXPECTED_CRATE_SHA256"

          CRATE="$crate" EXTRACT="$extract" python3 - <<'PY'
          import os
          import tarfile
          from pathlib import PurePosixPath

          with tarfile.open(os.environ["CRATE"], "r:gz") as archive:
              members = archive.getmembers()
              if not members:
                  raise SystemExit("ABORT: empty crate")
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"ABORT: unsafe archive path: {member.name}")
                  if member.name != "glib-0.18.5" and not member.name.startswith("glib-0.18.5/"):
                      raise SystemExit(f"ABORT: unexpected package root: {member.name}")
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f"ABORT: unsupported archive member: {member.name}")
              archive.extractall(os.environ["EXTRACT"])
          PY

          cp -a "$pristine" "$vendor"

          VARIANT="$vendor/src/variant_iter.rs" python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path(os.environ["VARIANT"])
          data = p.read_bytes()
          replacements = [
              (b"let p: *mut libc::c_char = std::ptr::null_mut();", b"let mut p: *mut libc::c_char = std::ptr::null_mut();"),
              (b"                &p,\n", b"                &mut p,\n"),
          ]
          for old, new in replacements:
              if data.count(old) != 1:
                  raise SystemExit(f"ABORT: expected exactly one source byte sequence: {old!r}")
              data = data.replace(old, new, 1)
          p.write_bytes(data)
          for old, new in replacements:
              if old in data or data.count(new) != 1:
                  raise SystemExit("ABORT: patch postcondition failed")
          PY

          PRISTINE="$pristine" VENDOR="$vendor" python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path(os.environ["PRISTINE"])
          v = Path(os.environ["VENDOR"])
          pf = sorted(x.relative_to(p).as_posix() for x in p.rglob("*") if x.is_file())
          vf = sorted(x.relative_to(v).as_posix() for x in v.rglob("*") if x.is_file())
          if pf != vf or len(pf) != 121:
              raise SystemExit("ABORT: candidate file-set identity mismatch")
          changed = [rel for rel in pf if (p / rel).read_bytes() != (v / rel).read_bytes()]
          if changed != ["src/variant_iter.rs"]:
              raise SystemExit(f"ABORT: unexpected changed files: {changed}")
          for rel in vf:
              mode = (v / rel).stat().st_mode & 0o777
              if mode != 0o644:
                  raise SystemExit(f"ABORT: unexpected file mode {mode:o}: {rel}")
          PY

          git -C "$vendor" init -q
          git -C "$vendor" config core.autocrlf false
          git -C "$vendor" config core.filemode true
          git -C "$vendor" add -A
          vendor_tree="$(git -C "$vendor" write-tree)"
          variant_blob="$(git -C "$vendor" hash-object src/variant_iter.rs)"
          test "$vendor_tree" = "$EXPECTED_VENDOR_TREE"
          test "$variant_blob" = "$EXPECTED_VARIANT_BLOB"
          rm -rf "$vendor/.git"

          echo "PUBLISHED_CRATE_SHA256=$actual_sha256"
          echo "VENDOR_TREE_SHA=$vendor_tree"
          echo "PATCHED_VARIANT_GIT_BLOB_SHA=$variant_blob"

          echo "VENDOR_DIR=$vendor" >> "$GITHUB_ENV"

      - name: Create exact vendor-only commit and fast-forward prep ref
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          expected_parent = os.environ["EXPECTED_PARENT"]
          expected_base_tree = os.environ["EXPECTED_BASE_TREE"]
          expected_vendor_tree = os.environ["EXPECTED_VENDOR_TREE"]
          target_branch = os.environ["TARGET_BRANCH"]
          vendor_prefix = os.environ["VENDOR_PREFIX"]
          vendor_dir = pathlib.Path(os.environ["VENDOR_DIR"])
          api = f"https://api.github.com/repos/{repo}"

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload, separators=(",", ":")).encode("utf-8")
              req = urllib.request.Request(
                  api + path,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "wepld-s1-005-acquisition",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return json.loads(resp.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"ABORT: GitHub API {method} {path} failed: {exc.code} {body}")

          encoded_ref = urllib.parse.quote("heads/" + target_branch, safe="/")
          ref = request("GET", f"/git/ref/{encoded_ref}")
          current = ref.get("object", {}).get("sha")
          if current != expected_parent:
              raise SystemExit(f"ABORT: prep branch moved before blob construction: {current}")

          parent_commit = request("GET", f"/git/commits/{expected_parent}")
          parent_tree = parent_commit.get("tree", {}).get("sha")
          if parent_tree != expected_base_tree:
              raise SystemExit(f"ABORT: canonical base tree mismatch: {parent_tree}")

          entries = []
          files = sorted(p for p in vendor_dir.rglob("*") if p.is_file())
          if len(files) != 121:
              raise SystemExit(f"ABORT: expected 121 vendor files, got {len(files)}")

          for path in files:
              rel = path.relative_to(vendor_dir).as_posix()
              raw = path.read_bytes()
              blob = request("POST", "/git/blobs", {
                  "content": base64.b64encode(raw).decode("ascii"),
                  "encoding": "base64",
              })
              sha = blob.get("sha")
              if not isinstance(sha, str) or len(sha) != 40:
                  raise SystemExit(f"ABORT: malformed blob response for {rel}")
              entries.append({
                  "path": f"{vendor_prefix}/{rel}",
                  "mode": "100644",
                  "type": "blob",
                  "sha": sha,
              })

          root_tree = request("POST", "/git/trees", {
              "base_tree": expected_base_tree,
              "tree": entries,
          })
          root_tree_sha = root_tree.get("sha")
          if not isinstance(root_tree_sha, str) or len(root_tree_sha) != 40:
              raise SystemExit("ABORT: malformed root tree response")

          recursive = request("GET", f"/git/trees/{root_tree_sha}?recursive=1")
          subtree = None
          for entry in recursive.get("tree", []):
              if entry.get("path") == vendor_prefix and entry.get("type") == "tree":
                  subtree = entry.get("sha")
                  break
          if subtree != expected_vendor_tree:
              raise SystemExit(f"ABORT: GitHub-created vendor subtree mismatch: {subtree}")

          commit = request("POST", "/git/commits", {
              "message": "prep(s1): freeze glib 0.18.5 security backport candidate",
              "tree": root_tree_sha,
              "parents": [expected_parent],
          })
          new_head = commit.get("sha")
          if not isinstance(new_head, str) or len(new_head) != 40:
              raise SystemExit("ABORT: malformed commit response")

          ref2 = request("GET", f"/git/ref/{encoded_ref}")
          current2 = ref2.get("object", {}).get("sha")
          if current2 != expected_parent:
              raise SystemExit(f"ABORT: prep branch raced before ref update: {current2}")

          updated = request("PATCH", f"/git/refs/{encoded_ref}", {
              "sha": new_head,
              "force": False,
          })
          final_sha = updated.get("object", {}).get("sha")
          if final_sha != new_head:
              raise SystemExit(f"ABORT: prep ref update identity mismatch: {final_sha}")

          print("WEPLD_S1_005_GLIB_BACKPORT_PREP")
          print(f"BASE={expected_parent}")
          print(f"NEW_HEAD={new_head}")
          print(f"NEW_HEAD_PARENT={expected_parent}")
          print(f"VENDOR_TREE_SHA={expected_vendor_tree}")
          print(f"PREP_BRANCH={target_branch}")
          print("PR_OPENED=NO")
          print("SOURCE_ACQUISITION_CHECK=OPEN")
          print("RUNTIME_DEPENDENCY_ADMISSION=NONE")
          print("PRODUCT_IMPLEMENTATION=BLOCKED")
          PY
