name: S1-005 bootstrap component admission policy candidate v3

on:
  push:
    branches:
      - bootstrap/s1-005-component-admission-policy

permissions:
  contents: write

jobs:
  build-policy-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_BASE: f1919396eacb90d8d947b06f023ae9da233a4580
      EXPECTED_BASE_TREE: 902265157e9db7a0775d9794edd9db8d03724354
      EXPECTED_SCRIPT_BLOB: 213c7b35fd24409a97d3fe16f16e3cb763c78a85
      TARGET_BRANCH: ci/s1-005-component-admission-integrity
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact bootstrap head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify immutable bootstrap inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:.github/scripts/wepld_integrity.py)" = "$EXPECTED_SCRIPT_BLOB"

          git fetch --no-tags --depth=1 \
            https://github.com/TheHalfMoon/wepld.git \
            refs/heads/main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_BASE"
          test "$(git rev-parse "$EXPECTED_BASE^{tree}")" = "$EXPECTED_BASE_TREE"

          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          expected = os.environ["EXPECTED_BASE"]
          target = os.environ["TARGET_BRANCH"]
          api = f"https://api.github.com/repos/{repo}"

          def get(path, allow_404=False):
              req = urllib.request.Request(
                  api + path,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "wepld-s1-005-policy-bootstrap",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  if allow_404 and exc.code == 404:
                      return None
                  raise

          main_ref = get("/git/ref/heads/main")
          if main_ref.get("object", {}).get("sha") != expected:
              raise SystemExit("ABORT: canonical main moved before bootstrap validation")

          target_path = "/git/ref/heads/" + urllib.parse.quote(target, safe="/")
          if get(target_path, allow_404=True) is not None:
              raise SystemExit("ABORT: target policy branch already exists")
          PY

      - name: Apply exact policy patch and spec
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/bootstrap/s1_005_component_policy_patch.py
          cp \
            .github/bootstrap/s1-005-component-admission-integrity.md.template \
            specs/001-desktop-rust-trusted-core-handshake/s1-005-component-admission-integrity.md

          python3 -m py_compile .github/scripts/wepld_integrity.py
          python3 .github/scripts/wepld_integrity.py selftest

      - name: Build and validate clean two-file candidate tree
        shell: bash
        run: |
          set -euo pipefail

          candidate="$RUNNER_TEMP/s1-005-policy-candidate"
          rm -rf "$candidate"
          git worktree add --detach "$candidate" "$EXPECTED_BASE"

          cp \
            .github/scripts/wepld_integrity.py \
            "$candidate/.github/scripts/wepld_integrity.py"
          cp \
            specs/001-desktop-rust-trusted-core-handshake/s1-005-component-admission-integrity.md \
            "$candidate/specs/001-desktop-rust-trusted-core-handshake/s1-005-component-admission-integrity.md"

          git -C "$candidate" config user.name "WePLD Bootstrap Validator"
          git -C "$candidate" config user.email "bootstrap-validator@users.noreply.github.com"
          git -C "$candidate" add -- \
            .github/scripts/wepld_integrity.py \
            specs/001-desktop-rust-trusted-core-handshake/s1-005-component-admission-integrity.md

          git -C "$candidate" diff --cached --check
          mapfile -t changed < <(git -C "$candidate" diff --cached --name-only)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/scripts/wepld_integrity.py"
          test "${changed[1]}" = "specs/001-desktop-rust-trusted-core-handshake/s1-005-component-admission-integrity.md"

          GIT_AUTHOR_DATE='2000-01-01T00:00:00Z' \
          GIT_COMMITTER_DATE='2000-01-01T00:00:00Z' \
            git -C "$candidate" commit -m "ci(s1): admit exact frozen glib component candidate"

          test "$(git -C "$candidate" rev-parse HEAD^)" = "$EXPECTED_BASE"
          mapfile -t committed < <(git -C "$candidate" diff --name-only "$EXPECTED_BASE..HEAD")
          test "${#committed[@]}" -eq 2
          test "${committed[0]}" = ".github/scripts/wepld_integrity.py"
          test "${committed[1]}" = "specs/001-desktop-rust-trusted-core-handshake/s1-005-component-admission-integrity.md"

          local_tree="$(git -C "$candidate" rev-parse 'HEAD^{tree}')"
          local_script_blob="$(git -C "$candidate" rev-parse 'HEAD:.github/scripts/wepld_integrity.py')"
          local_spec_blob="$(git -C "$candidate" rev-parse 'HEAD:specs/001-desktop-rust-trusted-core-handshake/s1-005-component-admission-integrity.md')"

          python3 "$candidate/.github/scripts/wepld_integrity.py" selftest
          python3 "$candidate/.github/scripts/wepld_integrity.py" verify-local \
            --root "$candidate" \
            --remote-baseline \
            --pr-base-sha "$EXPECTED_BASE"

          echo "LOCAL_CANDIDATE_TREE=$local_tree" >> "$GITHUB_ENV"
          echo "LOCAL_SCRIPT_BLOB=$local_script_blob" >> "$GITHUB_ENV"
          echo "LOCAL_SPEC_BLOB=$local_spec_blob" >> "$GITHUB_ENV"

          echo "LOCAL_CANDIDATE_TREE=$local_tree"
          echo "LOCAL_SCRIPT_BLOB=$local_script_blob"
          echo "LOCAL_SPEC_BLOB=$local_spec_blob"

      - name: Create exact isolated policy branch from canonical main
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          expected_base = os.environ["EXPECTED_BASE"]
          expected_base_tree = os.environ["EXPECTED_BASE_TREE"]
          expected_candidate_tree = os.environ["LOCAL_CANDIDATE_TREE"]
          expected_script_blob = os.environ["LOCAL_SCRIPT_BLOB"]
          expected_spec_blob = os.environ["LOCAL_SPEC_BLOB"]
          target_branch = os.environ["TARGET_BRANCH"]
          api = f"https://api.github.com/repos/{repo}"

          def request(method, path, payload=None, allow_404=False):
              data = None if payload is None else json.dumps(payload, separators=(",", ":")).encode("utf-8")
              req = urllib.request.Request(
                  api + path,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "wepld-s1-005-policy-bootstrap",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return json.loads(resp.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  if allow_404 and exc.code == 404:
                      return None
                  body = exc.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"ABORT: GitHub API {method} {path} failed: {exc.code} {body}")

          main_ref = request("GET", "/git/ref/heads/main")
          if main_ref.get("object", {}).get("sha") != expected_base:
              raise SystemExit("ABORT: canonical main moved during policy branch creation")

          target_path = "/git/ref/heads/" + urllib.parse.quote(target_branch, safe="/")
          if request("GET", target_path, allow_404=True) is not None:
              raise SystemExit("ABORT: target policy branch raced into existence")

          base_commit = request("GET", f"/git/commits/{expected_base}")
          if base_commit.get("tree", {}).get("sha") != expected_base_tree:
              raise SystemExit("ABORT: canonical base tree identity mismatch")

          target_files = [
              (
                  ".github/scripts/wepld_integrity.py",
                  pathlib.Path(".github/scripts/wepld_integrity.py"),
                  expected_script_blob,
              ),
              (
                  "specs/001-desktop-rust-trusted-core-handshake/s1-005-component-admission-integrity.md",
                  pathlib.Path("specs/001-desktop-rust-trusted-core-handshake/s1-005-component-admission-integrity.md"),
                  expected_spec_blob,
              ),
          ]

          entries = []
          for rel, path, expected_blob in target_files:
              raw = path.read_bytes()
              blob = request("POST", "/git/blobs", {
                  "content": base64.b64encode(raw).decode("ascii"),
                  "encoding": "base64",
              })
              sha = blob.get("sha")
              if sha != expected_blob:
                  raise SystemExit(f"ABORT: GitHub blob identity mismatch for {rel}: {sha}")
              entries.append({"path": rel, "mode": "100644", "type": "blob", "sha": sha})

          tree = request("POST", "/git/trees", {
              "base_tree": expected_base_tree,
              "tree": entries,
          })
          tree_sha = tree.get("sha")
          if tree_sha != expected_candidate_tree:
              raise SystemExit(
                  "ABORT: GitHub-created candidate tree differs from independently validated local tree: "
                  f"github={tree_sha} local={expected_candidate_tree}"
              )

          commit = request("POST", "/git/commits", {
              "message": "ci(s1): admit exact frozen glib component candidate",
              "tree": tree_sha,
              "parents": [expected_base],
          })
          new_head = commit.get("sha")
          if not isinstance(new_head, str) or len(new_head) != 40:
              raise SystemExit("ABORT: malformed policy commit response")

          main_ref_2 = request("GET", "/git/ref/heads/main")
          if main_ref_2.get("object", {}).get("sha") != expected_base:
              raise SystemExit("ABORT: canonical main raced before target ref creation")

          created = request("POST", "/git/refs", {
              "ref": "refs/heads/" + target_branch,
              "sha": new_head,
          })
          if created.get("object", {}).get("sha") != new_head:
              raise SystemExit("ABORT: target ref identity mismatch")

          print("WEPLD_S1_005_POLICY_CANDIDATE")
          print(f"BASE={expected_base}")
          print(f"NEW_HEAD={new_head}")
          print(f"NEW_TREE={tree_sha}")
          print(f"SCRIPT_BLOB={expected_script_blob}")
          print(f"SPEC_BLOB={expected_spec_blob}")
          print(f"BRANCH={target_branch}")
          print("CHANGED_PATHS=2")
          print("SOURCE_ACQUISITION_CHECK=OPEN")
          print("RUNTIME_DEPENDENCY_ADMISSION=NONE")
          print("PRODUCT_IMPLEMENTATION=BLOCKED")
          PY
