      - ".github/scripts/wepld_s1_shell_integrity_v23.py"
      - ".github/workflows/s1-contracts.yml"

permissions: {}

jobs:
  contracts-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Verify clean checkout and pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          expected="$(python - <<'PY'
          import tomllib
          with open("rust-toolchain.toml", "rb") as fh:
              print(tomllib.load(fh)["toolchain"]["channel"])
          PY
          )"
          rustc --version --verbose
          cargo --version --verbose
          actual_rustc="$(rustc --version | awk '{print $2}')"
          actual_cargo="$(cargo --version | awk '{print $2}')"
          test "$actual_rustc" = "$expected"
          test "$actual_cargo" = "$expected"

      - name: Install pinned Tauri Linux build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libssl-dev
          dpkg-query -W \
            -f='${Package}=${Version}\n' \
            libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev

      - name: Format contracts and Core
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --package wepld-contracts -- --check
          cargo fmt --package wepld-core -- --check

      - name: Clippy contracts and Core
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --package wepld-contracts --all-targets -- -D warnings -F unsafe-code
          cargo clippy --locked --package wepld-core --all-targets -- -D warnings -F unsafe-code

      - name: Test Linux protocol and Core suites
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --package wepld-contracts --all-targets
          cargo test --locked --package wepld-core --all-targets

      - name: Compile Linux Desktop host without runtime claim
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --package wepld-core
          host="$(rustc -vV | awk '/^host:/ {print $2}')"
          test -n "$host"
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/debug/wepld-core "apps/desktop/src-tauri/binaries/wepld-core-$host"
          cargo check --locked --package wepld-desktop --all-targets
          {
            echo "LINUX_HOST_TRIPLE=$host"
            echo "LINUX_COMPILE=PASS"
            echo "LINUX_PROTOCOL_CONTRACT_TESTS=PASS"
            echo "LINUX_RUNTIME_CONTAINMENT_CLAIM=NONE"
          } >> "$GITHUB_STEP_SUMMARY"

  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Verify clean checkout and pinned Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ((git status --porcelain).Length -ne 0) { throw "checkout is not clean" }
          $expected = python -c "import tomllib; print(tomllib.load(open('rust-toolchain.toml','rb'))['toolchain']['channel'])"
          rustc --version --verbose
          cargo --version --verbose
          $actualRustc = (rustc --version).Split()[1]
          $actualCargo = (cargo --version).Split()[1]
          if ($actualRustc -ne $expected) { throw "rustc version mismatch: expected=$expected actual=$actualRustc" }
          if ($actualCargo -ne $expected) { throw "cargo version mismatch: expected=$expected actual=$actualCargo" }
          $host = ((rustc -vV | Select-String '^host:').Line -split ':', 2)[1].Trim()
          if ($host -ne "x86_64-pc-windows-msvc") { throw "unexpected Windows host triple: $host" }
          "WINDOWS_HOST_TRIPLE=$host" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Stage owned Core for Desktop tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --locked --package wepld-core
          $deps = Join-Path $PWD "target\debug\deps"
          New-Item -ItemType Directory -Force -Path $deps | Out-Null
          Copy-Item -Force "target\debug\wepld-core.exe" (Join-Path $deps "wepld-core.exe")

      - name: Format and Clippy Windows Desktop host
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo fmt --package wepld-desktop -- --check
          cargo clippy --locked --package wepld-desktop --all-targets -- -D warnings -F unsafe-code

      - name: Run Windows typed round-trip event cancel and failure suite
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo test --locked --package wepld-desktop --all-targets
          @(
            "WINDOWS_TYPED_ROUNDTRIP_EVENT_CANCEL_FAILURE_SUITE=PASS"
            "WINDOWS_CORE_CRASH_RESTART_TEST=PASS"
            "WINDOWS_BINARY_MISSING_MISMATCH_TEST=PASS"
            "WINDOWS_DESKTOP_OWNED_CHILD_CLEANUP_TEST=PASS"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Build release Core and stage exact Tauri externalBin source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --locked --release --package wepld-core
          $sidecars = Join-Path $PWD "apps\desktop\src-tauri\binaries"
          New-Item -ItemType Directory -Force -Path $sidecars | Out-Null
          $sourceSidecar = Join-Path $sidecars "wepld-core-x86_64-pc-windows-msvc.exe"
          Copy-Item -Force "target\release\wepld-core.exe" $sourceSidecar
          $coreHash = (Get-FileHash -Algorithm SHA256 "target\release\wepld-core.exe").Hash.ToLowerInvariant()
          "WEPLD_RELEASE_CORE_SHA256=$coreHash" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WINDOWS_RELEASE_CORE_SHA256=$coreHash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Install exact admitted-source Tauri CLI build tool
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cliRoot = Join-Path $env:RUNNER_TEMP "wepld-tauri-cli"
          cargo install --git https://github.com/tauri-apps/tauri `
            --rev 7cd71369c00978a3783b6ae3e9972358abbe4ae6 `
            --locked `
            --root $cliRoot `
            tauri-cli
          $cliBin = Join-Path $cliRoot "bin"
          $env:PATH = "$cliBin;$env:PATH"
          $version = cargo tauri --version
          if ($version -notmatch '2\.11\.4') { throw "unexpected Tauri CLI version: $version" }
          $cliBin | Out-File -FilePath $env:GITHUB_PATH -Append
          @(
            "TAURI_SOURCE_COMMIT=7cd71369c00978a3783b6ae3e9972358abbe4ae6"
            "TAURI_CLI=2.11.4"
            "TAURI_CLI_ROLE=CI_BUILD_TOOL_ONLY"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Build Windows NSIS package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location "apps\desktop"
          try {
            cargo tauri build --ci --bundles nsis
          } finally {
            Pop-Location
          }
          $installers = @(Get-ChildItem -Path "target\release\bundle\nsis" -Filter "*.exe" -File)
          if ($installers.Count -ne 1) { throw "expected exactly one NSIS installer, observed=$($installers.Count)" }
          "WEPLD_NSIS_INSTALLER=$($installers[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WINDOWS_NSIS_PACKAGE=PASS" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Install package and prove exact sibling identity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = $env:WEPLD_NSIS_INSTALLER
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "NSIS installer missing: $installer" }
          $install = Start-Process -FilePath $installer -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS silent install failed: exit=$($install.ExitCode)" }

          $installDir = Join-Path $env:LOCALAPPDATA "WePLD"
          $corePath = Join-Path $installDir "wepld-core.exe"
          if (-not (Test-Path -LiteralPath $corePath -PathType Leaf)) { throw "packaged Core sibling missing: $corePath" }

          $installedCoreHash = (Get-FileHash -Algorithm SHA256 $corePath).Hash.ToLowerInvariant()
          if ($installedCoreHash -ne $env:WEPLD_RELEASE_CORE_SHA256) {
            throw "packaged Core identity mismatch: expected=$env:WEPLD_RELEASE_CORE_SHA256 actual=$installedCoreHash"
          }

          $apps = @(
            Get-ChildItem -LiteralPath $installDir -Filter "*.exe" -File |
              Where-Object { $_.Name -notin @("wepld-core.exe", "uninstall.exe") }
          )
          if ($apps.Count -ne 1) { throw "expected exactly one installed Desktop executable, observed=$($apps.Count)" }
          $desktopPath = $apps[0].FullName

          "WEPLD_INSTALL_DIR=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WEPLD_INSTALLED_CORE=$corePath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WEPLD_INSTALLED_DESKTOP=$desktopPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          @(
            "WINDOWS_PACKAGED_CORE_SIBLING=PASS"
            "WINDOWS_PACKAGED_CORE_HASH_MATCH=PASS"
            "WINDOWS_INSTALLED_DESKTOP=$desktopPath"
            "WINDOWS_INSTALLED_CORE=$corePath"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Launch installed Desktop and observe owned packaged Core
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $desktop = Start-Process -FilePath $env:WEPLD_INSTALLED_DESKTOP -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(20)
            $child = $null
            do {
              $child = Get-CimInstance Win32_Process -Filter "ParentProcessId = $($desktop.Id)" |
                Where-Object {
                  $_.Name -eq "wepld-core.exe" -and
                  $_.ExecutablePath -eq $env:WEPLD_INSTALLED_CORE
                } |
                Select-Object -First 1
              if ($null -eq $child) { Start-Sleep -Milliseconds 250 }
            } while ($null -eq $child -and (Get-Date) -lt $deadline)

            if ($null -eq $child) { throw "installed Desktop did not launch exact packaged Core sibling" }
            "WINDOWS_PACKAGED_CORE_PARENT_PID=$($desktop.Id)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "WINDOWS_PACKAGED_CORE_PID=$($child.ProcessId)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "WINDOWS_PACKAGED_RUNTIME_LAUNCH=PASS" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "WINDOWS_RUNTIME_CONTAINMENT_CLAIM=NONE" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

            Start-Sleep -Seconds 2
            $gracefulRequested = $desktop.CloseMainWindow()
            if ($gracefulRequested) {
              if (-not $desktop.WaitForExit(10000)) {
                throw "Desktop accepted graceful-close request but did not exit within bounded window"
              }
              $childStillAlive = Get-Process -Id $child.ProcessId -ErrorAction SilentlyContinue
              if ($null -ne $childStillAlive) {
                throw "packaged Core survived verified graceful Desktop exit"
              }
              "WINDOWS_DESKTOP_EXIT_CHILD_BEHAVIOR=GRACEFUL_EXIT_CLEANUP_PASS" |
                Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            } else {
              "WINDOWS_DESKTOP_EXIT_CHILD_BEHAVIOR=GRACEFUL_CLOSE_NOT_AVAILABLE_ON_RUNNER" |
                Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            }
          } finally {
            if (-not $desktop.HasExited) { Stop-Process -Id $desktop.Id -Force -ErrorAction SilentlyContinue }
            Get-Process -Name "wepld-core" -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Exercise packaged missing and identity-mismatch cases
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $corePath = $env:WEPLD_INSTALLED_CORE
          $backupPath = "$corePath.wepld-qualified"
          Move-Item -Force $corePath $backupPath
          try {
            $missingDesktop = Start-Process -FilePath $env:WEPLD_INSTALLED_DESKTOP -PassThru
            try {
              Start-Sleep -Seconds 3
              if ($missingDesktop.HasExited) { throw "Desktop exited instead of remaining fail-closed with missing Core" }
              $child = Get-CimInstance Win32_Process -Filter "ParentProcessId = $($missingDesktop.Id)" |
                Where-Object { $_.Name -eq "wepld-core.exe" }
              if ($null -ne $child) { throw "missing packaged Core case unexpectedly produced a Core child" }
            } finally {
              if (-not $missingDesktop.HasExited) { Stop-Process -Id $missingDesktop.Id -Force -ErrorAction SilentlyContinue }
            }
            "WINDOWS_PACKAGED_PATH_MISSING_CASE=FAIL_CLOSED_PASS" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

            Copy-Item -Force "$env:WINDIR\System32\where.exe" $corePath
            $mismatchHash = (Get-FileHash -Algorithm SHA256 $corePath).Hash.ToLowerInvariant()
            if ($mismatchHash -eq $env:WEPLD_RELEASE_CORE_SHA256) { throw "mismatch fixture unexpectedly matches qualified Core hash" }

            $mismatchDesktop = Start-Process -FilePath $env:WEPLD_INSTALLED_DESKTOP -PassThru
            try {
              Start-Sleep -Seconds 3
              if ($mismatchDesktop.HasExited) { throw "Desktop exited instead of remaining fail-closed with mismatched Core" }
              $liveMismatch = Get-CimInstance Win32_Process -Filter "ParentProcessId = $($mismatchDesktop.Id)" |
                Where-Object { $_.Name -eq "wepld-core.exe" }
              if ($null -ne $liveMismatch) { throw "mismatched packaged Core remained live as if qualified" }
            } finally {
              if (-not $mismatchDesktop.HasExited) { Stop-Process -Id $mismatchDesktop.Id -Force -ErrorAction SilentlyContinue }
              Get-Process -Name "wepld-core" -ErrorAction SilentlyContinue |
                Stop-Process -Force -ErrorAction SilentlyContinue
            }
            "WINDOWS_PACKAGED_IDENTITY_MISMATCH_CASE=FAIL_CLOSED_PASS" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } finally {
            Remove-Item -Force $corePath -ErrorAction SilentlyContinue
            Move-Item -Force $backupPath $corePath
          }

      - name: Cleanup installed package
        if: always()
        shell: pwsh
        run: |
          Get-Process -Name "wepld-desktop","wepld-core" -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          if ($env:WEPLD_INSTALL_DIR -and (Test-Path -LiteralPath $env:WEPLD_INSTALL_DIR)) {
            $uninstaller = Join-Path $env:WEPLD_INSTALL_DIR "uninstall.exe"
            if (Test-Path -LiteralPath $uninstaller -PathType Leaf) {
              Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait | Out-Null
            }
          }

  secondary-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Verify clean checkout and pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          expected="$(python - <<'PY'
          import tomllib
          with open("rust-toolchain.toml", "rb") as fh:
              print(tomllib.load(fh)["toolchain"]["channel"])
          PY
          )"
          rustc --version --verbose
          cargo --version --verbose
          actual_rustc="$(rustc --version | awk '{print $2}')"
          actual_cargo="$(cargo --version | awk '{print $2}')"
          test "$actual_rustc" = "$expected"
          test "$actual_cargo" = "$expected"

      - name: Test macOS protocol and Core suites
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --package wepld-contracts --all-targets
          cargo test --locked --package wepld-core --all-targets

      - name: Compile macOS Desktop host without runtime claim
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --package wepld-core
          host="$(rustc -vV | awk '/^host:/ {print $2}')"
          test -n "$host"
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/debug/wepld-core "apps/desktop/src-tauri/binaries/wepld-core-$host"
          cargo check --locked --package wepld-desktop --all-targets
          {
            echo "MACOS_HOST_TRIPLE=$host"
            echo "MACOS_COMPILE=PASS"
            echo "MACOS_PROTOCOL_CONTRACT_TESTS=PASS"
            echo "MACOS_RUNTIME_CONTAINMENT_CLAIM=NONE"
          } >> "$GITHUB_STEP_SUMMARY"
