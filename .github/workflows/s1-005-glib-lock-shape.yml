name: S1-005 glib vendored lock-shape probe

on:
  push:
    branches:
      - acq/s1-005-glib-lock-shape

permissions: {}

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact probe head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify frozen vendor identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:third_party/glib-0.18.5-wepld1)" = "c064fcd71830730d12645b54228326cefefd6188"
          test "$(git hash-object third_party/glib-0.18.5-wepld1/src/variant_iter.rs)" = "e0997f651b103f7b198e528ee41137ad374e19b8"

      - name: Resolve exact patched Cargo graph without building
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal

          cat >> Cargo.toml <<'EOF'

          [patch.crates-io]
          glib = { path = "third_party/glib-0.18.5-wepld1" }
          EOF

          expected='[workspace]
          resolver = "2"
          members = [
            "apps/desktop/src-tauri",
            "crates/contracts",
            "crates/core",
          ]

          [patch.crates-io]
          glib = { path = "third_party/glib-0.18.5-wepld1" }'
          test "$(cat Cargo.toml)" = "$expected"

          cargo +1.97.1 generate-lockfile
          cargo +1.97.1 tree --locked -e features > "$RUNNER_TEMP/cargo-tree-features.txt"
          cargo +1.97.1 tree --locked -i glib > "$RUNNER_TEMP/glib-reverse-tree.txt"

          python3 - <<'PY'
          import hashlib
          import pathlib
          import tomllib

          lock_path = pathlib.Path("Cargo.lock")
          lock = tomllib.loads(lock_path.read_text(encoding="utf-8"))
          matches = [p for p in lock["package"] if p.get("name") == "glib" and p.get("version") == "0.18.5"]
          if len(matches) != 1:
              raise SystemExit(f"ABORT: expected one glib 0.18.5 lock package, got {len(matches)}")
          pkg = matches[0]
          if "source" in pkg or "checksum" in pkg:
              raise SystemExit(f"ABORT: vendored glib unexpectedly retains registry source/checksum: {pkg}")
          print("GLIB_LOCK_ENTRY=" + repr(pkg))
          print("LOCK_SHA256=" + hashlib.sha256(lock_path.read_bytes()).hexdigest())
          print("LOCK_PACKAGE_COUNT=" + str(len(lock["package"])))
          PY

          cp Cargo.toml "$RUNNER_TEMP/Cargo.toml.component-candidate"
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.component-candidate"
          sha256sum "$RUNNER_TEMP/Cargo.toml.component-candidate" "$RUNNER_TEMP/Cargo.lock.component-candidate" "$RUNNER_TEMP/cargo-tree-features.txt" "$RUNNER_TEMP/glib-reverse-tree.txt"

      - name: Upload resolution evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s1-005-glib-lock-shape
          path: |
            ${{ runner.temp }}/Cargo.toml.component-candidate
            ${{ runner.temp }}/Cargo.lock.component-candidate
            ${{ runner.temp }}/cargo-tree-features.txt
            ${{ runner.temp }}/glib-reverse-tree.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
