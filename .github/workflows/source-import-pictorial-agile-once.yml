name: one-shot Pictorial Agile source import

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/source-import-pictorial-agile-once.yml

permissions:
  contents: write

concurrency:
  group: pictorial-agile-source-import-2026-08-23
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_MAIN: 2ab2fae14bc3b3b1f1e9bc2059972456955aeff7
      BRANCH_NAME: import/pictorial-agile-full-source-snapshot-2026-08-23
      BOOTSTRAP_WORKFLOW: .github/workflows/source-import-pictorial-agile-once.yml
    steps:
      - name: Clone candidate and prove exact base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --no-tags --single-branch --branch "${BRANCH_NAME}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          test "$(git merge-base "${EXPECTED_MAIN}" HEAD)" = "${EXPECTED_MAIN}"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "${EXPECTED_MAIN}"

      - name: Repair known rebrand edge cases and import pinned snapshots
        run: |
          set -euo pipefail
          cd repo
          python3 - <<'PY'
          from pathlib import Path
          path = Path("docs/acquisition/tools/import_pictorial_agile_source_snapshot.py")
          text = path.read_text(encoding="utf-8")

          old_notice = "integration from pinned pbakaus/impeccable source."
          new_notice = "integration from the pinned upstream source."
          if text.count(old_notice) != 1:
              raise SystemExit("FAIL_CLOSED_EXPECTED_NOTICE_LITERAL_NOT_UNIQUE")
          text = text.replace(old_notice, new_notice)

          old_path_tail = '''    for a, b in (\n        (".specify", ".agile"),\n'''
          if text.count(old_path_tail) != 1:
              raise SystemExit("FAIL_CLOSED_AGILE_PATH_TRANSFORM_ANCHOR")

          path_return_anchor = '''        ("SPECKIT", "AGILE"), ("Speckit", "Agile"), ("speckit", "agile"),\n    ):\n        path = path.replace(a, b)\n    return path\n\n\ndef tmap'''
          path_return_replacement = '''        ("SPECKIT", "AGILE"), ("Speckit", "Agile"), ("speckit", "agile"),\n    ):\n        path = path.replace(a, b)\n    path = re.sub(r"(?i)spec(?:[-_]|\\s)+kit", "agile", path)\n    path = re.sub(r"(?i)speckit", "agile", path)\n    path = re.sub(r"(?i)specify(?:[-_]|\\s)+cli", "wepld-agile", path)\n    return path\n\n\ndef tmap'''
          if text.count(path_return_anchor) != 1:
              raise SystemExit("FAIL_CLOSED_AGILE_PATH_RETURN_ANCHOR")
          text = text.replace(path_return_anchor, path_return_replacement)

          text_return_anchor = '''            "agile", text,\n        )\n    return text\n\n\ndef apache_notice'''
          text_return_replacement = '''            "agile", text,\n        )\n        text = re.sub(r"(?i)spec(?:[-_]|\\s)+kit", "Agile", text)\n        text = re.sub(r"(?i)speckit", "Agile", text)\n        text = re.sub(r"(?i)specify(?:[-_]|\\s)+cli", "wepld-agile", text)\n    return text\n\n\ndef apache_notice'''
          if text.count(text_return_anchor) != 1:
              raise SystemExit("FAIL_CLOSED_AGILE_TEXT_RETURN_ANCHOR")
          text = text.replace(text_return_anchor, text_return_replacement)

          path.write_text(text, encoding="utf-8")
          PY
          python3 docs/acquisition/tools/import_pictorial_agile_source_snapshot.py

      - name: Commit source-only candidate and remove one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd repo
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "${EXPECTED_MAIN}"
          rm "${BOOTSTRAP_WORKFLOW}"

          git add -A
          test -n "$(git diff --cached --name-only)"

          while IFS= read -r path; do
            case "$path" in
              vendor/pictorial/*|vendor/agile/*|legal/third-party/PICTORIAL_*|legal/third-party/AGILE_*|docs/acquisition/source-maps/*|docs/acquisition/WEPLD_PICTORIAL_AGILE_SOURCE_IMPORT_REPORT_2026-08-23.md|docs/acquisition/WEPLD_PICTORIAL_AGILE_SOURCE_IMPORT_SURFACE_INVENTORY_2026-08-23.json|docs/acquisition/tools/import_pictorial_agile_source_snapshot.py|.github/workflows/source-import-pictorial-agile-once.yml)
                ;;
              *)
                echo "FAIL_CLOSED_UNEXPECTED_CHANGED_PATH=${path}"
                exit 1
                ;;
            esac
          done < <(git diff --cached --name-only)

          test ! -e "${BOOTSTRAP_WORKFLOW}"
          test -d vendor/pictorial
          test -d vendor/agile
          test -f legal/third-party/PICTORIAL_LICENSE.txt
          test -f legal/third-party/PICTORIAL_NOTICE.md
          test -f legal/third-party/AGILE_LICENSE.txt
          test -f docs/acquisition/source-maps/pictorial-source-map-2026-08-23.jsonl
          test -f docs/acquisition/source-maps/agile-source-map-2026-08-23.jsonl

          git config user.name "wepld-source-import"
          git config user.email "wepld-source-import@users.noreply.github.com"
          git commit -m "feat(vendor): import pinned Pictorial and Agile source snapshots"
          git push origin HEAD:"${BRANCH_NAME}"

          echo "SOURCE_IMPORT_HEAD=$(git rev-parse HEAD)"
          echo "SOURCE_IMPORT_TREE=$(git rev-parse HEAD^{tree})"
