name: diag-pr136-pictorial-lock-repair-resolver

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exact admitted PR136 source without credentials
        shell: bash
        env:
          SOURCE_HEAD: 28f0023b8ffb90c585213762dae5f4c1d57322ef
        run: |
          set -euo pipefail
          mkdir subject
          cd subject
          git init -q
          git remote add origin https://github.com/TheHalfMoon/wepld.git
          git -c credential.helper= fetch --depth=1 --no-tags origin "$SOURCE_HEAD"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git hash-object vendor/pictorial/package.json)" = "ba646522c498af6e9bfa02fd1dba2f098d9f6d42"
          test "$(git hash-object vendor/pictorial/bun.lock)" = "f7114d1b93f26eb9d7796fc15ae3d639d2209c9d"

      - name: Inspect public npm metadata only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import urllib.parse
          import urllib.request
          from pathlib import Path

          TARGETS = {
              "@hono/node-server": ("1.19.14", "1.19.15"),
              "body-parser": ("2.2.2", "2.3.0"),
              "brace-expansion": ("5.0.6", "5.0.9"),
              "fast-uri": ("3.1.0", "3.1.5"),
              "hono": ("4.12.14", "4.12.34"),
              "ip-address": ("10.1.0", "10.3.1"),
              "qs": ("6.15.1", "6.15.2"),
              "express-rate-limit": ("8.3.2", "8.5.1"),
          }

          def strip_trailing_commas(text: str) -> str:
              out: list[str] = []
              in_string = False
              escaped = False
              i = 0
              while i < len(text):
                  ch = text[i]
                  if in_string:
                      out.append(ch)
                      if escaped:
                          escaped = False
                      elif ch == "\\":
                          escaped = True
                      elif ch == '"':
                          in_string = False
                      i += 1
                      continue
                  if ch == '"':
                      in_string = True
                      out.append(ch)
                      i += 1
                      continue
                  if ch == ',':
                      j = i + 1
                      while j < len(text) and text[j].isspace():
                          j += 1
                      if j < len(text) and text[j] in '}]':
                          i += 1
                          continue
                  out.append(ch)
                  i += 1
              return ''.join(out)

          def split_identity(identity: str) -> tuple[str, str]:
              if identity.startswith("@"):
                  pos = identity.rfind("@")
                  return identity[:pos], identity[pos + 1:]
              return tuple(identity.rsplit("@", 1))  # type: ignore[return-value]

          def registry_version(name: str, version: str) -> dict:
              encoded = urllib.parse.quote(name, safe="")
              url = f"https://registry.npmjs.org/{encoded}/{urllib.parse.quote(version, safe='.-_+')}"
              req = urllib.request.Request(url, headers={"Accept": "application/json", "User-Agent": "wepld-metadata-only-repair/1"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read())

          def bun_projection(meta: dict) -> dict:
              out: dict = {}
              for key in ("dependencies", "optionalDependencies", "peerDependencies"):
                  value = meta.get(key)
                  if isinstance(value, dict) and value:
                      out[key] = dict(value)
              peer_meta = meta.get("peerDependenciesMeta")
              if isinstance(peer_meta, dict):
                  optional = sorted(k for k, v in peer_meta.items() if isinstance(v, dict) and v.get("optional") is True)
                  if optional:
                      out["optionalPeers"] = optional
              for key in ("bin", "os", "cpu"):
                  value = meta.get(key)
                  if value is not None:
                      out[key] = value
              return out

          lock_bytes = Path("subject/vendor/pictorial/bun.lock").read_bytes()
          lock = json.loads(strip_trailing_commas(lock_bytes.decode("utf-8")))
          packages = lock["packages"]

          parsed: dict[str, dict] = {}
          for lock_key, row in packages.items():
              name, version = split_identity(row[0])
              info = next((x for x in row[2:] if isinstance(x, dict)), {})
              sri = next((x for x in reversed(row[2:]) if isinstance(x, str) and x.startswith("sha512-")), None)
              parsed[lock_key] = {"name": name, "version": version, "info": info, "sri": sri}

          target_keys: dict[str, str] = {}
          for target, (current, _) in TARGETS.items():
              matches = [k for k, v in parsed.items() if v["name"] == target and v["version"] == current]
              if len(matches) != 1:
                  raise AssertionError(f"expected exactly one current lock row for {target}@{current}; got {matches}")
              target_keys[target] = matches[0]

          incoming: dict[str, list[dict]] = {name: [] for name in TARGETS}
          for parent_key, parent in parsed.items():
              for field in ("dependencies", "optionalDependencies", "peerDependencies"):
                  deps = parent["info"].get(field, {})
                  if not isinstance(deps, dict):
                      continue
                  for name, spec in deps.items():
                      if name in TARGETS:
                          incoming[name].append({
                              "parent_lock_key": parent_key,
                              "parent_name": parent["name"],
                              "parent_version": parent["version"],
                              "field": field,
                              "constraint": spec,
                          })

          registry: dict[str, dict] = {}
          comparisons: dict[str, dict] = {}
          candidate_identities: list[tuple[str, str]] = []
          for name, (current, candidate) in TARGETS.items():
              current_meta = registry_version(name, current)
              candidate_meta = registry_version(name, candidate)
              current_projection = bun_projection(current_meta)
              lock_info = parsed[target_keys[name]]["info"]
              comparisons[name] = {
                  "lock_key": target_keys[name],
                  "current_version": current,
                  "candidate_version": candidate,
                  "current_lock_info": lock_info,
                  "current_registry_projection": current_projection,
                  "projection_exact_match": current_projection == lock_info,
                  "candidate_registry_projection": bun_projection(candidate_meta),
                  "current_integrity": current_meta.get("dist", {}).get("integrity"),
                  "lock_integrity": parsed[target_keys[name]]["sri"],
                  "current_integrity_matches_lock": current_meta.get("dist", {}).get("integrity") == parsed[target_keys[name]]["sri"],
                  "candidate_integrity": candidate_meta.get("dist", {}).get("integrity"),
              }
              registry[f"{name}@{current}"] = current_meta
              registry[f"{name}@{candidate}"] = candidate_meta
              candidate_identities.append((name, candidate))

          osv_request = {"queries": [
              {"package": {"ecosystem": "npm", "name": name}, "version": version}
              for name, version in sorted(candidate_identities)
          ]}
          request_bytes = json.dumps(osv_request, sort_keys=True, separators=(",", ":")).encode("utf-8")
          req = urllib.request.Request(
              "https://api.osv.dev/v1/querybatch",
              data=request_bytes,
              headers={"Content-Type": "application/json", "User-Agent": "wepld-metadata-only-repair/1"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              osv = json.loads(response.read())
          results = osv.get("results")
          if not isinstance(results, list) or len(results) != len(candidate_identities):
              raise AssertionError("OSV result cardinality mismatch")
          candidate_findings = []
          for identity, result in zip(sorted(candidate_identities), results, strict=True):
              vulns = result.get("vulns", []) if isinstance(result, dict) else []
              if vulns:
                  candidate_findings.append({
                      "name": identity[0],
                      "version": identity[1],
                      "ids": sorted({str(v["id"]) for v in vulns if isinstance(v, dict) and "id" in v}),
                  })

          out = Path("metadata-output")
          out.mkdir()
          (out / "incoming-constraints.json").write_text(json.dumps(incoming, sort_keys=True, indent=2) + "\n")
          (out / "projection-comparisons.json").write_text(json.dumps(comparisons, sort_keys=True, indent=2) + "\n")
          (out / "registry-version-metadata.json").write_text(json.dumps(registry, sort_keys=True, separators=(",", ":")) + "\n")
          (out / "candidate-osv-response.json").write_text(json.dumps(osv, sort_keys=True, separators=(",", ":")) + "\n")
          summary = {
              "subject_head": "28f0023b8ffb90c585213762dae5f4c1d57322ef",
              "source_lock_sha256": hashlib.sha256(lock_bytes).hexdigest(),
              "targets": TARGETS,
              "all_current_registry_projections_match_lock": all(v["projection_exact_match"] for v in comparisons.values()),
              "all_current_registry_integrities_match_lock": all(v["current_integrity_matches_lock"] for v in comparisons.values()),
              "candidate_osv_findings": candidate_findings,
              "candidate_osv_finding_count": len(candidate_findings),
              "network_scope": "registry.npmjs.org metadata + api.osv.dev advisory metadata only",
              "package_download": "NONE",
              "package_installation": "NONE",
              "package_execution": "NONE",
              "donor_code_execution": "NONE",
          }
          (out / "metadata-inspection-summary.json").write_text(json.dumps(summary, sort_keys=True, indent=2) + "\n")
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Upload metadata inspection evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr136-pictorial-lock-metadata-inspection
          path: metadata-output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
