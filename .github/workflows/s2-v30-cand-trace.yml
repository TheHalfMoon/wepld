name: s2-v30-cand-trace

on:
  push:
    branches:
      - diag/s2-v30-policy-qualification-2026-08-29

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      V30_HEAD: e83d5021f7593d02d23e46a3eccb9f0b6bb21be2
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout diagnostic branch with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          lfs: false
          submodules: false

      - name: Trace effective post-install shell verify-view identity
        shell: bash
        run: |
          set -euo pipefail
          wt="${RUNNER_TEMP}/wepld-v30-trace"
          git worktree add --detach "$wt" "$V30_HEAD"
          trap 'git worktree remove --force "$wt" >/dev/null 2>&1 || true' EXIT
          cd "$wt"
          python - <<'PY'
          import inspect
          import sys
          from pathlib import Path

          scripts = Path('.github/scripts').resolve()
          sys.path.insert(0, str(scripts))
          import wepld_s2_identity_store_governance_v30_integrity as v30

          v25 = v30.p.s.r.q.p
          cand = v25.CAND
          cand_module = sys.modules[cand.__module__]
          v3 = cand_module.v3
          shell = v3._topology()[0]
          before = shell.verify_view
          v30.install()
          after = shell.verify_view

          print(f'CAND_MODULE={cand.__module__}')
          print(f'SHELL_MODULE={shell.__name__}')
          print(f'BEFORE_MODULE={before.__module__}')
          print(f'AFTER_MODULE={after.__module__}')
          print(f'AFTER_NAME={after.__name__}')
          print(f'AFTER_FILE={inspect.getsourcefile(after)}')
          print('AFTER_SOURCE_BEGIN')
          print(inspect.getsource(after))
          print('AFTER_SOURCE_END')
          print(f'AFTER_GLOBAL_BASE_ID={id(after.__globals__.get("base"))}')
          print(f'V30_BASE_ID={id(v30.base)}')
          for key in sorted(after.__globals__):
              if 'verify' in key.lower() and callable(after.__globals__[key]):
                  fn = after.__globals__[key]
                  print(f'GLOBAL_FN={key}:{getattr(fn, "__module__", None)}.{getattr(fn, "__name__", None)}')
          print('DIAGNOSTIC_AUTHORITY=NONE')
          PY
