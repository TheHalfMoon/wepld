name: diag-v8-post-merge-activation-locator

on:
  pull_request:

permissions: {}

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Locate original v8 post-merge Foundation push run
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: '08a06e9f2664735eb55db5b2f49f95d3d3f91c3f'
          TARGET_AFTER: '2026-08-24T06:21:00Z'
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}/actions/workflows/foundation-integrity.yml/runs?event=push&per_page=100"
          body="$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api")"
          matches="$(jq -c --arg sha "$TARGET_SHA" --arg after "$TARGET_AFTER" \
            '[.workflow_runs[] | select(.event == "push") | select(.head_sha == $sha) | select(.created_at >= $after)] | sort_by(.created_at)' \
            <<<"$body")"
          count="$(jq 'length' <<<"$matches")"
          echo "target_sha=${TARGET_SHA}"
          echo "target_after=${TARGET_AFTER}"
          echo "matching_runs=${count}"
          jq -r '.[] | "run_id=\(.id) run_number=\(.run_number) status=\(.status) conclusion=\(.conclusion) event=\(.event) head_sha=\(.head_sha) created_at=\(.created_at) updated_at=\(.updated_at)"' <<<"$matches"
          if [ "$count" -lt 1 ]; then
            echo 'no matching post-merge Foundation push run found' >&2
            exit 1
          fi
          jq -r 'last | "selected_run_id=\(.id) selected_run_number=\(.run_number) selected_status=\(.status) selected_conclusion=\(.conclusion) selected_head_sha=\(.head_sha)"' <<<"$matches"
