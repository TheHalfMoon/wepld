name: pr228-ready-transition

on:
  push:
    branches:
      - ops/pr228-ready-transition-2026-08-29

permissions:
  contents: read
  pull-requests: write

jobs:
  ready:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Guard and mark exact PR ready
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: TheHalfMoon/wepld
          PR_NUMBER: "228"
          PR_NODE_ID: PR_kwDOT4l1-88AAAABBcCaMQ
          EXPECTED_MAIN: 8631408a7e6802761a093bd37ef20f126510130a
          EXPECTED_BASE: 8631408a7e6802761a093bd37ef20f126510130a
          EXPECTED_HEAD: f00104d51bb521e03c7032cf97dfbd2ae4a2d0f8
        run: |
          set -euo pipefail

          auth=(-H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json")

          main_json="$(curl --fail --silent --show-error "${auth[@]}" "https://api.github.com/repos/${REPOSITORY}/git/ref/heads/main")"
          pr_json="$(curl --fail --silent --show-error "${auth[@]}" "https://api.github.com/repos/${REPOSITORY}/pulls/${PR_NUMBER}")"

          MAIN_JSON="$main_json" PR_JSON="$pr_json" python3 - <<'PY'
          import json
          import os

          main = json.loads(os.environ["MAIN_JSON"])
          pr = json.loads(os.environ["PR_JSON"])

          expected_main = os.environ["EXPECTED_MAIN"]
          expected_base = os.environ["EXPECTED_BASE"]
          expected_head = os.environ["EXPECTED_HEAD"]
          expected_node = os.environ["PR_NODE_ID"]

          assert main["object"]["sha"] == expected_main, (main["object"]["sha"], expected_main)
          assert pr["state"] == "open", pr["state"]
          assert pr["draft"] is True, pr["draft"]
          assert pr["node_id"] == expected_node, (pr["node_id"], expected_node)
          assert pr["base"]["sha"] == expected_base, (pr["base"]["sha"], expected_base)
          assert pr["head"]["sha"] == expected_head, (pr["head"]["sha"], expected_head)
          print("ready_transition_precondition=PASS")
          PY

          graphql_payload="$(python3 - <<'PY'
          import json
          import os

          print(json.dumps({
              "query": "mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{id isDraft headRefOid baseRefOid}}}",
              "variables": {"id": os.environ["PR_NODE_ID"]},
          }))
          PY
          )"

          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            -X POST \
            --data "$graphql_payload" \
            https://api.github.com/graphql)"

          RESPONSE="$response" python3 - <<'PY'
          import json
          import os

          response = json.loads(os.environ["RESPONSE"])
          if response.get("errors"):
              raise SystemExit(f"GraphQL errors: {response['errors']}")
          pr = response["data"]["markPullRequestReadyForReview"]["pullRequest"]
          assert pr["id"] == os.environ["PR_NODE_ID"], pr["id"]
          assert pr["isDraft"] is False, pr["isDraft"]
          assert pr["headRefOid"] == os.environ["EXPECTED_HEAD"], (pr["headRefOid"], os.environ["EXPECTED_HEAD"])
          assert pr["baseRefOid"] == os.environ["EXPECTED_BASE"], (pr["baseRefOid"], os.environ["EXPECTED_BASE"])
          print("ready_transition_graphql=PASS")
          PY

          final_pr_json="$(curl --fail --silent --show-error "${auth[@]}" "https://api.github.com/repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          FINAL_PR_JSON="$final_pr_json" python3 - <<'PY'
          import json
          import os

          pr = json.loads(os.environ["FINAL_PR_JSON"])
          assert pr["state"] == "open", pr["state"]
          assert pr["draft"] is False, pr["draft"]
          assert pr["base"]["sha"] == os.environ["EXPECTED_BASE"], pr["base"]["sha"]
          assert pr["head"]["sha"] == os.environ["EXPECTED_HEAD"], pr["head"]["sha"]
          print("ready_transition_postcondition=PASS")
          PY