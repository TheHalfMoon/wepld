name: foundation-integrity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision with canonical history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
          lfs: false
          submodules: false

      - name: Run candidate policy self-tests (non-authoritative on pull requests)
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/wepld_s1_admission_steady_state_routing_v2_integrity.py selftest

      - name: Verify pull-request candidate against exact trusted base (non-authoritative)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python .github/scripts/wepld_s1_admission_steady_state_routing_v2_integrity.py verify-local \
            --root . \
            --remote-baseline \
            --pr-base-sha "$PR_BASE_SHA"

      - name: Record pull-request candidate-policy boundary
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          echo 'candidate_policy_authority=NONE'
          echo 'authoritative_candidate_admission=pull_request_target'

      - name: Verify canonical activation against predecessor and pushed head
        if: github.event_name == 'push'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WEPLD_POLICY_BASE_SHA: ${{ github.event.before }}
          WEPLD_BASELINE_CHECK_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${WEPLD_POLICY_BASE_SHA:-}" ] || [ -z "${WEPLD_BASELINE_CHECK_SHA:-}" ]; then
            echo 'canonical activation identities could not be established' >&2
            exit 1
          fi
          python .github/scripts/wepld_s1_admission_steady_state_routing_v2_integrity.py verify-local \
            --root . \
            --remote-baseline \
            --pr-base-sha "$WEPLD_BASELINE_CHECK_SHA"
