name: PR9 repaired component-policy pre-merge end-to-end canary

on:
  push:
    branches:
      - bootstrap/pr9-component-policy-e2e-canary-v2

permissions:
  contents: write

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANONICAL_BASE: f1919396eacb90d8d947b06f023ae9da233a4580
      POLICY_HEAD: 0629e5b6e9aca308a25a873dccebf18531d53d2c
      POLICY_TREE: 6a62afd382360196567837ddd5768e82f0b9b4e4
      FROZEN_PREP_HEAD: f13b214c6fe42fec80b9ce05f44f7ea2a96da3e5
      FROZEN_VENDOR_TREE: c064fcd71830730d12645b54228326cefefd6188
      EXPECTED_LOCK_SHA256: 3816d2befde7412f5a64b2015e437683dcd9876259fd756e7082b0d9c331cbc9
      EXPECTED_CARGO_SHA256: 6688d45616ad298c0e89d0a792d0fe9e2b1e86165089956ce1c273c58b6d73a9
      VENDOR_PREFIX: third_party/glib-0.18.5-wepld1
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact frozen prep candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f13b214c6fe42fec80b9ce05f44f7ea2a96da3e5
          path: candidate
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact repaired PR9 policy head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0629e5b6e9aca308a25a873dccebf18531d53d2c
          path: policy
          persist-credentials: false
          fetch-depth: 1

      - name: Verify immutable live identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$FROZEN_PREP_HEAD"
          test "$(git -C candidate rev-parse "HEAD:$VENDOR_PREFIX")" = "$FROZEN_VENDOR_TREE"
          test "$(git -C policy rev-parse HEAD)" = "$POLICY_HEAD"
          test "$(git -C policy rev-parse 'HEAD^{tree}')" = "$POLICY_TREE"

          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          expected = {
              "heads/main": os.environ["CANONICAL_BASE"],
              "heads/ci/s1-005-component-admission-integrity": os.environ["POLICY_HEAD"],
              "heads/prep/s1-005-glib-0.18.5-backport": os.environ["FROZEN_PREP_HEAD"],
          }
          for ref, sha in expected.items():
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/git/ref/{urllib.parse.quote(ref, safe='/')}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "wepld-pr9-component-e2e-canary-v2",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  obj = json.load(response)
              actual = obj.get("object", {}).get("sha")
              if actual != sha:
                  raise SystemExit(f"ABORT: live ref moved: {ref}: {actual} != {sha}")
          PY

      - name: Regenerate exact component lock and prove glib reachability without building
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal

          cat > candidate/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = [
            "apps/desktop/src-tauri",
            "crates/contracts",
            "crates/core",
          ]

          [patch.crates-io]
          glib = { path = "third_party/glib-0.18.5-wepld1" }
          EOF

          cargo_sha="$(sha256sum candidate/Cargo.toml | awk '{print $1}')"
          test "$cargo_sha" = "$EXPECTED_CARGO_SHA256"

          cargo +1.97.1 generate-lockfile --manifest-path candidate/Cargo.toml
          lock_sha="$(sha256sum candidate/Cargo.lock | awk '{print $1}')"
          test "$lock_sha" = "$EXPECTED_LOCK_SHA256"

          cargo +1.97.1 tree \
            --manifest-path candidate/Cargo.toml \
            --locked \
            -i glib > "$RUNNER_TEMP/glib-reverse-tree.txt"
          grep -F 'glib v0.18.5 (' "$RUNNER_TEMP/glib-reverse-tree.txt" >/dev/null
          grep -F 'third_party/glib-0.18.5-wepld1' "$RUNNER_TEMP/glib-reverse-tree.txt" >/dev/null
          grep -F 'wepld-desktop v0.0.0' "$RUNNER_TEMP/glib-reverse-tree.txt" >/dev/null

          python3 - <<'PY'
          import pathlib
          import tomllib

          lock = tomllib.loads(pathlib.Path("candidate/Cargo.lock").read_text(encoding="utf-8"))
          packages = lock.get("package", [])
          matches = [
              p for p in packages
              if p.get("name") == "glib" and p.get("version") == "0.18.5"
          ]
          if len(matches) != 1:
              raise SystemExit(f"ABORT: expected exactly one glib 0.18.5, got {len(matches)}")
          if "source" in matches[0] or "checksum" in matches[0]:
              raise SystemExit(f"ABORT: glib path package retains source/checksum: {matches[0]}")
          if len(packages) != 417:
              raise SystemExit("ABORT: resolved package count drifted from 417")
          PY

          echo "CARGO_TOML_SHA256=$cargo_sha"
          echo "CARGO_LOCK_SHA256=$lock_sha"
          echo "GLIB_REACHABLE_FROM_WORKSPACE_GRAPH=YES"

      - name: Create unreferenced synthetic post-policy component commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          api = f"https://api.github.com/repos/{repo}"

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload, separators=(",", ":")).encode("utf-8")
              req = urllib.request.Request(
                  api + path,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "wepld-pr9-component-e2e-canary-v2",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"ABORT: GitHub API {method} {path}: {exc.code} {body}")

          policy_commit = request("GET", f"/git/commits/{os.environ['POLICY_HEAD']}")
          if policy_commit.get("tree", {}).get("sha") != os.environ["POLICY_TREE"]:
              raise SystemExit("ABORT: policy commit tree identity mismatch")

          entries = []
          for rel in ["Cargo.toml", "Cargo.lock"]:
              raw = pathlib.Path("candidate", rel).read_bytes()
              blob = request("POST", "/git/blobs", {
                  "content": base64.b64encode(raw).decode("ascii"),
                  "encoding": "base64",
              })
              sha = blob.get("sha")
              if not isinstance(sha, str) or len(sha) != 40:
                  raise SystemExit(f"ABORT: malformed blob identity for {rel}")
              entries.append({"path": rel, "mode": "100644", "type": "blob", "sha": sha})

          entries.append({
              "path": os.environ["VENDOR_PREFIX"],
              "mode": "040000",
              "type": "tree",
              "sha": os.environ["FROZEN_VENDOR_TREE"],
          })

          tree = request("POST", "/git/trees", {
              "base_tree": os.environ["POLICY_TREE"],
              "tree": entries,
          })
          tree_sha = tree.get("sha")
          if not isinstance(tree_sha, str) or len(tree_sha) != 40:
              raise SystemExit("ABORT: malformed synthetic candidate tree identity")

          recursive = request("GET", f"/git/trees/{tree_sha}?recursive=1")
          if recursive.get("sha") != tree_sha or recursive.get("truncated") is True:
              raise SystemExit("ABORT: synthetic candidate recursive tree identity/truncation failure")
          vendor = [
              e for e in recursive.get("tree", [])
              if e.get("path") == os.environ["VENDOR_PREFIX"] and e.get("type") == "tree"
          ]
          if len(vendor) != 1 or vendor[0].get("sha") != os.environ["FROZEN_VENDOR_TREE"]:
              raise SystemExit("ABORT: synthetic candidate vendor subtree identity mismatch")

          commit = request("POST", "/git/commits", {
              "message": "test(s1): synthetic repaired-policy frozen-component canary",
              "tree": tree_sha,
              "parents": [os.environ["POLICY_HEAD"]],
          })
          commit_sha = commit.get("sha")
          if not isinstance(commit_sha, str) or len(commit_sha) != 40:
              raise SystemExit("ABORT: malformed synthetic commit identity")

          print(f"SYNTHETIC_CANDIDATE_SHA={commit_sha}")
          print(f"SYNTHETIC_CANDIDATE_TREE={tree_sha}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"SYNTHETIC_CANDIDATE_SHA={commit_sha}\n")
              env.write(f"SYNTHETIC_CANDIDATE_TREE={tree_sha}\n")
          PY

      - name: Run repaired PR9 policy against synthetic remote candidate data
        shell: bash
        run: |
          set -euo pipefail
          python3 policy/.github/scripts/wepld_integrity.py selftest
          output="$RUNNER_TEMP/verify-remote.txt"
          python3 policy/.github/scripts/wepld_integrity.py verify-remote \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$SYNTHETIC_CANDIDATE_SHA" \
            --policy-root policy \
            --pr-base-sha "$CANONICAL_BASE" | tee "$output"

          grep -Fx 'wepld integrity verification: PASS' "$output" >/dev/null
          grep -Fx 'mode=REMOTE_CANDIDATE_DATA_ONLY' "$output" >/dev/null
          grep -Fx 'stage=S1_COMPONENT_ACQUISITION_CANDIDATE' "$output" >/dev/null
          grep -Fx 'source_admission=0' "$output" >/dev/null
          grep -Fx 'product_implementation_authorized=NO' "$output" >/dev/null

          echo "PR9_REPAIRED_COMPONENT_POLICY_E2E_CANARY=PASS"
          echo "POLICY_HEAD=$POLICY_HEAD"
          echo "SYNTHETIC_CANDIDATE_SHA=$SYNTHETIC_CANDIDATE_SHA"
          echo "SYNTHETIC_CANDIDATE_TREE=$SYNTHETIC_CANDIDATE_TREE"
          echo "FROZEN_VENDOR_TREE=$FROZEN_VENDOR_TREE"
          echo "EXACT_COMPONENT_LOCK_SHA256=$EXPECTED_LOCK_SHA256"
          echo "SOURCE_ACQUISITION_CHECK=OPEN"
          echo "DEPENDENCY_ADMISSION=NONE"
          echo "PRODUCT_IMPLEMENTATION=BLOCKED"
