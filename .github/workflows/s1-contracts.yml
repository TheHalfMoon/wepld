name: s1-contracts

on:
  pull_request:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/contracts/**"
      - "crates/core/**"
      - ".github/scripts/wepld_s1_execution_integrity.py"
      - ".github/workflows/s1-contracts.yml"

permissions: {}

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Verify pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          expected="$(python - <<'PY'
          import tomllib
          with open("rust-toolchain.toml", "rb") as fh:
              print(tomllib.load(fh)["toolchain"]["channel"])
          PY
          )"
          rustc --version --verbose
          cargo --version --verbose
          actual_rustc="$(rustc --version | awk '{print $2}')"
          actual_cargo="$(cargo --version | awk '{print $2}')"
          test "$actual_rustc" = "$expected"
          test "$actual_cargo" = "$expected"

      - name: Format contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --package wepld-contracts -- --check

      - name: Clippy contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --package wepld-contracts --all-targets -- -D warnings -F unsafe-code

      - name: Test contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --package wepld-contracts --all-targets

      - name: Format pure Core state
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --package wepld-core -- --check

      - name: Clippy pure Core state
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --package wepld-core --all-targets -- -D warnings -F unsafe-code

      - name: Test pure Core state
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --package wepld-core --all-targets
