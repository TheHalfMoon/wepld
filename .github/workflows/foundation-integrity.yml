name: foundation-integrity

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision with canonical history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
          lfs: false
          submodules: false

      - name: Diagnostic materialize exact H0-013 Cargo lock candidate
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          root="$RUNNER_TEMP/wepld-h0-013-lock-materialization"
          rm -rf "$root"
          mkdir -p "$root/src" "$root/.cargo"
          cat > "$root/Cargo.toml" <<'EOF'
          [package]
          name = "wepld-harness-h0"
          version = "0.0.0"
          edition = "2024"
          rust-version = "1.97.1"
          publish = false

          [workspace]
          resolver = "3"

          [dependencies]
          serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
          serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
          sha2 = { version = "=0.11.0", default-features = false }
          ureq = { version = "=3.4.0", default-features = false, features = ["rustls"] }
          EOF
          cat > "$root/.cargo/config.toml" <<'EOF'
          [build]
          rustflags = [
            "--cfg",
            "sha2_backend=\"soft\"",
            "--cfg",
            "sha2_backend_soft=\"compact\"",
          ]
          EOF
          printf '%s\n' '#![forbid(unsafe_code)]' > "$root/src/lib.rs"
          cargo +1.97.1 generate-lockfile --manifest-path "$root/Cargo.toml"
          lock_sha="$(sha256sum "$root/Cargo.lock" | awk '{print $1}')"
          package_count="$(grep -c '^\[\[package\]\]$' "$root/Cargo.lock")"
          echo "LOCK_SHA256=$lock_sha"
          echo "LOCK_PACKAGE_COUNT=$package_count"
          test "$lock_sha" = "5ab13b3bbb94c8245bea6b7ba7d76f84ef642996dd6c4b31e08def1796b6943a"
          test "$package_count" = "54"

      - name: Upload exact H0-013 Cargo lock candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: h0-013-cargo-lock
          path: ${{ runner.temp }}/wepld-h0-013-lock-materialization/Cargo.lock
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Run integrity policy self-tests
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/wepld_harness_h0_implementation_retention_integrity.py selftest

      - name: Verify exact checked-out tree against the immutable baseline
        shell: bash
        env:
          WEPLD_COMPARISON_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${WEPLD_COMPARISON_SHA:-}" ]; then
            echo 'immutable baseline comparison SHA could not be established' >&2
            exit 1
          fi
          python .github/scripts/wepld_harness_h0_implementation_retention_integrity.py verify-local \
            --root . \
            --remote-baseline \
            --pr-base-sha "$WEPLD_COMPARISON_SHA"
