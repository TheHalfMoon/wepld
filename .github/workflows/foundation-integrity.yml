name: foundation-integrity

on:
  pull_request:

permissions:
  contents: read

jobs:
  github-api-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report GitHub API capacity without credential contents
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import urllib.request
          import urllib.error

          req = urllib.request.Request(
              'https://api.github.com/rate_limit',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'wepld-v9-diagnostic',
              },
          )
          try:
              response = urllib.request.urlopen(req, timeout=20)
          except urllib.error.HTTPError as exc:
              response = exc
          print(f'http_status={response.status}')
          for key in ('X-RateLimit-Limit', 'X-RateLimit-Remaining', 'X-RateLimit-Used', 'X-RateLimit-Reset', 'Retry-After'):
              value = response.headers.get(key)
              if value is not None:
                  print(f'{key.lower()}={value}')
          PY
