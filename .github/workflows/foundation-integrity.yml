name: foundation-integrity

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout diagnostic revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Expose exact PR 74 canonical activation run
        shell: bash
        env:
          TARGET_SHA: 5d25112d506b0044f2e79756869c009c5b5ba358
        run: |
          set -euo pipefail
          api='https://api.github.com/repos/TheHalfMoon/wepld/actions/workflows/foundation-integrity.yml/runs?event=push&branch=main&per_page=100'
          curl --fail --silent --show-error --location \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" > "$RUNNER_TEMP/runs.json"
          jq --arg sha "$TARGET_SHA" \
            '[.workflow_runs[] | select(.head_sha == $sha and .event == "push" and .head_branch == "main")] | sort_by(.created_at) | reverse | .[0]' \
            "$RUNNER_TEMP/runs.json" > "$RUNNER_TEMP/target.json"
          test "$(jq -r '.id // empty' "$RUNNER_TEMP/target.json")" != ''
          run_id="$(jq -r '.id' "$RUNNER_TEMP/target.json")"
          jobs_url="$(jq -r '.jobs_url' "$RUNNER_TEMP/target.json")"
          echo "TARGET_SHA=$TARGET_SHA"
          echo "MATCH_RUN_ID=$run_id"
          echo "RUN_NUMBER=$(jq -r '.run_number' "$RUNNER_TEMP/target.json")"
          echo "WORKFLOW_NAME=$(jq -r '.name' "$RUNNER_TEMP/target.json")"
          echo "EVENT=$(jq -r '.event' "$RUNNER_TEMP/target.json")"
          echo "HEAD_BRANCH=$(jq -r '.head_branch' "$RUNNER_TEMP/target.json")"
          echo "HEAD_SHA=$(jq -r '.head_sha' "$RUNNER_TEMP/target.json")"
          echo "STATUS=$(jq -r '.status' "$RUNNER_TEMP/target.json")"
          echo "CONCLUSION=$(jq -r '.conclusion' "$RUNNER_TEMP/target.json")"
          echo "CREATED_AT=$(jq -r '.created_at' "$RUNNER_TEMP/target.json")"
          curl --fail --silent --show-error --location \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$jobs_url" > "$RUNNER_TEMP/jobs.json"
          jq -r '.jobs[] | "JOB_ID=\(.id) JOB_NAME=\(.name) JOB_STATUS=\(.status) JOB_CONCLUSION=\(.conclusion)"' "$RUNNER_TEMP/jobs.json"

      - name: Preserve diagnostic-only authority boundary
        shell: bash
        run: |
          set -euo pipefail
          echo 'DIAGNOSTIC_ONLY=YES'
          echo 'MERGE=NEVER'
          echo 'CREDENTIAL_ACCESS=NONE'
          echo 'SOURCE_ADMISSION=NONE'
          echo 'DEPENDENCY_ADMISSION=NONE'
          echo 'PRODUCT_IMPLEMENTATION_AUTHORITY=NONE'
          echo 'ROADMAP_MUTATION=NONE'
          echo 'H0_014_PLUS=NOT_STARTED'
          echo 'H0_SCREEN_EXECUTION=NONE'
          echo 'MODEL_PROVIDER_EXECUTION=NONE'
