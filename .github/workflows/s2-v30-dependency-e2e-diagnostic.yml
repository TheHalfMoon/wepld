name: s2-v30-dependency-e2e-diagnostic

on:
  push:
    branches:
      - diag/s2-v30-dependency-e2e-2026-08-29

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      V30_POLICY_BASE_SHA: 9a343016df41b2cdfdd423b60ef5725c7f9594a0
      DEPENDENCY_SOURCE_REF: feat/s2-identity-store-dependency-admission-2026-08-29
    steps:
      - name: Checkout diagnostic branch with canonical history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          lfs: false
          submodules: false

      - name: Trace dependency projection selection on exact candidate
        shell: bash
        run: |
          set -euo pipefail
          policy_base="${RUNNER_TEMP}/wepld-v30-policy-base"
          candidate="${RUNNER_TEMP}/wepld-v30-dependency-candidate"
          git worktree add --detach "$policy_base" "$V30_POLICY_BASE_SHA"
          git worktree add --detach "$candidate" "$V30_POLICY_BASE_SHA"
          cleanup() {
            git worktree remove --force "$candidate" >/dev/null 2>&1 || true
            git worktree remove --force "$policy_base" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for path in \
            Cargo.lock \
            crates/core/Cargo.toml \
            docs/governance/DEPENDENCY_REGISTER.md
          do
            git show "origin/${DEPENDENCY_SOURCE_REF}:${path}" > "${candidate}/${path}"
          done

          changed="$(git -C "$candidate" diff --name-only)"
          expected=$'Cargo.lock\ncrates/core/Cargo.toml\ndocs/governance/DEPENDENCY_REGISTER.md'
          test "$changed" = "$expected"
          test "$(git hash-object "${candidate}/crates/core/Cargo.toml")" = "9ff919ab5f05d6aa5b6c179f194eb4611e7b1bd8"
          test "$(git hash-object "${candidate}/Cargo.lock")" = "d137e3f0c62637e402374880deb5355a878d4a91"
          test "$(git hash-object "${candidate}/docs/governance/DEPENDENCY_REGISTER.md")" = "8b5efceac77b3f44f1c17eaab2b70862c90b7a06"

          git -C "$candidate" add Cargo.lock crates/core/Cargo.toml docs/governance/DEPENDENCY_REGISTER.md
          git -C "$candidate" -c user.name='WePLD Diagnostic' -c user.email='diagnostic@invalid.local' \
            commit -m 'diagnostic(s2): exact dependency fixture' >/dev/null
          test -z "$(git -C "$candidate" status --porcelain)"

          python - "$policy_base" "$candidate" "$V30_POLICY_BASE_SHA" <<'PY'
          from __future__ import annotations

          import sys
          import traceback
          from pathlib import Path

          policy_base, candidate, policy_sha = sys.argv[1:]
          sys.path.insert(0, str(Path(policy_base) / ".github/scripts"))
          import wepld_s2_identity_store_governance_v30_integrity as v30

          v30.install()
          original_read_text = v30.base.read_text_exact
          original_deps_ready = v30.p.s.r.q.deps_ready
          deps_calls = 0
          manifest_calls = 0

          def traced_deps_ready(view):
              global deps_calls
              deps_calls += 1
              result = original_deps_ready(view)
              print(
                  f"DEPS_READY_CALL={deps_calls} TYPE={type(view).__module__}.{type(view).__name__} RESULT={result}",
                  file=sys.stderr,
              )
              return result

          def traced_read_text(view, relative, expected):
              global manifest_calls
              if relative == "crates/core/Cargo.toml":
                  manifest_calls += 1
                  data = view.read_bytes(relative, v30.base.MAX_POLICY_FILE_BYTES)
                  print(
                      f"CORE_MANIFEST_READ={manifest_calls} TYPE={type(view).__module__}.{type(view).__name__} BLOB={v30.p.s.r.q.p.blob(data)}",
                      file=sys.stderr,
                  )
                  traceback.print_stack(file=sys.stderr)
              return original_read_text(view, relative, expected)

          v30.p.s.r.q.deps_ready = traced_deps_ready
          v30.base.read_text_exact = traced_read_text
          print("DIAGNOSTIC_AUTHORITY=NONE", file=sys.stderr)
          raise SystemExit(v30.p.s.r.q.p.CAND(candidate, policy_base, policy_sha))
          PY
