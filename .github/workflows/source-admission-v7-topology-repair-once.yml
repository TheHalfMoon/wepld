name: one-shot v7 topology fail-closed repair

on:
  pull_request:
    paths:
      - '.github/workflows/source-admission-v7-topology-repair-once.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ci/pictorial-agile-source-admission-v7-2026-08-24'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/pictorial-agile-source-admission-v7-2026-08-24
          fetch-depth: 0
          persist-credentials: true
          lfs: false
          submodules: false

      - name: Apply reviewed topology repair and normalize EOF
        shell: bash
        env:
          EXPECTED_PARENT: ${{ github.event.pull_request.head.sha }}
          EXPECTED_MAIN: 2ab2fae14bc3b3b1f1e9bc2059972456955aeff7
          BRANCH: ci/pictorial-agile-source-admission-v7-2026-08-24
          PATCH_SOURCE_COMMIT: cc75f17beca13a001ba141344eaefb8741fc7ae1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PARENT"
          git fetch origin main "$BRANCH" --no-tags
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/$BRANCH)" = "$EXPECTED_PARENT"

          git show "$PATCH_SOURCE_COMMIT:.github/workflows/source-admission-v7-topology-repair-once.yml" > /tmp/original-repair.yml
          awk '
            found && /^          PY$/ { exit }
            found { sub(/^          /, ""); print }
            /^          python - <<'\''PY'\''$/ { found=1 }
          ' /tmp/original-repair.yml > /tmp/apply-repair.py
          test -s /tmp/apply-repair.py
          python /tmp/apply-repair.py

          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/wepld_pictorial_agile_source_admission_v7_integrity.py')
          path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY

          python .github/scripts/wepld_pictorial_agile_source_admission_v7_integrity.py selftest
          python -m py_compile .github/scripts/wepld_pictorial_agile_source_admission_v7_integrity.py
          rm -rf .github/scripts/__pycache__
          rm .github/workflows/source-admission-v7-topology-repair-once.yml
          git diff --check

          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/scripts/wepld_pictorial_agile_source_admission_v7_integrity.py'
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/source-admission-v7-topology-repair-once.yml'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/wepld_pictorial_agile_source_admission_v7_integrity.py .github/workflows/source-admission-v7-topology-repair-once.yml
          git commit -m 'fix(ci): fail closed on v7 topology drift'

          git fetch origin main "$BRANCH" --no-tags
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/$BRANCH)" = "$EXPECTED_PARENT"
          git push origin HEAD:"$BRANCH"
