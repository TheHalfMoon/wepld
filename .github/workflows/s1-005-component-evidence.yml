name: S1-005 target-scoped license evidence

on:
  push:
    branches:
      - evidence/s1-005-component-admission

permissions: {}

jobs:
  licenses:
    name: Capture S1 desktop-target license coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: 590f7453d022f8192af9a0259560f92de280c8ed
      CANDIDATE_TREE: 4552c2910de58759ca5d65354dee37a721b1e7c8
      CARGO_LOCK_SHA256: 3816d2befde7412f5a64b2015e437683dcd9876259fd756e7082b0d9c331cbc9
    steps:
      - name: Install pinned license tool before candidate acquisition
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          cargo +1.97.1 install --locked cargo-deny --version 0.19.7

      - name: Acquire exact public candidate and verify identity
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/wepld-s1-005-license-evidence"
          repo="$root/repo"
          out="$root/out"
          rm -rf "$root"
          mkdir -p "$repo" "$out"

          git -C "$repo" init -q
          git -C "$repo" remote add origin https://github.com/TheHalfMoon/wepld.git
          git -C "$repo" -c protocol.version=2 fetch --no-tags --depth=1 origin "$CANDIDATE_SHA"
          git -C "$repo" checkout --detach --quiet FETCH_HEAD

          test "$(git -C "$repo" rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C "$repo" rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(sha256sum "$repo/Cargo.lock" | awk '{print $1}')" = "$CARGO_LOCK_SHA256"
          test -z "$(git -C "$repo" status --porcelain=v1)"

      - name: Capture and verify license coverage for S1 desktop targets
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/wepld-s1-005-license-evidence"
          repo="$root/repo"
          out="$root/out"
          cd "$repo"

          cargo +1.97.1 deny --version > "$out/cargo-deny-version.txt"

          targets=(
            x86_64-unknown-linux-gnu
            x86_64-pc-windows-msvc
            aarch64-apple-darwin
            x86_64-apple-darwin
          )

          for target in "${targets[@]}"; do
            cargo +1.97.1 metadata \
              --locked \
              --format-version 1 \
              --filter-platform "$target" \
              > "$out/metadata-$target.json"

            cargo +1.97.1 deny \
              --locked \
              --target "$target" \
              list \
              --format json \
              --layout crate \
              > "$out/licenses-$target.json"
          done

          python3 - "$out" <<'PY'
          import json
          import pathlib
          import sys

          out = pathlib.Path(sys.argv[1])
          targets = [
              "x86_64-unknown-linux-gnu",
              "x86_64-pc-windows-msvc",
              "aarch64-apple-darwin",
              "x86_64-apple-darwin",
          ]
          summary = []
          allowed_internal = {"wepld-desktop", "wepld-contracts", "wepld-core"}

          for target in targets:
              metadata = json.loads((out / f"metadata-{target}.json").read_text(encoding="utf-8"))
              licenses = json.loads((out / f"licenses-{target}.json").read_text(encoding="utf-8"))

              packages = {p["id"]: p for p in metadata["packages"]}
              node_ids = [n["id"] for n in metadata["resolve"]["nodes"]]
              resolved = {
                  (packages[node_id]["name"], packages[node_id]["version"])
                  for node_id in node_ids
              }
              external = {
                  identity for identity in resolved
                  if identity[0] not in allowed_internal
              }

              listed = set()
              empty = []
              license_ids = set()
              for key, value in licenses.items():
                  parts = key.split(" ", 2)
                  if len(parts) < 2:
                      raise SystemExit(f"ABORT: malformed cargo-deny key for {target}: {key!r}")
                  identity = (parts[0], parts[1])
                  listed.add(identity)
                  values = value.get("licenses", [])
                  if not values and identity[0] not in allowed_internal:
                      empty.append(identity)
                  for item in values:
                      license_ids.add(item)

              missing = sorted(external - listed)
              if missing:
                  raise SystemExit(
                      f"ABORT: target {target} has external resolved packages absent "
                      f"from cargo-deny license inventory: {missing!r}"
                  )
              if empty:
                  raise SystemExit(
                      f"ABORT: target {target} has external packages with no detected license: "
                      f"{sorted(empty)!r}"
                  )

              summary.append(
                  f"{target}: RESOLVE_NODES={len(resolved)} "
                  f"EXTERNAL_RESOLVED={len(external)} "
                  f"LICENSE_LISTED={len(listed)} "
                  f"UNIQUE_LICENSE_IDS={','.join(sorted(license_ids))}"
              )

          (out / "LICENSE-COVERAGE.txt").write_text(
              "\n".join(summary) + "\n",
              encoding="utf-8",
          )
          PY

          cat "$out/LICENSE-COVERAGE.txt"

      - name: Freeze target-license evidence hashes
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/wepld-s1-005-license-evidence/out"
          (
            cd "$out"
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' \
              | LC_ALL=C sort \
              | while IFS= read -r file; do sha256sum "$file"; done \
              > SHA256SUMS.txt
            sha256sum LICENSE-COVERAGE.txt SHA256SUMS.txt
          )

      - name: Upload target-scoped license evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s1-005-target-license-evidence
          path: ${{ runner.temp }}/wepld-s1-005-license-evidence/out/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
