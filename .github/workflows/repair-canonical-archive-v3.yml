name: repair-canonical-archive-v3

on:
  push:
    branches:
      - docs/fresh-reconstitution-v1
    paths:
      - .github/repair-payload/READY_V3

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full branch history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: docs/fresh-reconstitution-v1
          fetch-depth: 0

      - name: Select only an exact-hash archive candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, csv, hashlib, io, json, pathlib, re, subprocess, tarfile

          p = pathlib.Path('.github/repair-payload')
          archive_path = pathlib.Path('docs/canonical/artifacts/WEPLD_CANONICAL_ARTIFACTS_2026-08-14.tar.gz')
          integrity_path = pathlib.Path('.github/workflows/foundation-integrity.yml')
          readme_path = pathlib.Path('docs/canonical/artifacts/README.md')
          expected_archive = '35dee10e7526d1958c5b3b88a1a9b569b0d1a464f5eec4e20e16c19c99f1c6b0'
          expected_plan = 'e269b10ef711731c4ad3af7b1135546f92d82a78975cabc9ff52c2dea4b5bf44'
          historical_commit = 'c8ffd032cdef6c2f92dff402a4c0edc582917698'
          expected_members = {
              'WEPLD_MASTER_ARCHITECTURE_EXECUTION_PLAN_2026-08-12_V2_2.md',
              'WEPLD_MASTER_SOURCE_REGISTRY_2026-08-14_V1.json',
              'WEPLD_MASTER_SOURCE_REGISTRY_2026-08-14_V1.csv',
              'WEPLD_SOURCE_ARTIFACT_PIN_LEDGER_2026-08-14_V1.md',
              'WEPLD_SOURCE_CAPABILITY_MINING_PRIORITY_MATRIX_2026-08-14_V1.md',
          }

          def read(name):
              path = p / name
              if not path.is_file():
                  raise SystemExit(f'missing staged part: {name}')
              return path.read_text(encoding='ascii').strip()

          fixed_prefix = ''.join(read(x) for x in [
              'chunk01.b64','chunk02.b64','chunk03.b64','chunk04.b64','chunk05.b64'
          ])
          fixed_suffix = ''.join(read(x) for x in [
              'chunk06b.b64','chunk07a.b64','chunk07b.b64','chunk08.b64','chunk09.b64'
          ])

          micro = ''.join(read(x) for x in [
              'chunk06a01.b64','chunk06a02.b64','chunk06a03.b64','chunk06a04.b64'
          ])
          if len(micro) < 7500:
              raise SystemExit(f'micro chunk06a candidate too short: {len(micro)}')
          micro = micro[:7500]

          historical = subprocess.check_output([
              'git','show',f'{historical_commit}:.github/repair-payload/chunk06.b64'
          ], text=True).strip()
          if len(historical) < 7500:
              raise SystemExit(f'historical chunk06 candidate too short: {len(historical)}')
          historical = historical[:7500]

          selected = None
          for label, chunk06a in [('micro', micro), ('historical', historical)]:
              encoded = fixed_prefix + chunk06a + fixed_suffix
              try:
                  candidate = base64.b64decode(encoded, validate=True)
              except Exception:
                  continue
              digest = hashlib.sha256(candidate).hexdigest()
              print(f'candidate={label} archive_sha256={digest}')
              if digest == expected_archive:
                  selected = candidate
                  print(f'selected_candidate={label}')
                  break
          if selected is None:
              raise SystemExit('no candidate produced the exact canonical archive SHA-256')

          payloads = {}
          with tarfile.open(fileobj=io.BytesIO(selected), mode='r:gz') as tf:
              members = tf.getmembers()
              names = {m.name for m in members}
              if names != expected_members or any(not m.isfile() for m in members):
                  raise SystemExit(f'archive member contract mismatch: {sorted(names)}')
              for m in members:
                  f = tf.extractfile(m)
                  if f is None:
                      raise SystemExit(f'unreadable member: {m.name}')
                  data = f.read()
                  if len(data) != m.size:
                      raise SystemExit(f'truncated member: {m.name}')
                  payloads[m.name] = data

          plan_name = 'WEPLD_MASTER_ARCHITECTURE_EXECUTION_PLAN_2026-08-12_V2_2.md'
          plan_sha = hashlib.sha256(payloads[plan_name]).hexdigest()
          if plan_sha != expected_plan:
              raise SystemExit(f'master-plan SHA mismatch: {plan_sha}')

          reg_name = 'WEPLD_MASTER_SOURCE_REGISTRY_2026-08-14_V1.json'
          registry = json.loads(payloads[reg_name].decode('utf-8'))
          rows = registry.get('registry')
          if not isinstance(rows, list) or len(rows) != 402:
              raise SystemExit('JSON registry row count mismatch')
          normalized = [r.get('name','').casefold() for r in rows if isinstance(r.get('name'), str)]
          if len(normalized) != 402 or len(set(normalized)) != 402:
              raise SystemExit('JSON registry names malformed or non-unique')
          if any(r.get('admission_status') != 'NOT_ADMITTED' for r in rows):
              raise SystemExit('registry unexpectedly contains admitted source')
          counts = registry.get('counts', {})
          if (counts.get('frozen_v1_5_named_entries'),
              counts.get('post_v1_5_new_top_level_named_entries'),
              counts.get('current_accounted_named_entries')) != (397,5,402):
              raise SystemExit(f'registry count anchors mismatch: {counts}')

          csv_name = 'WEPLD_MASTER_SOURCE_REGISTRY_2026-08-14_V1.csv'
          csv_rows = list(csv.DictReader(io.StringIO(payloads[csv_name].decode('utf-8'))))
          if len(csv_rows) != 402 or len({r.get('name','').casefold() for r in csv_rows}) != 402:
              raise SystemExit('CSV registry count/uniqueness mismatch')

          for name in expected_members - {plan_name, reg_name, csv_name}:
              if not payloads[name].strip():
                  raise SystemExit(f'empty canonical artifact: {name}')

          archive_path.write_bytes(selected)
          integrity = integrity_path.read_text(encoding='utf-8')
          integrity, n = re.subn(
              r'(?<=expected_archive_sha256 = \(\n              ")[0-9a-f]{64}',
              expected_archive, integrity, count=1)
          if n != 1:
              raise SystemExit('could not update integrity-workflow archive hash')
          integrity_path.write_text(integrity, encoding='utf-8')

          readme = readme_path.read_text(encoding='utf-8')
          readme, n = re.subn(r'(?<=SHA256 = )[0-9a-f]{64}', expected_archive, readme, count=1)
          if n != 1:
              raise SystemExit('could not update artifact README hash')
          readme_path.write_text(readme, encoding='utf-8')
          print('canonical archive semantic verification: PASS')
          PY

          git rm -rf -- .github/repair-payload
          for wf in \
            .github/workflows/repair-canonical-archive.yml \
            .github/workflows/repair-canonical-archive-v2.yml \
            .github/workflows/repair-canonical-archive-v3.yml; do
            if [ -e "$wf" ]; then git rm -f -- "$wf"; fi
          done

          changed="$(git diff --name-only)"
          for required in \
            .github/workflows/foundation-integrity.yml \
            docs/canonical/artifacts/README.md \
            docs/canonical/artifacts/WEPLD_CANONICAL_ARTIFACTS_2026-08-14.tar.gz; do
            printf '%s\n' "$changed" | grep -Fxq "$required" || {
              echo "required repaired path missing: $required" >&2; exit 1;
            }
          done
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(.github/repair-payload/|.github/workflows/repair-canonical-archive(-v2|-v3)?\.yml$|.github/workflows/foundation-integrity\.yml$|docs/canonical/artifacts/README\.md$|docs/canonical/artifacts/WEPLD_CANONICAL_ARTIFACTS_2026-08-14\.tar\.gz$)' || true)"
          if [ -n "$unexpected" ]; then
            echo 'unexpected repair scope:' >&2; printf '%s\n' "$unexpected" >&2; exit 1;
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: replace canonical artifact archive'
          git push origin HEAD:docs/fresh-reconstitution-v1
