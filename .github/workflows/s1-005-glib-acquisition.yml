name: S1-005 glib 0.18.5 official-byte acquisition

on:
  push:
    branches:
      - acq/s1-005-glib-0.18.5-official-bytes

permissions: {}

jobs:
  acquire:
    name: Verify published crate and construct candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Acquire, verify, patch, and freeze evidence
        shell: bash
        env:
          EXPECTED_CRATE_SHA256: 233daaf6e83ae6a12a52055f568f9d7cf4671dabb78ff9560ab6da230ce00ee5
          CRATE_URL: https://static.crates.io/crates/glib/glib-0.18.5.crate
        run: |
          set -euo pipefail
          export LC_ALL=C
          umask 077

          root="$RUNNER_TEMP/wepld-s1-005-glib-acquisition"
          crate="$root/glib-0.18.5.crate"
          extract="$root/extract"
          pristine="$extract/glib-0.18.5"
          vendor="$root/glib-0.18.5-wepld1"
          out="$root/out"

          rm -rf "$root"
          mkdir -p "$extract" "$out"

          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            "$CRATE_URL" \
            --output "$crate"

          actual_sha256="$(sha256sum "$crate" | awk '{print $1}')"
          test "$actual_sha256" = "$EXPECTED_CRATE_SHA256"

          CRATE="$crate" EXTRACT="$extract" python3 - <<'PY'
          import os
          import tarfile
          from pathlib import PurePosixPath

          crate = os.environ["CRATE"]
          extract = os.environ["EXTRACT"]
          prefix = "glib-0.18.5/"

          with tarfile.open(crate, "r:gz") as archive:
              members = archive.getmembers()
              if not members:
                  raise SystemExit("ABORT: published crate archive is empty")
              for member in members:
                  name = member.name
                  path = PurePosixPath(name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"ABORT: unsafe archive path: {name}")
                  if name != "glib-0.18.5" and not name.startswith(prefix):
                      raise SystemExit(f"ABORT: archive member escaped expected package root: {name}")
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f"ABORT: unsupported archive member type: {name}")
              archive.extractall(extract)
          PY

          test -d "$pristine"
          test -f "$pristine/Cargo.toml"
          test -f "$pristine/Cargo.toml.orig"
          test -f "$pristine/LICENSE"
          test -f "$pristine/.cargo_vcs_info.json"
          test -f "$pristine/src/variant_iter.rs"

          python3 - "$pristine/Cargo.toml" <<'PY'
          import pathlib
          import re
          import sys

          text = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          if re.search(r'^name\s*=\s*"glib"\s*$', text, re.M) is None:
              raise SystemExit("ABORT: published Cargo.toml package name mismatch")
          if re.search(r'^version\s*=\s*"0\.18\.5"\s*$', text, re.M) is None:
              raise SystemExit("ABORT: published Cargo.toml package version mismatch")
          PY

          cp -a "$pristine" "$vendor"

          VARIANT="$vendor/src/variant_iter.rs" python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path(os.environ["VARIANT"])
          data = p.read_bytes()
          old_decl = b"let p: *mut libc::c_char = std::ptr::null_mut();"
          new_decl = b"let mut p: *mut libc::c_char = std::ptr::null_mut();"
          old_arg = b"                &p,\n"
          new_arg = b"                &mut p,\n"

          if data.count(old_decl) != 1:
              raise SystemExit(f"ABORT: expected one immutable pointer declaration, found {data.count(old_decl)}")
          if data.count(old_arg) != 1:
              raise SystemExit(f"ABORT: expected one '&p,' argument, found {data.count(old_arg)}")

          data = data.replace(old_decl, new_decl, 1)
          data = data.replace(old_arg, new_arg, 1)
          p.write_bytes(data)

          if old_decl in data or old_arg in data:
              raise SystemExit("ABORT: vulnerable byte sequence survived intended patch")
          if data.count(new_decl) != 1 or data.count(new_arg) != 1:
              raise SystemExit("ABORT: patched byte sequence multiplicity mismatch")
          PY

          PRISTINE="$pristine" VENDOR="$vendor" python3 - <<'PY'
          import os
          from pathlib import Path

          pristine = Path(os.environ["PRISTINE"])
          vendor = Path(os.environ["VENDOR"])

          def files(root: Path):
              return sorted(p.relative_to(root).as_posix() for p in root.rglob("*") if p.is_file())

          pf = files(pristine)
          vf = files(vendor)
          if pf != vf:
              raise SystemExit("ABORT: vendor file set differs from published crate file set")

          changed = []
          for rel in pf:
              if (pristine / rel).read_bytes() != (vendor / rel).read_bytes():
                  changed.append(rel)

          if changed != ["src/variant_iter.rs"]:
              raise SystemExit(f"ABORT: unexpected published-to-vendor changed files: {changed}")
          PY

          set +e
          diff -u "$pristine/src/variant_iter.rs" "$vendor/src/variant_iter.rs" > "$out/upstream-to-wepld.patch"
          diff_status=$?
          set -e
          test "$diff_status" -eq 1

          grep -F -- '-            let p: *mut libc::c_char = std::ptr::null_mut();' "$out/upstream-to-wepld.patch" >/dev/null
          grep -F -- '+            let mut p: *mut libc::c_char = std::ptr::null_mut();' "$out/upstream-to-wepld.patch" >/dev/null
          grep -F -- '-                &p,' "$out/upstream-to-wepld.patch" >/dev/null
          grep -F -- '+                &mut p,' "$out/upstream-to-wepld.patch" >/dev/null

          PRISTINE="$pristine" VENDOR="$vendor" OUT="$out" python3 - <<'PY'
          import hashlib
          import os
          import stat
          from pathlib import Path

          pristine = Path(os.environ["PRISTINE"])
          vendor = Path(os.environ["VENDOR"])
          out = Path(os.environ["OUT"])

          def write_manifest(root: Path, target: Path):
              rows = []
              for p in sorted((p for p in root.rglob("*") if p.is_file()), key=lambda x: x.relative_to(root).as_posix()):
                  rel = p.relative_to(root).as_posix()
                  digest = hashlib.sha256(p.read_bytes()).hexdigest()
                  mode = stat.S_IMODE(p.stat().st_mode)
                  rows.append(f"{digest}  {mode:04o}  {rel}")
              target.write_text("\n".join(rows) + "\n", encoding="utf-8")

          write_manifest(pristine, out / "published-file-sha256.txt")
          write_manifest(vendor, out / "vendor-file-sha256.txt")
          PY

          file_count="$(find "$vendor" -type f | wc -l | tr -d ' ')"
          source_vcs_sha="$(python3 - "$pristine/.cargo_vcs_info.json" <<'PY'
          import json
          import pathlib
          import sys
          obj = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          sha = obj.get("git", {}).get("sha1")
          if not isinstance(sha, str) or len(sha) != 40:
              raise SystemExit("ABORT: malformed .cargo_vcs_info.json git.sha1")
          print(sha)
          PY
          )"

          git -C "$vendor" init -q
          git -C "$vendor" config core.autocrlf false
          git -C "$vendor" config core.filemode true
          git -C "$vendor" add -A
          vendor_tree_sha="$(git -C "$vendor" write-tree)"
          patched_variant_blob_sha="$(git -C "$vendor" hash-object src/variant_iter.rs)"
          rm -rf "$vendor/.git"

          cp "$crate" "$out/glib-0.18.5.crate"

          tar --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -C "$root" \
            -czf "$out/glib-0.18.5-wepld1.tar.gz" \
            glib-0.18.5-wepld1

          patch_sha256="$(sha256sum "$out/upstream-to-wepld.patch" | awk '{print $1}')"
          vendor_tar_sha256="$(sha256sum "$out/glib-0.18.5-wepld1.tar.gz" | awk '{print $1}')"
          published_manifest_sha256="$(sha256sum "$out/published-file-sha256.txt" | awk '{print $1}')"
          vendor_manifest_sha256="$(sha256sum "$out/vendor-file-sha256.txt" | awk '{print $1}')"

          cat > "$out/EVIDENCE.txt" <<EOF
          WEPLD_S1_005_GLIB_ACQUISITION
          SOURCE_URL=$CRATE_URL
          PUBLISHED_CRATE_SHA256=$actual_sha256
          EXPECTED_CRATE_SHA256=$EXPECTED_CRATE_SHA256
          SOURCE_VCS_SHA=$source_vcs_sha
          PATCHED_VARIANT_GIT_BLOB_SHA=$patched_variant_blob_sha
          VENDOR_TREE_SHA=$vendor_tree_sha
          PATCH_SHA256=$patch_sha256
          VENDOR_TAR_SHA256=$vendor_tar_sha256
          PUBLISHED_FILE_MANIFEST_SHA256=$published_manifest_sha256
          VENDOR_FILE_MANIFEST_SHA256=$vendor_manifest_sha256
          VENDOR_FILE_COUNT=$file_count
          PUBLISHED_TO_VENDOR_CHANGED_FILES=src/variant_iter.rs
          RUNTIME_DEPENDENCY_ADMISSION=NONE
          SOURCE_ACQUISITION_CHECK=OPEN
          PRODUCT_IMPLEMENTATION=BLOCKED
          EOF

          cat "$out/EVIDENCE.txt"

      - name: Upload immutable acquisition evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s1-005-glib-0.18.5-official-byte-evidence
          path: ${{ runner.temp }}/wepld-s1-005-glib-acquisition/out/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
